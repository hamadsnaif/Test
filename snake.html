<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="./icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="./icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="./icon-120.png">
<link rel="icon" sizes="192x192" href="./icon-192.png" type="image/png">
<meta name="robots" content="noindex, nofollow">
<script>if('serviceWorker' in navigator && /^https?:$/.test(location.protocol))addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(function(){});});</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snake II">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Nokia Snake II - لعبة الدودة</title>
<style>
  :root {
    /* شاشة 3310: رمادي مخضرّ باهت، لا أخضر الغيم بوي الفاقع */
    --lcd-bg: #a8b593;
    --lcd-dark: #21261a;
    --lcd-mid: #4a5340;
    --lcd-light: #b6c2a2;
    /* الغطاء الأمامي الأزرق الرمادي المميّز للجهاز */
    --face-hi: #d3dae1;
    --face: #b9c2cc;
    --face-lo: #9aa4b0;
    --key-bg: #aeb8c4;
    --key-hi: #ccd4dd;
    --key-lo: #8f99a6;
    --key-ink: #1e242b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { height: 100%; background: #0e1013; }

  body {
    min-height: 100%;
    background: radial-gradient(ellipse at top, #2b3038 0%, #0e1013 70%) fixed;
    color: #ddd;
    font-family: "Courier New", Courier, monospace;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
    overflow-x: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
  }

  /* ---------- Phone shell ---------- */
  /* ==================== نوكيا 3310 ====================
     الجهاز بكامله: غطاء أمامي أزرق رمادي، سمّاعة، شاشة غائرة، ثم صفّ
     المفاتيح الوظيفية بمفتاح C الأحمر، ثم أربعة صفوف مقوّسة من الأرقام.
     التقويس هو أبرز ما يُعرف به الجهاز، فكل صف قطعة واحدة منحنية. */
  .phone {
    width: 100%;
    max-width: min(380px, 52vh);
    background:
      linear-gradient(174deg, var(--face-hi) 0%, var(--face) 44%, var(--face-lo) 100%);
    border-radius: 46px 46px 34px 34px / 58px 58px 30px 30px;
    padding: 16px 14px 18px;
    border: 1px solid #e6ebf0;
    box-shadow:
      0 26px 54px rgba(0,0,0,.66),
      inset 0 2px 0 rgba(255,255,255,.95),
      inset 0 -4px 10px rgba(0,0,0,.14);
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .speaker {
    width: 56px; height: 7px; margin: 0 auto 1px;
    border-radius: 5px;
    background: #6d7784;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.85);
  }

  .brand {
    text-align: center;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    letter-spacing: 4px;
    font-size: 13px;
    color: #4a5460;
    direction: ltr;
  }

  /* ---------- Screen ---------- */
  .screen-bezel {
    background: #2f3740;
    border-radius: 7px;
    padding: 8px;
    box-shadow: inset 0 2px 7px rgba(0,0,0,.85), 0 1px 0 rgba(255,255,255,.8);
  }

  .screen {
    position: relative;
    background: var(--lcd-bg);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: inset 0 0 20px rgba(33,38,26,.28);
  }

  .screen::after {
    /* subtle LCD pixel grid */
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(33,38,26,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(33,38,26,.07) 1px, transparent 1px);
    background-size: 4px 4px;
  }

  .hud {
    direction: ltr;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 10px 2px;
    color: var(--lcd-dark);
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 1px;
  }
  .hud .hud-right { display: inline-flex; align-items: center; gap: 8px; }
  .hud .mute {
    background: transparent;
    border: 2px solid var(--lcd-dark);
    color: var(--lcd-dark);
    width: 22px; height: 22px;
    border-radius: 3px;
    font-size: 13px; line-height: 1;
    font-family: inherit; font-weight: bold;
    cursor: pointer;
    padding: 0;
  }
  .hud .mute.off { color: var(--lcd-bg); background: var(--lcd-dark); text-decoration: line-through; }
  .hud .bonus { visibility: hidden; }
  .hud .bonus.on { visibility: visible; animation: blink .5s steps(2) infinite; }
  @keyframes blink { to { opacity: .2; } }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    color: var(--lcd-dark);
    text-align: center;
    padding: 16px;
    background: rgba(168,181,147,.94);
  }
  .overlay.hidden { display: none; }
  .overlay { gap: 7px; padding: 10px; overflow: hidden; }
  .overlay h1 {
    font-size: 23px;
    letter-spacing: 2px;
    font-family: Arial Black, Arial, sans-serif;
    direction: ltr;
  }
  .overlay h2 { font-size: 18px; }
  .overlay p { font-size: 11.5px; line-height: 1.55; max-width: 100%; }
  .overlay p.tiny { font-size: 10px; }
  .overlay .big { font-size: 32px; font-weight: 900; }
  .overlay .btn {
    margin-top: 2px;
    font-size: 13px;
    padding: 6px 18px;
    background: var(--lcd-dark);
    color: var(--lcd-bg);
    border: none;
    padding: 8px 22px;
    font-family: inherit;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    border-radius: 3px;
    letter-spacing: 1px;
  }
  .overlay .btn:active { transform: translateY(1px); }

  .levels {
    direction: ltr;
    display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
  }
  .levels { gap: 4px; }
  .levels button {
    background: transparent;
    border: 2px solid var(--lcd-dark);
    color: var(--lcd-dark);
    width: 23px; height: 23px;
    font-size: 11px;
    font-family: inherit; font-weight: bold;
    cursor: pointer;
    border-radius: 3px;
  }
  .levels button.sel { background: var(--lcd-dark); color: var(--lcd-bg); }

  /* ---------- Keypad ---------- */
  .keypad { display: flex; flex-direction: column; gap: 7px; direction: ltr; }

  /* صفّ الوظائف. المفتاحان الجانبيان مائلان للخارج كما في الجهاز، ومفتاح
     التمرير بينهما، وC أحمر إلى اليمين. */
  .fnrow {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto;
    align-items: center;
    gap: 6px;
  }
  .soft, .ckey, .sc, .nk {
    appearance: none; -webkit-appearance: none;
    border: 1px solid #8f99a6;
    background: linear-gradient(180deg, var(--key-hi), var(--key-bg) 65%, var(--key-lo));
    color: var(--key-ink);
    font-family: inherit;
    cursor: pointer;
    padding: 0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 2px 0 #79838f;
    touch-action: none;
  }
  .soft {
    height: 33px;
    font-size: 12.5px;
  }
  .soft.l { border-radius: 16px 6px 6px 16px; }
  .soft.r { border-radius: 6px 16px 16px 6px; }
  .ckey {
    width: 42px; height: 33px;
    border-radius: 6px 16px 16px 6px;
    background: linear-gradient(180deg, #e0655a, #b23a2e 70%);
    border-color: #8f2a20;
    color: #fff1ee;
    font-weight: 700;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 2px 0 #71180f;
  }
  /* مفتاح التمرير: قطعة واحدة بسهمين ومركز */
  .scroll {
    position: relative;
    width: 66px; height: 48px;
  }
  .sc { position: absolute; left: 0; width: 66px; font-size: 10px; }
  .sc.up { top: 0; height: 19px; border-radius: 15px 15px 3px 3px; }
  .sc.dn { bottom: 0; height: 19px; border-radius: 3px 3px 15px 15px; }
  .sc.ok {
    top: 17px; height: 14px; border-radius: 2px;
    background: linear-gradient(180deg, #9aa4b0, #828d9a);
    box-shadow: inset 0 1px 2px rgba(0,0,0,.35);
  }

  /* الأرقام. كل صف قطعة واحدة مقوّسة، والتقويس يزداد نزولاً — وهذا
     بالذات ما يجعل الجهاز يُعرف من صورته. */
  .rows { display: flex; flex-direction: column; gap: 6px; }
  .krow { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
  .nk {
    height: 38px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 0;
    line-height: 1;
  }
  .krow:nth-child(1) .nk { border-radius: 16px 16px 8px 8px / 20px 20px 8px 8px; }
  .krow:nth-child(2) .nk,
  .krow:nth-child(3) .nk { border-radius: 10px / 14px; }
  .krow:nth-child(4) .nk { border-radius: 8px 8px 18px 18px / 8px 8px 22px 22px; }
  .krow .nk:first-child { border-top-left-radius: 20px; border-bottom-left-radius: 20px; }
  .krow .nk:last-child  { border-top-right-radius: 20px; border-bottom-right-radius: 20px; }
  .nk b { font-size: 15px; font-weight: 700; }
  .nk i { font-size: 7px; font-style: normal; letter-spacing: .5px; color: #5c6672; }
  /* المفاتيح التي تقود الدودة تحمل لمسة لون، كما على الجهاز الحقيقي
     تُعرف 2 و4 و6 و8 بالأسهم المطبوعة عليها */
  .nk.live b { color: #14502a; }

  .soft:active, .ckey:active, .sc:active, .nk:active,
  .soft.down, .ckey.down, .sc.down, .nk.down {
    transform: translateY(2px);
    box-shadow: inset 0 1px 3px rgba(0,0,0,.3);
    filter: brightness(.96);
  }


  @media (max-height: 780px) {
    .phone { padding: 12px 11px 13px; gap: 7px; }
    .nk { height: 29px; }
    .nk i { display: none; }
    .soft, .ckey { height: 27px; }
    .scroll { height: 40px; }
    .sc.up, .sc.dn { height: 15px; }
    .sc.ok { top: 13px; }
  }
  @media (max-height: 640px) {
    .phone { gap: 5px; padding: 9px 9px 10px; }
    .nk { height: 24px; }
    .nk b { font-size: 13px; }
    .brand { font-size: 11px; }
    .overlay { gap: 5px; padding: 7px; }
    .overlay h1 { font-size: 17px; }
    .overlay h2 { font-size: 15px; }
    .overlay p { font-size: 9.5px; line-height: 1.45; }
    .overlay p.tiny { font-size: 8.5px; }
    .overlay .big { font-size: 24px; }
    .overlay .btn { font-size: 11px; padding: 5px 14px; }
    .levels button { width: 19px; height: 19px; font-size: 9.5px; }
  }
  /* إطار قصير جداً: الجهاز كله يصغر ليُرى بكامله، وهو المطلوب */
  @media (max-height: 470px) {
    .phone { gap: 3px; padding: 6px 7px 7px; border-width: 1px; }
    .speaker { display: none; }
    .brand { font-size: 9px; letter-spacing: 2px; }
    .nk { height: 19px; }
    .nk b { font-size: 11px; }
    .soft, .ckey { height: 20px; font-size: 9.5px; }
    .scroll { width: 48px; height: 30px; }
    .sc { width: 48px; }
    .sc.up, .sc.dn { height: 12px; }
    .sc.ok { top: 10px; height: 9px; }
    .rows, .keypad { gap: 3px; }
    .krow { gap: 3px; }
    .screen-bezel { padding: 5px; }
    /* الشاشة هنا صغيرة فعلاً، فالنصّ يُقاس على قدرها */
    .overlay { gap: 3px; padding: 5px; }
    .overlay h1 { font-size: 13px; letter-spacing: 1px; }
    .overlay h2 { font-size: 12px; }
    .overlay p { font-size: 7.5px; line-height: 1.4; }
    .overlay p.tiny { display: none; }
    .overlay .big { font-size: 19px; }
    .overlay .btn { font-size: 9px; padding: 4px 11px; margin-top: 0; }
    .levels { gap: 3px; }
    .levels button { width: 15px; height: 15px; font-size: 8px; border-width: 1px; }
  }
</style>
</head>
<body>

<div class="phone">
  <div class="speaker"></div>
  <div class="brand">NOKIA</div>

  <div class="screen-bezel">
    <div class="screen">
      <div class="hud">
        <span id="score">0000</span>
        <span id="bonus" class="bonus">★ <span id="bonusTimer">20</span></span>
        <span class="hud-right">
          <span id="best">TOP 0000</span>
          <button id="muteBtn" class="mute" aria-label="كتم الصوت" title="الصوت (M)">♪</button>
        </span>
      </div>
      <canvas id="game" width="320" height="240"></canvas>

      <div id="menu" class="overlay">
        <h1>SNAKE II</h1>
        <p>الحواف مفتوحة: اخرج من جهة تعُد من المقابلة.</p>
        <p>السرعة:</p>
        <div class="levels" id="levels"></div>
        <button class="btn" id="startBtn">ابدأ</button>
        <p class="tiny">وجّه بمفاتيح الجهاز: 2 و4 و6 و8، أو بمفتاح التمرير.</p>
      </div>

      <div id="paused" class="overlay hidden">
        <h2>إيقاف مؤقت</h2>
        <p>اضغط مسافة للمتابعة</p>
        <button class="btn" id="resumeBtn">متابعة</button>
      </div>

      <div id="gameover" class="overlay hidden">
        <h2>انتهت اللعبة</h2>
        <div class="big" id="finalScore">0</div>
        <p id="recordMsg"></p>
        <button class="btn" id="againBtn">العب مرة أخرى</button>
        <button class="btn" id="menuBtn">القائمة</button>
      </div>
    </div>
  </div>

  <div class="keypad">
    <!-- صفّ الوظائف: مفتاحان جانبيان، ومفتاح التمرير بينهما، وC الأحمر -->
    <div class="fnrow">
      <button class="soft l" id="softLeft">قائمة</button>
      <div class="scroll">
        <button class="sc up" data-dir="up" aria-label="أعلى">▲</button>
        <button class="sc ok" id="okBtn" aria-label="اختيار"></button>
        <button class="sc dn" data-dir="down" aria-label="أسفل">▼</button>
      </div>
      <button class="soft r" id="softRight">إيقاف</button>
      <button class="ckey" id="clearKey" aria-label="إيقاف">C</button>
    </div>

    <!-- الأرقام: أربعة صفوف مقوّسة، وهي أبرز معالم الجهاز -->
    <div class="rows">
      <div class="krow">
        <button class="nk" data-k="1"><b>1</b><i>&nbsp;</i></button>
        <button class="nk live" data-k="2" data-dir="up"><b>2</b><i>abc</i></button>
        <button class="nk" data-k="3"><b>3</b><i>def</i></button>
      </div>
      <div class="krow">
        <button class="nk live" data-k="4" data-dir="left"><b>4</b><i>ghi</i></button>
        <button class="nk" data-k="5"><b>5</b><i>jkl</i></button>
        <button class="nk live" data-k="6" data-dir="right"><b>6</b><i>mno</i></button>
      </div>
      <div class="krow">
        <button class="nk" data-k="7"><b>7</b><i>pqrs</i></button>
        <button class="nk live" data-k="8" data-dir="down"><b>8</b><i>tuv</i></button>
        <button class="nk" data-k="9"><b>9</b><i>wxyz</i></button>
      </div>
      <div class="krow">
        <button class="nk" data-k="*"><b>*</b><i>+</i></button>
        <button class="nk" data-k="0"><b>0</b><i>&nbsp;</i></button>
        <button class="nk" data-k="#"><b>#</b><i>&nbsp;</i></button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---------- Grid & rendering constants ----------
  const COLS = 32;
  const ROWS = 24;
  const CELL = 10;               // canvas pixels per cell (canvas is 320x240)
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  /* ألوان شاشة 3310 نفسها: رمادي مخضرّ باهت وحبر شبه أسود */
  const COLOR_BG   = '#a8b593';
  const COLOR_DARK = '#21261a';
  const COLOR_MID  = '#4a5340';

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const scoreEl = $('score'), bestEl = $('best');
  const bonusEl = $('bonus'), bonusTimerEl = $('bonusTimer');
  const menuEl = $('menu'), pausedEl = $('paused'), overEl = $('gameover');
  const finalScoreEl = $('finalScore'), recordMsgEl = $('recordMsg');
  const levelsEl = $('levels');

  // ---------- Persistent high score ----------
  const BEST_KEY = 'nokia-snake-best';
  let best = 0;
  try { best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (e) { best = 0; }

  // ---------- Game state ----------
  const DIRS = {
    up:    { x: 0,  y: -1 },
    down:  { x: 0,  y: 1 },
    left:  { x: -1, y: 0 },
    right: { x: 1,  y: 0 },
  };
  const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };

  let level = 5;                 // 1..9 like the original
  let state = 'menu';            // menu | playing | paused | over
  let snake = [];                // array of {x,y}, head first
  let dir = 'right';
  let dirQueue = [];             // buffered turns so quick double-taps register
  let food = null;
  let bonus = null;              // {x,y,ticksLeft}
  let foodsEaten = 0;
  let score = 0;
  let growBy = 0;
  let timer = null;
  let flashTicks = 0;            // death animation

  const levelDelay = lvl => Math.round(300 - (lvl - 1) * 27); // ms per tick: 300 → 84

  // ---------- Level picker ----------
  for (let i = 1; i <= 9; i++) {
    const b = document.createElement('button');
    b.textContent = i;
    b.dataset.level = i;
    if (i === level) b.classList.add('sel');
    b.addEventListener('click', () => {
      level = i;
      [...levelsEl.children].forEach(c => c.classList.toggle('sel', +c.dataset.level === level));
    });
    levelsEl.appendChild(b);
  }

  // ---------- Helpers ----------
  const pad4 = n => String(n).padStart(4, '0');
  function updateHud() {
    scoreEl.textContent = pad4(score);
    bestEl.textContent = 'TOP ' + pad4(best);
    if (bonus) {
      bonusEl.classList.add('on');
      bonusTimerEl.textContent = Math.ceil(bonus.ticksLeft / 2);
    } else {
      bonusEl.classList.remove('on');
    }
  }

  function isOccupied(x, y) {
    return snake.some(s => s.x === x && s.y === y)
        || (food && food.x === x && food.y === y)
        || (bonus && bonus.x === x && bonus.y === y);
  }

  function randomFreeCell() {
    let tries = 0;
    while (tries++ < 2000) {
      const x = Math.floor(Math.random() * COLS);
      const y = Math.floor(Math.random() * ROWS);
      if (!isOccupied(x, y)) return { x, y };
    }
    return null;
  }

  function spawnFood() {
    food = randomFreeCell();
  }

  function spawnBonus() {
    // bonus needs 2 free horizontal cells (the classic "bug")
    for (let t = 0; t < 500; t++) {
      const x = Math.floor(Math.random() * (COLS - 1));
      const y = Math.floor(Math.random() * ROWS);
      if (!isOccupied(x, y) && !isOccupied(x + 1, y)) {
        bonus = { x, y, ticksLeft: 40 };
        return;
      }
    }
  }

  // ---------- Sound (Web Audio, no external files) ----------
  const SOUND_KEY = 'nokia-snake-sound';
  let soundOn = true;
  try { soundOn = localStorage.getItem(SOUND_KEY) !== 'off'; } catch (e) {}
  const muteBtn = $('muteBtn');

  let actx = null;
  function audioCtx() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  // iOS/Safari only allow audio after a user gesture: warm the context on the first one.
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev =>
    document.addEventListener(ev, () => { if (soundOn) audioCtx(); }, { passive: true }));

  // Square-wave beeps, like a monophonic phone speaker.
  // notes: array of [frequencyHz, durationMs, gapMs?]; 0 Hz = rest
  function play(notes, vol = 0.08) {
    if (!soundOn) return;
    const ac = audioCtx();
    if (!ac) return;
    let t = ac.currentTime;
    for (const [freq, dur, gap = 15] of notes) {
      if (freq > 0) {
        const osc = ac.createOscillator();
        const g = ac.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.004);
        g.gain.setValueAtTime(vol, t + dur / 1000 - 0.008);
        g.gain.linearRampToValueAtTime(0, t + dur / 1000);
        osc.connect(g).connect(ac.destination);
        osc.start(t);
        osc.stop(t + dur / 1000 + 0.01);
      }
      t += (dur + gap) / 1000;
    }
  }

  const SFX = {
    eat:        () => play([[880, 45]]),
    turn:       () => play([[220, 12]], 0.025),
    bonusShow:  () => play([[1175, 40], [1568, 40], [1175, 40], [1568, 40]]),
    bonusEat:   () => play([[988, 50], [1319, 50], [1760, 90]]),
    bonusGone:  () => play([[330, 60], [262, 90]], 0.05),
    start:      () => play([[659, 70], [784, 70], [988, 70], [1319, 140]]),
    pause:      () => play([[523, 40], [392, 60]]),
    resume:     () => play([[392, 40], [523, 60]]),
    over:       () => play([[494, 120], [440, 120], [392, 120], [349, 120], [0, 60], [262, 320]]),
    record:     () => play([[784, 60], [988, 60], [1175, 60], [1568, 60], [0, 40], [1568, 60], [0, 40], [1568, 180]]),
    click:      () => play([[660, 25]], 0.05),
  };

  function updateMuteBtn() {
    muteBtn.classList.toggle('off', !soundOn);
    muteBtn.setAttribute('aria-label', soundOn ? 'كتم الصوت' : 'تشغيل الصوت');
  }
  function toggleSound() {
    soundOn = !soundOn;
    try { localStorage.setItem(SOUND_KEY, soundOn ? 'on' : 'off'); } catch (e) {}
    updateMuteBtn();
    if (soundOn) SFX.click();
  }
  muteBtn.addEventListener('click', e => { e.stopPropagation(); toggleSound(); });
  updateMuteBtn();

  // ---------- Game lifecycle ----------
  function resetGame() {
    const cy = Math.floor(ROWS / 2);
    snake = [];
    for (let i = 0; i < 5; i++) snake.push({ x: 8 - i, y: cy });
    dir = 'right';
    dirQueue = [];
    score = 0;
    growBy = 0;
    foodsEaten = 0;
    bonus = null;
    flashTicks = 0;
    spawnFood();
    updateHud();
  }

  function showOverlay(which) {
    menuEl.classList.toggle('hidden', which !== 'menu');
    pausedEl.classList.toggle('hidden', which !== 'paused');
    overEl.classList.toggle('hidden', which !== 'over');
  }

  function startGame() {
    resetGame();
    state = 'playing';
    showOverlay(null);
    SFX.start();
    startLoop();
    draw();
  }

  function startLoop() {
    stopLoop();
    timer = setInterval(tick, levelDelay(level));
  }
  function stopLoop() {
    if (timer) clearInterval(timer);
    timer = null;
  }

  function pauseGame() {
    if (state !== 'playing') return;
    state = 'paused';
    stopLoop();
    SFX.pause();
    showOverlay('paused');
  }
  function resumeGame() {
    if (state !== 'paused') return;
    state = 'playing';
    showOverlay(null);
    SFX.resume();
    startLoop();
  }
  function togglePause() {
    if (state === 'playing') pauseGame();
    else if (state === 'paused') resumeGame();
  }

  function gameOver() {
    state = 'over';
    stopLoop();
    let record = false;
    if (score > best) {
      best = score;
      record = true;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
    }
    updateHud();
    if (record) SFX.record(); else SFX.over();
    // death flash animation, then overlay
    flashTicks = 6;
    const flash = setInterval(() => {
      flashTicks--;
      draw();
      if (flashTicks <= 0) {
        clearInterval(flash);
        finalScoreEl.textContent = score;
        recordMsgEl.textContent = record ? '🏆 رقم قياسي جديد!' : 'أفضل نتيجة: ' + best;
        showOverlay('over');
      }
    }, 150);
  }

  function goMenu() {
    stopLoop();
    state = 'menu';
    resetGame();
    showOverlay('menu');
    draw();
  }

  // ---------- Input ----------
  function queueDir(d) {
    if (!DIRS[d]) return;
    const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
    if (d === last || d === OPPOSITE[last]) return;
    if (dirQueue.length < 3) { dirQueue.push(d); SFX.turn(); }
  }

  const KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right',
    // Nokia keypad layout: 2 up, 8 down, 4 left, 6 right
    '2': 'up', '8': 'down', '4': 'left', '6': 'right',
  };

  document.addEventListener('keydown', e => {
    const d = KEYMAP[e.key];
    if (d) {
      e.preventDefault();
      if (state === 'menu') startGame();
      if (state === 'playing') queueDir(d);
      return;
    }
    if (e.key === ' ' || e.key === 'p' || e.key === 'P') {
      e.preventDefault();
      if (state === 'menu') startGame();
      else if (state === 'over') startGame();
      else togglePause();
    }
    if (e.key === 'Enter') {
      if (state === 'menu' || state === 'over') startGame();
      else if (state === 'paused') resumeGame();
    }
    if (e.key === 'm' || e.key === 'M') { toggleSound(); return; }
    if (e.key === 'Escape') {
      if (state === 'playing') pauseGame();
      else if (state === 'paused' || state === 'over') goMenu();
    }
  });

  // كل مفتاح يحمل اتجاهاً يقود الدودة: مفتاح التمرير، و2/4/6/8 كما على الجهاز
  document.querySelectorAll('.keypad [data-dir]').forEach(btn => {
    const handler = e => {
      e.preventDefault();
      if (state === 'menu') startGame();
      if (state === 'playing') queueDir(btn.dataset.dir);
    };
    btn.addEventListener('pointerdown', handler);
  });

  // بقيّة الأرقام لا توجّه، لكنها تضغط: 5 يبدأ ويختار، وC يوقف
  document.querySelectorAll('.nk:not([data-dir])').forEach(btn => {
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (btn.dataset.k === '5' && (state === 'menu' || state === 'over')) startGame();
    });
  });
  $('clearKey').addEventListener('pointerdown', e => {
    e.preventDefault();
    if (state === 'playing' || state === 'paused') togglePause();
  });

  $('okBtn').addEventListener('click', () => {
    if (state === 'menu' || state === 'over') startGame();
    else togglePause();
  });
  $('softLeft').addEventListener('click', goMenu);
  $('softRight').addEventListener('click', () => {
    if (state === 'playing' || state === 'paused') togglePause();
  });
  $('startBtn').addEventListener('click', startGame);
  $('resumeBtn').addEventListener('click', resumeGame);
  $('againBtn').addEventListener('click', startGame);
  $('menuBtn').addEventListener('click', goMenu);

  // Swipe on the screen
  let touchStart = null;
  const screen = document.querySelector('.screen');
  screen.addEventListener('touchstart', e => {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  screen.addEventListener('touchmove', e => {
    if (!touchStart) return;
    const t = e.touches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    const TH = 24;
    if (Math.abs(dx) < TH && Math.abs(dy) < TH) return;
    const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    if (state === 'playing') queueDir(d);
    touchStart = null;
  }, { passive: true });
  screen.addEventListener('touchend', () => { touchStart = null; }, { passive: true });

  // Pause automatically when tab is hidden
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') pauseGame();
  });

  // ---------- Game tick ----------
  function tick() {
    if (dirQueue.length) dir = dirQueue.shift();
    const v = DIRS[dir];
    const head = snake[0];
    // Open edges: leaving one side brings the snake back in from the opposite side
    const nx = (head.x + v.x + COLS) % COLS;
    const ny = (head.y + v.y + ROWS) % ROWS;

    // Self collision (tail tip is allowed since it moves away this tick, unless we grow)
    const bodyToCheck = growBy > 0 ? snake : snake.slice(0, -1);
    if (bodyToCheck.some(s => s.x === nx && s.y === ny)) return gameOver();

    snake.unshift({ x: nx, y: ny });

    // Eat regular food
    if (food && nx === food.x && ny === food.y) {
      score += level;
      growBy += 1;
      foodsEaten++;
      food = null;
      spawnFood();
      SFX.eat();
      if (foodsEaten % 5 === 0 && !bonus) { spawnBonus(); if (bonus) SFX.bonusShow(); }
    }
    // Eat bonus (2 cells wide)
    else if (bonus && ny === bonus.y && (nx === bonus.x || nx === bonus.x + 1)) {
      score += level * Math.max(1, Math.ceil(bonus.ticksLeft / 4));
      growBy += 2;
      bonus = null;
      SFX.bonusEat();
    }

    if (growBy > 0) growBy--;
    else snake.pop();

    if (bonus) {
      bonus.ticksLeft--;
      if (bonus.ticksLeft <= 0) { bonus = null; SFX.bonusGone(); }
    }

    updateHud();
    draw();
  }

  // ---------- Drawing ----------
  function cellRect(x, y, inset = 1) {
    ctx.fillRect(x * CELL + inset, y * CELL + inset, CELL - inset * 2, CELL - inset * 2);
  }

  function drawSnake() {
    ctx.fillStyle = COLOR_DARK;
    for (let i = snake.length - 1; i >= 1; i--) {
      const s = snake[i];
      // body segment with a small "checker" hole for the classic look
      cellRect(s.x, s.y, 1);
      ctx.fillStyle = COLOR_BG;
      ctx.fillRect(s.x * CELL + 4, s.y * CELL + 4, 2, 2);
      ctx.fillStyle = COLOR_DARK;
    }
    // head: solid with an eye
    const h = snake[0];
    cellRect(h.x, h.y, 0);
    ctx.fillStyle = COLOR_BG;
    const v = DIRS[dir];
    const ex = h.x * CELL + 5 + v.x * 2 - (v.y !== 0 ? 2 : 0);
    const ey = h.y * CELL + 5 + v.y * 2 - (v.x !== 0 ? 2 : 0);
    ctx.fillRect(ex, ey, 2, 2);
  }

  function drawFood() {
    if (!food) return;
    ctx.fillStyle = COLOR_DARK;
    // small diamond
    const cx = food.x * CELL, cy = food.y * CELL;
    ctx.fillRect(cx + 4, cy + 2, 2, 6);
    ctx.fillRect(cx + 2, cy + 4, 6, 2);
    ctx.fillRect(cx + 3, cy + 3, 4, 4);
  }

  function drawBonus() {
    if (!bonus) return;
    ctx.fillStyle = COLOR_DARK;
    const bx = bonus.x * CELL, by = bonus.y * CELL;
    // a little "bug": body of 2 cells wide, with legs
    ctx.fillRect(bx + 3, by + 3, 14, 4);
    ctx.fillRect(bx + 5, by + 1, 10, 8);
    ctx.fillStyle = COLOR_BG;
    ctx.fillRect(bx + 7, by + 3, 2, 2);
    ctx.fillRect(bx + 11, by + 3, 2, 2);
    ctx.fillStyle = COLOR_MID;
    ctx.fillRect(bx + 1, by + 2, 2, 1); ctx.fillRect(bx + 17, by + 2, 2, 1);
    ctx.fillRect(bx + 1, by + 7, 2, 1); ctx.fillRect(bx + 17, by + 7, 2, 1);
  }

  function drawBorder() {
    // dashed frame: the edges are open, the snake wraps around
    ctx.strokeStyle = COLOR_MID;
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.strokeRect(1, 1, canvas.width - 2, canvas.height - 2);
    ctx.setLineDash([]);
  }

  function draw() {
    ctx.fillStyle = COLOR_BG;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawBorder();
    drawFood();
    drawBonus();
    // death flash: alternate hiding the snake
    if (state === 'over' && flashTicks % 2 === 1) return;
    drawSnake();
  }

  // ---------- Boot ----------
  resetGame();
  showOverlay('menu');
  draw();
})();
</script>
</body>
</html>
