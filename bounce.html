<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="./icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="./icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="./icon-120.png">
<link rel="icon" sizes="192x192" href="./icon-192.png" type="image/png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bounce">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bounce</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --ground: #14161c;
    --key: #2b3040;
    --key-down: #3d4460;
    --key-ink: #dfe6f5;
    --amber: #e59a4d;
    --muted: #8a93a8;
    --border: #3a4152;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    position: fixed;
    inset: 0;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    background: var(--ground);
    color: var(--key-ink);
    font-family: Tahoma, "Segoe UI", -apple-system, Arial, sans-serif;
  }
  #shell {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding-inline: 16px;
    padding-block: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-bottom));
  }
  #top {
    display: flex;
    align-items: baseline;
    gap: 12px;
    width: 100%;
    max-width: 720px;
    justify-content: space-between;
    flex: 0 0 auto;
  }
  #brand { font-family: "Courier New", monospace; font-weight: 700; font-size: 16px; letter-spacing: 3px; color: var(--amber); margin: 0; }
  #sub { font-size: 12px; color: var(--muted); direction: rtl; }
  #stage {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game {
    display: block;
    background: #000;
    border: 3px solid var(--border);
    border-radius: 4px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
  }
  #pad {
    flex: 0 0 auto;
    width: 100%;
    max-width: 720px;
    display: none;
    grid-template-columns: 0.55fr 1fr 1fr 1.4fr;
    gap: 10px;
    direction: ltr;
  }
  #pad button {
    height: 72px;
    font-size: 26px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--key);
    color: var(--key-ink);
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.35);
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    padding: 0;
  }
  #pad button.down, #pad button:active {
    background: var(--key-down);
    box-shadow: inset 0 3px 0 rgba(0,0,0,.35);
    transform: translateY(2px);
  }
  #pad button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  /* joystick scheme */
  #stickpad {
    flex: 0 0 auto;
    width: 100%;
    max-width: 720px;
    height: 132px;
    display: none;
    position: relative;
    direction: ltr;
    touch-action: none;
  }
  #stickzone, #jumpzone {
    position: absolute;
    top: 0;
    height: 100%;
    width: 42%;
    touch-action: none;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: rgba(43, 48, 64, 0.35);
  }
  #stickzone { left: 0; }
  #jumpzone {
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    color: var(--key-ink);
  }
  #jumpzone.down { background: var(--key-down); }
  #jumpdot {
    width: 92px; height: 92px;
    border-radius: 50%;
    background: var(--key);
    border: 1px solid var(--border);
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  #jumpzone.down #jumpdot { background: var(--key-down); box-shadow: inset 0 3px 0 rgba(0,0,0,.35); }
  #stickbase {
    position: absolute;
    width: 104px; height: 104px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: rgba(43, 48, 64, 0.5);
    left: 14px; top: 14px;
    pointer-events: none;
    opacity: .6;
  }
  #stickbase.active { opacity: 1; }
  #stickknob {
    position: absolute;
    left: 28px; top: 28px;
    width: 48px; height: 48px;
    border-radius: 50%;
    background: var(--key);
    border: 1px solid var(--border);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.35);
  }
  #stickbase.active #stickknob { background: var(--key-down); }
  #btnM2 {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 52px; height: 52px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--key);
    color: var(--key-ink);
    font-size: 20px;
    padding: 0;
    touch-action: none;
  }
  #btnM2:active { background: var(--key-down); }
  body.touch.joystick #pad { display: none; }
  body.touch.joystick #stickpad { display: block; }
  /* landscape: float the stick and the jump pad in the side margins so the
     game itself can use the whole height */
  @media (orientation: landscape) and (max-height: 560px) {
    body.touch.joystick #shell { position: relative; }
    body.touch.joystick #stickpad {
      position: absolute;
      inset: 0;
      height: auto;
      max-width: none;
      pointer-events: none;
    }
    body.touch.joystick #stickzone,
    body.touch.joystick #jumpzone {
      pointer-events: auto;
      width: min(150px, 22vw);
      height: min(160px, 46vh);
      top: auto;
      bottom: max(10px, env(safe-area-inset-bottom));
    }
    body.touch.joystick #stickzone { left: max(10px, env(safe-area-inset-left)); }
    body.touch.joystick #jumpzone { right: max(10px, env(safe-area-inset-right)); }
    body.touch.joystick #btnM2 {
      pointer-events: auto;
      left: auto; top: max(8px, env(safe-area-inset-top));
      right: max(10px, env(safe-area-inset-right));
      transform: none;
    }
  }
  #hint { font-size: 12px; color: var(--muted); direction: rtl; text-align: center; flex: 0 0 auto; }
  body.touch:not(.joystick) #pad { display: grid; }
  body.touch #hint-keys { display: none; }
  body:not(.touch) #hint-touch { display: none; }
  @media (max-height: 460px) {
    #shell { gap: 6px; }
    #top, #hint { display: none; }
    #pad button { height: 56px; font-size: 22px; }
    #stickpad { height: 104px; }
    #stickbase { width: 88px; height: 88px; }
    #stickknob { left: 22px; top: 22px; width: 42px; height: 42px; }
    #jumpdot { width: 76px; height: 76px; }
  }
  @media (max-width: 400px) { #sub { display: none; } }
  /* installed as an app: give the whole screen to the game */
  @media (display-mode: standalone), (display-mode: fullscreen) {
    #top, #hint { display: none; }
    #shell { gap: 8px; }
  }
  body.standalone #top, body.standalone #hint { display: none; }
</style>
</head>
<body>
<div id="shell">
  <div id="top">
    <h1 id="brand">BOUNCE</h1>
    <div id="sub">نوكيا، المراحل الإحدى عشرة الأصلية</div>
  </div>
  <div id="stage"><canvas id="game" width="384" height="384"></canvas></div>
  <div id="pad">
    <button id="btnM" aria-label="القائمة">☰</button>
    <button id="btnL" aria-label="يسار">◀ 4</button>
    <button id="btnR" aria-label="يمين">6 ▶</button>
    <button id="btnJ" aria-label="قفز">2 ▲ قفز</button>
  </div>
  <div id="stickpad">
    <div id="stickzone"><div id="stickbase"><div id="stickknob"></div></div></div>
    <button id="btnM2" aria-label="القائمة">☰</button>
    <div id="jumpzone"><div id="jumpdot">قفز</div></div>
  </div>
  <div id="hint">
    <span id="hint-keys">← → أو 4 / 6 للحركة، ↑ أو 2 أو المسافة للقفز، Esc للإيقاف المؤقت والعودة للقائمة. التقدم يُحفظ تلقائياً.</span>
    <span id="hint-touch">بدّل بين الأزرار والعصا من القائمة. ☰ للإيقاف المؤقت. التقدم يُحفظ تلقائياً.</span>
  </div>
</div>

    }
    if (k) { e.preventDefault(); if (!e.repeat) setKey(k, true); }
    if (mode !== 'play' && !e.repeat && (k || e.code === 'Enter')) press();
  });
  window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) setKey(k, false); });
  window.addEventListener('blur', clearKeys);
  document.addEventListener('visibilitychange', () => { if (document.hidden) clearKeys(); });

  function bindTouch(id, k) {
    const el = document.getElementById(id);
    let id_ = null;
    const on = e => {
      e.preventDefault(); unlockAudio(); el.classList.add('down');
      if (mode === 'menu' || mode === 'pause') { if (k === 'left') moveSel(-1); else if (k === 'right') moveSel(1); else press(); return; }
      id_ = e.pointerId;
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* older engines */ }
      setFrom('pad', k, true);
      if (mode !== 'play') press();
    };
    const off = e => {
      if (id_ !== null && e.pointerId !== id_) return;
      e.preventDefault(); id_ = null;
      setFrom('pad', k, false);
      el.classList.remove('down');
    };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
  }
  bindTouch('btnL', 'left'); bindTouch('btnR', 'right'); bindTouch('btnJ', 'up');
  // Floating stick: the base jumps to wherever the thumb lands, so there is
  // nothing small to hit. The jump pad is a separate pointer, so steering and
  // jumping never interrupt each other.
  const stickZone = document.getElementById('stickzone');
  const stickBase = document.getElementById('stickbase');
  const stickKnob = document.getElementById('stickknob');
  const jumpZone = document.getElementById('jumpzone');
  const R_MAX = 44, DEAD_X = 9, DEAD_Y = 26;
  let stickId = null, sx0 = 0, sy0 = 0;

  function knob(dx, dy) { stickKnob.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)'; }
  function restStick() {
    const r = stickZone.getBoundingClientRect();
    if (!r.width) return;
    const half = stickBase.offsetWidth / 2;
    stickBase.style.left = (r.width / 2 - half) + 'px';
    stickBase.style.top = (r.height / 2 - half) + 'px';
  }
  stickZone.addEventListener('pointerdown', e => {
    e.preventDefault(); unlockAudio();
    if (mode !== 'play') { press(); return; }
    stickId = e.pointerId;
    try { stickZone.setPointerCapture(e.pointerId); } catch (err) { /* older engines */ }
    sx0 = e.clientX; sy0 = e.clientY;
    const r = stickZone.getBoundingClientRect();
    const half = stickBase.offsetWidth / 2;
    stickBase.style.left = Math.max(0, Math.min(r.width - half * 2, e.clientX - r.left - half)) + 'px';
    stickBase.style.top = Math.max(0, Math.min(r.height - half * 2, e.clientY - r.top - half)) + 'px';
    stickBase.classList.add('active');
    knob(0, 0);
  });
  stickZone.addEventListener('pointermove', e => {
    if (e.pointerId !== stickId) return;
    e.preventDefault();
    let dx = e.clientX - sx0, dy = e.clientY - sy0;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d > R_MAX) { dx = dx / d * R_MAX; dy = dy / d * R_MAX; }
    knob(dx, dy);
    setFrom('stick', 'left', dx < -DEAD_X);
    setFrom('stick', 'right', dx > DEAD_X);
    setFrom('stick', 'up', dy < -DEAD_Y);
  });
  const stickOff = e => {
    if (e.pointerId !== stickId) return;
    e.preventDefault(); stickId = null;
    stickBase.classList.remove('active');
    knob(0, 0);
    restStick();
    setFrom('stick', 'left', false); setFrom('stick', 'right', false); setFrom('stick', 'up', false);
  };
  stickZone.addEventListener('pointerup', stickOff);
  stickZone.addEventListener('pointercancel', stickOff);

  let jumpId = null;
  jumpZone.addEventListener('pointerdown', e => {
    e.preventDefault(); unlockAudio();
    if (mode !== 'play') { press(); return; }
    jumpId = e.pointerId;
    try { jumpZone.setPointerCapture(e.pointerId); } catch (err) { /* older engines */ }
    jumpZone.classList.add('down');
    setFrom('jump', 'up', true);
  });
  const jumpOff = e => {
    if (jumpId !== null && e.pointerId !== jumpId) return;
    e.preventDefault(); jumpId = null;
    jumpZone.classList.remove('down');
    setFrom('jump', 'up', false);
  };
  jumpZone.addEventListener('pointerup', jumpOff);
  jumpZone.addEventListener('pointercancel', jumpOff);

  document.getElementById('btnM2').addEventListener('pointerdown', e => {
    e.preventDefault(); unlockAudio();
    if (mode === 'play' || mode === 'pause') togglePause(); else if (mode === 'splash') openMenu();
  });

  const btnM = document.getElementById('btnM');
  btnM.addEventListener('pointerdown', e => { e.preventDefault(); unlockAudio(); if (mode === 'play' || mode === 'pause') togglePause(); else if (mode === 'splash') openMenu(); });
  view.addEventListener('pointerdown', e => { e.preventDefault(); unlockAudio(); tapAt(e.clientY); });

  // ------------------------------------------------------------------
  // Loop: fixed 40 ms ticks
  // ------------------------------------------------------------------
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(200, now - last); last = now;
    while (acc >= TICK_MS) { tick(); acc -= TICK_MS; }
    draw();
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { last = performance.now(); acc = 0; });

  window.__bounce = () => ({ mode, level: levelNum, x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy, size: ball.size, rings, totalRings, lives, score, exitOpen: exit.open, state: ball.state, camRow, speed: ball.speedBonus });
  window.__bounceDbg = {
    teleport(x, y) { ball.x = x; ball.y = y; ball.vx = 0; ball.vy = 0; ball.grounded = false; },
    size(n) { setSize(n); },
    exitPos() { return [exit.col, exit.row]; },
    menu() { openMenu(); }, sel() { return [menuSel, pauseSel, hiScore, hasSave()]; },
    keys() { return { held: Object.assign({}, held), buffer: jumpBuffer, joystick, sources: JSON.parse(JSON.stringify(sources)) }; },
    setControls(j) { if (j !== joystick) toggleControls(); },
    setBufferTicks(n) { JUMP_BUFFER_TICKS = n; },
    probe(x, y) { const ok = collisionDetection(x, y); const h = ball.half; const t = []; for (let r = Math.trunc((y - h) / T); r < Math.trunc((y - 1 + h) / T) + 1; r++) for (let c = Math.trunc((x - h) / T); c < Math.trunc((x - 1 + h) / T) + 1; c++) t.push([r, c, map[r] ? map[r][c] : -1]); return { ok, t, grounded: ball.grounded }; },
    startLevel(n) { startLevel(n); },
    collectAll() { for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const w = map[r][c] & 64, id = map[r][c] & 63; if (id === 13) { map[r][c] = 17 | w; rings++; } else if (id === 14) map[r][c] = 18 | w; else if (id === 15) { map[r][c] = 19 | w; rings++; } else if (id === 16) map[r][c] = 20 | w; else if (id === 21) { map[r][c] = 25 | w; rings++; } else if (id === 22) map[r][c] = 26 | w; else if (id === 23) { map[r][c] = 27 | w; rings++; } else if (id === 24) map[r][c] = 28 | w; } },
    renderLevel() { const c = mk(LEVEL_W, ROWS * T); drawWorld(c.getContext('2d'), 0, 0, LEVEL_W, ROWS * T); return c.toDataURL(); }
  };

  applyControls();
  restStick();
  loadGraphics().then(() => { loadHiScore(); loadLevel(1); resize(); requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
