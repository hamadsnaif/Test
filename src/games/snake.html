<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الدودة — Snake II</title>
<meta name="apple-mobile-web-app-title" content="Snake II">
<style>
/* ==================== المادة المشتركة: «عاج وألمنيوم مؤكسد» ====================
   جسم من بلاستيك عاجي دافئ كأجهزة السبعينات (آلة حاسبة، راديو جيب)، ولوحة
   شاشة من ألمنيوم داكن مصقول تطوّقها حلقة مؤكسدة بلون اللعبة، ومفاتيح محدّبة
   عاجية يعلوها مفتاح واحد بلون اللعبة. لا سطح مسطّح في الجهاز كله: كل طبقة
   تحمل تدرّجاً خفياً وتموّجاً خافتاً يُقرأ كعرق المادة لا كخطوط.
   كل التفاصيل رسومات CSS لا تكلّف الشاشة بكسلاً واحداً. */
:root {
  --ivory-hi:#f7f2e7; --ivory:#e9e2d1; --ivory-lo:#d5ccb7; --ivory-edge:#b9ae97; --ivory-deep:#a3977e;
  --ink:#2a2723; --engrave:#6e6555;
  --alu-hi:#464a51; --alu:#2b2e33; --alu-lo:#181a1e;
  --mat:#1a1714; --mat-hi:#2f2a24;
  --font-ui: "Helvetica Neue", Helvetica, Arial, Tahoma, "Segoe UI", sans-serif;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
/* ---- الأرضية: بساط لبّاد داكن تحت بقعة ضوء دافئة، لا لون واحد مسطّح ---- */
.ground {
  background:
    radial-gradient(120% 70% at 50% -8%, rgba(255,236,205,.20), rgba(255,236,205,0) 62%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.016) 0 2px, rgba(0,0,0,0) 2px 6px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.016) 0 2px, rgba(0,0,0,0) 2px 6px),
    radial-gradient(110% 90% at 50% 110%, var(--mat-hi), var(--mat) 65%);
}
/* ---- البدن: عاج دافئ بلمعة خفية من أعلى اليسار وتموّج أفقي خافت جداً.
   الحافة حلقة ظلّ لا border كي لا تكلّف بكسلاً من عرض الشاشة ---- */
.unit {
  background:
    radial-gradient(120% 60% at 15% 0%, rgba(255,255,255,.60), rgba(255,255,255,0) 55%),
    repeating-linear-gradient(180deg, rgba(255,255,255,.055) 0 1px, rgba(0,0,0,0) 1px 3px),
    linear-gradient(162deg, var(--ivory-hi) 0%, var(--ivory) 48%, var(--ivory-lo) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 0 -3px 8px rgba(90,70,40,.22),
    inset 0 0 44px rgba(120,95,60,.13),
    0 0 0 1px var(--ivory-edge),
    0 2px 0 var(--ivory-deep),
    0 26px 48px rgba(0,0,0,.62);
}
/* ---- لوحة الشاشة: ألمنيوم داكن بخطوط صقل أفقية وحلقة مؤكسدة بلون اللعبة ---- */
.plate {
  position:relative;
  background:
    repeating-linear-gradient(180deg, rgba(255,255,255,.05) 0 1px, rgba(0,0,0,0) 1px 2px, rgba(0,0,0,.08) 2px 3px),
    linear-gradient(180deg, var(--alu-hi), var(--alu) 55%, var(--alu-lo));
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.07),
    inset 0 0 0 2.5px var(--acc-ring),
    inset 0 3px 8px rgba(0,0,0,.75),
    0 1px 0 rgba(255,255,255,.6),
    0 0 0 1px rgba(0,0,0,.4);
}
/* انعكاس زجاجي خافت فوق الشاشة (لا يستقبل اللمس) */
.plate::after {
  content:""; position:absolute; inset:7px; pointer-events:none; border-radius:5px; z-index:3;
  background:linear-gradient(118deg, rgba(255,255,255,.09) 0%, rgba(255,255,255,.025) 32%, rgba(255,255,255,0) 52%);
}
/* ---- لوحة المفاتيح: حوض عاجي غائر قليلاً بخيط ضوء أسفله (الدرزة) ---- */
.deck {
  border-radius:18px;
  background:
    repeating-linear-gradient(180deg, rgba(255,255,255,.045) 0 1px, rgba(0,0,0,0) 1px 3px),
    linear-gradient(180deg, var(--ivory-lo), var(--ivory) 32%, var(--ivory-lo));
  box-shadow:
    inset 0 2px 5px rgba(90,70,40,.28),
    inset 0 -1px 0 rgba(255,255,255,.75),
    0 1px 0 rgba(255,255,255,.65);
}
/* ---- المفتاح: قبّة عاجية محدّبة في تجويف مصبوب، تغوص 2 بكسل عند الضغط ---- */
.key {
  flex:none;
  appearance:none; -webkit-appearance:none; border:0; padding:0; margin:0; cursor:pointer;
  touch-action:none; -webkit-user-select:none; user-select:none;
  display:inline-flex; align-items:center; justify-content:center;
  color:var(--ink); font:700 16px/1 var(--font-ui);
  border-radius:14px;
  background:
    radial-gradient(90% 70% at 35% 22%, rgba(255,255,255,.95), rgba(255,255,255,0) 60%),
    linear-gradient(180deg, var(--ivory-hi), var(--ivory-lo));
  box-shadow:
    inset 0 1px 0 #fff,
    inset 0 -2px 3px rgba(90,70,40,.22),
    0 0 0 1px var(--ivory-edge),
    0 3px 0 var(--ivory-deep),
    0 3px 0 1px rgba(0,0,0,.22),
    0 6px 8px rgba(0,0,0,.28),
    0 0 0 5px rgba(80,60,30,.075);
}
.key:active, .key.down {
  transform:translateY(2px);
  box-shadow:
    inset 0 1px 0 #fff,
    inset 0 2px 4px rgba(60,45,20,.22),
    0 0 0 1px var(--ivory-edge),
    0 1px 0 var(--ivory-deep),
    0 2px 3px rgba(0,0,0,.25),
    0 0 0 5px rgba(80,60,30,.075);
}
.key.round { border-radius:50%; }
/* مفتاح اللون: مطاط مؤكسد بلون اللعبة، واحد لكل جهاز (الفعل الرئيسي) */
.key.acc {
  color:#fff; text-shadow:0 -1px 0 rgba(0,0,0,.3);
  background:
    radial-gradient(90% 70% at 35% 22%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%),
    linear-gradient(180deg, var(--acc-hi), var(--acc) 55%, var(--acc-lo));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.5),
    inset 0 -2px 3px rgba(0,0,0,.28),
    0 0 0 1px var(--acc-lo),
    0 3px 0 var(--acc-lo),
    0 3px 0 1px rgba(0,0,0,.28),
    0 6px 8px rgba(0,0,0,.32),
    0 0 0 5px rgba(80,60,30,.075);
}
.key.acc:active, .key.acc.down {
  transform:translateY(2px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 2px 5px rgba(0,0,0,.35),
    0 0 0 1px var(--acc-lo), 0 1px 0 var(--acc-lo), 0 2px 3px rgba(0,0,0,.3), 0 0 0 5px rgba(80,60,30,.075);
}
.key small { font-size:8.5px; letter-spacing:.12em; font-weight:700; opacity:.8; margin-top:2px; }
/* ---- التفاصيل المضيئة والمحفورة ---- */
.lamp {
  display:inline-block; width:9px; height:9px; border-radius:50%; flex:none;
  background:radial-gradient(circle at 38% 32%, #fff 0 12%, var(--acc-hi) 30%, var(--acc) 60%, var(--acc-lo) 100%);
  box-shadow: 0 0 7px var(--acc-glow), 0 0 0 1.5px rgba(0,0,0,.35), 0 0 0 2.5px rgba(255,255,255,.4);
}
/* مصباح مطفأ: حالة واحدة فقط — مصباح RUN حين تكون اللعبة متوقفة. مصباح الصوت
   نقطة داخل مفتاح الصوت (.fn .dot) وله قاعدته الخاصة، فلا داعي لمُحدِّد ثانٍ لا يمسّ شيئاً */
body:not([data-state="playing"]) .lamp.run {
  background:radial-gradient(circle at 38% 32%, #d9d0bd 0 12%, #8f8674 45%, #5a5244 100%);
  box-shadow: 0 0 0 1.5px rgba(0,0,0,.35), 0 0 0 2.5px rgba(255,255,255,.4), inset 0 1px 2px rgba(0,0,0,.5);
}
.engr {
  color:var(--engrave); font:700 9px/1 var(--font-ui); letter-spacing:.16em; text-transform:uppercase;
  text-shadow:0 1px 0 rgba(255,255,255,.8); white-space:nowrap;
}
.engr.ar { letter-spacing:0; font-size:10px; direction:rtl; }
.name {
  color:var(--engrave); font:800 12px/1 var(--font-ui); letter-spacing:.42em; direction:ltr;
  text-shadow:0 1px 0 rgba(255,255,255,.85), 0 -1px 0 rgba(90,70,40,.25);
}
/* شبكة سمّاعة: ثقوب مثقوبة في العاج، كل ثقب بظلّ علوي وضوء سفلي */
.grille {
  background:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.65) 0 1.1px, transparent 1.6px) 0 1.2px / 6px 6px,
    radial-gradient(circle at 50% 50%, #5a5244 0 1.2px, transparent 1.7px) 0 0 / 6px 6px;
}
/* ---- اللوحة العلوية والشريط السفلي: يمتصّان الفراغ الرأسي ويختفيان حين يضيق الطول ---- */
.cap { flex:none; height:24px; display:flex; align-items:center; gap:10px; direction:ltr; padding:0 8px; }
.cap .grille { flex:1; height:10px; max-width:120px; margin-left:auto; opacity:.8; }
.foot { flex:none; height:26px; display:none; align-items:center; gap:12px; direction:ltr; padding:0 12px; }
/* عرض الشريط مرن ولا يقبل القسمة على 6 دائماً، فـ round يمطّ خطوة الثقوب قليلاً
   لتنتهي الشبكة بثقب كامل بدل نصف ثقب مقطوع عند الحافة */
.foot .grille { flex:1; height:12px; opacity:.85; background-repeat:round; }
@media (min-height: 760px) { .foot { display:flex; } .cap { height:30px; } .foot { height:30px; } }
/* ---- الحركة: لا رسوم متحرّكة دائمة؛ ما يتحرّك يحترم تفضيل المستخدم ---- */
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }

/* صفوف الإعداد على الشاشة: تظهر فقط حين تتوقف اللعبة، ارتفاعها 44 بكسل دائماً */
.go {
  appearance:none; -webkit-appearance:none; width:100%; max-width:200px; min-width:120px; height:44px; flex:none;
  border-radius:6px; border:1.5px solid currentColor; background:transparent; color:inherit;
  font:700 12px/1 var(--font-ui); display:flex; align-items:center; justify-content:space-between; padding:0 12px;
  touch-action:manipulation; cursor:pointer; direction:rtl;
}
.go i { font-style:normal; font-size:10px; opacity:.7; letter-spacing:.1em; direction:ltr; }
.go.on i { opacity:1; }
.go:active { background:currentColor; }
.go:active span, .go:active i { color:var(--lcd-bg); }

/* ==================== هذا الجهاز: الدودة ====================
   لون الجهاز أخضر ورقي مؤكسد، وشاشته LCD رمادية مخضرّة كما كانت: لا تُمسّ. */
:root {
  --acc:#4f9a5a; --acc-hi:#86c88a; --acc-lo:#2c6236; --acc-ring:rgba(95,170,105,.55); --acc-glow:rgba(95,190,110,.6);
  --lcd-bg:#b3d492; --lcd-dark:#182412;
}
html { height:100%; background:var(--mat); }
/* الصفحة عمود مرن: فراغان بنسبة 5:3 فوق الجهاز وتحته كي يهبط صفّ المفاتيح
   حيث يستريح الإبهامان (100-140 بكسل فوق الحافّة السفلى)، لا في منتصف الشاشة */
body {
  height:100%; overflow:hidden;
  display:flex; flex-direction:column; align-items:center;
  padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
  color:var(--ink); font-family:var(--font-ui);
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  touch-action:manipulation;
}
body::before { content:""; flex:5 1 0; min-height:0; }
body::after  { content:""; flex:3 1 0; min-height:0; }
@media (max-width: 400px) {
  body { padding-left:max(7px, env(safe-area-inset-left)); padding-right:max(7px, env(safe-area-inset-right)); }
}

/* ---- الهيكل: سبيكة واحدة، الشاشة في أعلاها والمفاتيح في أسفلها حيث الإبهام ---- */
.unit {
  flex:none; width:100%; max-width:400px;
  display:flex; flex-direction:column; gap:10px;
  padding:12px 12px 14px; border-radius:28px;
}

/* بئر الشاشة: لوحة الألمنيوم تحمل الشاشة في وسطها، والشاشة لا تتجاوز 320 بكسل أبداً
   لأن أي زيادة تكبّر قماش البكسلات بنسبة كسرية فتتشوّه حوافه */
.well { flex:none; padding:9px; border-radius:12px; display:flex; justify-content:center; align-items:center; overflow:hidden; }
.screen {
  position:relative; width:100%; max-width:320px;
  background:var(--lcd-bg); border-radius:4px; overflow:hidden;
  box-shadow:inset 0 0 20px rgba(24,36,18,.3);
}
/* شبكة بكسلات 4px فوق القماش وتحت النصوص: تُقرأ كشاشة LCD ولا تعتّم الكتابة */
.screen::after {
  content:""; position:absolute; inset:0; pointer-events:none; z-index:1;
  background-image:linear-gradient(rgba(24,36,18,.09) 1px, transparent 1px), linear-gradient(90deg, rgba(24,36,18,.09) 1px, transparent 1px);
  background-size:4px 4px;
}
/* الشريط العلوي للشاشة: أرقام بخطّ Courier كأرقام الهاتف، لاتينية فقط */
.hud {
  direction:ltr; height:30px; display:flex; justify-content:space-between; align-items:center;
  padding:6px 10px 2px; color:var(--lcd-dark);
  font:700 14px/1 "Courier New", Courier, monospace; letter-spacing:1px;
}
.hud .hud-right { display:inline-flex; align-items:center; gap:8px; }
.hud .bonus { visibility:hidden; }
.hud .bonus.on { visibility:visible; animation:blink .5s steps(2) infinite; }
@keyframes blink { to { opacity:.2; } }
canvas#game { display:block; width:100%; height:auto; image-rendering:pixelated; image-rendering:crisp-edges; }

/* الطبقات فوق الشاشة: العربية بخطّ الواجهة لا Courier، والعناوين اللاتينية بخطّ عريض */
.overlay {
  position:absolute; inset:0; z-index:2; direction:rtl;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px;
  padding:10px; text-align:center; color:var(--lcd-dark); background:rgba(179,212,146,.95);
  font-family:var(--font-ui); overflow:hidden;
}
.overlay.hidden { display:none; }
.overlay h1 { font:900 23px/1 "Arial Black", Arial, sans-serif; letter-spacing:2px; direction:ltr; }
.overlay p { font-size:11.5px; line-height:1.55; max-width:100%; }
.overlay p.lbl { font-weight:700; font-size:11px; letter-spacing:.04em; }
.overlay p.hint { font-size:11px; opacity:.85; }   /* لا نصّ أصغر من 11 هنا: السطر تعليمة تُقرأ، لا حاشية */
.overlay .big { font-size:32px; font-weight:900; line-height:1.1; }
/* الصفّان اللذان يظهر تحتهما صفّ القائمة يتركان له 56 بكسلاً كي لا يجلس على النصّ */
#paused, #gameover { padding-bottom:56px; }
/* اختيار السرعة: رقم في صندوق بين سهمين، تحرّكه مفاتيح ◀ ▶ الحقيقية لا أزرار على الزجاج */
.levels { direction:ltr; display:flex; justify-content:center; }
.lvl { direction:ltr; font:700 18px/1 "Courier New", monospace; letter-spacing:2px; border:2px solid var(--lcd-dark); padding:5px 12px; border-radius:3px; }
/* صينية القائمة: عقدة ثابتة لا يمسّها أي innerHTML، تظهر في الإيقاف والنهاية فقط */
.tray {
  position:absolute; left:0; right:0; bottom:6px; height:44px; z-index:2;
  display:none; justify-content:center; align-items:center; color:var(--lcd-dark);
}
body[data-state="paused"] .tray, body[data-state="over"] .tray { display:flex; }
@media (max-width: 340px) {
  .overlay { gap:5px; padding:8px; }
  .overlay h1 { font-size:19px; }
  .overlay p { font-size:10.5px; line-height:1.45; }
  .overlay p.hint { font-size:10.5px; }
  .overlay .big { font-size:26px; }
  .lvl { font-size:16px; padding:4px 10px; }
}

/* ---- لوحة المفاتيح: الصليب تحت الإبهام الأيسر، ومفتاح البدء الأخضر تحت الأيمن ---- */
/* كل صفّ مادي في الجهاز يُقرأ من اليسار: الصليب يساراً والعمود يميناً في كل
   الاتجاهات، فلا تنقلب الأسهم مع اتجاه الصفحة العربي */
.deck { flex:none; width:100%; display:flex; flex-direction:column; align-items:center; direction:ltr; gap:10px; padding:10px 10px 12px; }
.field { width:100%; display:flex; align-items:center; justify-content:space-between; direction:ltr; padding:0 4px; }
/* الصليب: ذراع 70 بكسل، أي 210 للمجموع. الذراع وحدها لا تكفي: لكل سهم رقعة
   لمس تمتدّ خارجه (‎.d::after‎) نحو حافة اللوحة وزاويتيها، فيُصيب الإبهام
   الاتجاه دون أن ينظر، ويبقى قلب الصليب وحده ميتاً فلا يُطلق اتجاهاً بالخطأ */
.pad { position:relative; width:210px; height:210px; flex:none; }
.pad::before {
  content:""; position:absolute; inset:0; pointer-events:none; border-radius:8px;
  background:linear-gradient(rgba(80,60,30,.13), rgba(80,60,30,.13)) 50% 0 / 74px 100% no-repeat,
             linear-gradient(rgba(80,60,30,.13), rgba(80,60,30,.13)) 0 50% / 100% 74px no-repeat;
}
.pad .d { position:absolute; width:70px; height:70px; font-size:19px; }
.pad .up    { left:70px; top:0; }
.pad .left  { left:0; top:70px; }
.pad .right { left:140px; top:70px; }
.pad .dn    { left:70px; top:140px; }     /* ليس «down» كي لا يصطدم بحالة الضغط */
/* رقعة اللمس: تمتدّ إلى الخارج فقط — لا نحو القلب — فتبتلع الفراغ حول الذراع
   وزاويتيه دون أن يسرق سهمٌ نقرةَ جاره المقابل */
.pad .d::after { content:""; position:absolute; }
.pad .up::after    { inset:-14px -12px 0 -12px; }
.pad .dn::after    { inset:0 -12px -14px -12px; }
.pad .left::after  { inset:-12px 0 -12px -14px; }
.pad .right::after { inset:-12px -14px -12px 0; }
/* قلب الصليب: قرص مطفأ مستوٍ مع السطح، لا يوحي بأنه يُضغط */
.pad .hub {
  position:absolute; left:75px; top:75px; width:60px; height:60px; border-radius:50%; pointer-events:none;
  background:linear-gradient(180deg, var(--ivory-lo), var(--ivory-deep));
  box-shadow:inset 0 1px 2px rgba(90,70,40,.35);
}
/* العمود الأيمن: مفتاح الصوت في أعلاه بعيداً عن الأسهم، ومفتاح البدء في أسفله تحت الإبهام */
.col { display:flex; flex-direction:column; align-items:center; justify-content:space-between; height:210px; padding:2px 0; }
.fn { position:relative; width:48px; height:48px; font-size:17px; }
/* مصباح الصوت: نقطة خضراء في زاوية المفتاح، تنطفئ حين يُكتم */
.fn .dot {
  position:absolute; right:8px; bottom:8px; width:6px; height:6px; border-radius:50%;
  background:radial-gradient(circle at 38% 32%, #fff 0 12%, var(--acc-hi) 30%, var(--acc) 60%, var(--acc-lo) 100%);
  box-shadow:0 0 5px var(--acc-glow), 0 0 0 1px rgba(0,0,0,.3);
}
.fn.off .dot {
  background:radial-gradient(circle at 38% 32%, #d9d0bd 0 12%, #8f8674 45%, #5a5244 100%);
  box-shadow:0 0 0 1px rgba(0,0,0,.3), inset 0 1px 1px rgba(0,0,0,.5);
}
/* مفتاح البدء/الإيقاف: قبّة خضراء في تجويف دائري مصبوب، وتحتها نقش يقول ما سيفعله الآن */
/* الفجوة 14 لا 8: النقش يجلس تحت حافّة التجويف المصبوب لا عليها، فلا تمرّ
   الحلقة في نزول حروف «ابدأ/إيقاف/متابعة» */
.ok { position:relative; display:flex; flex-direction:column; align-items:center; gap:14px; padding:10px 12px 0; }
.ok::before {
  content:""; position:absolute; left:50%; top:0; width:86px; height:86px; margin-left:-43px; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle at 50% 40%, rgba(80,60,30,.16), rgba(80,60,30,.09) 70%, rgba(80,60,30,0) 72%);
  box-shadow:inset 0 1px 2px rgba(90,70,40,.25), 0 1px 0 rgba(255,255,255,.7);
}
#okBtn { width:66px; height:66px; font-size:22px; }
#okBtn .ic.pause { font-size:24px; letter-spacing:-2px; }
/* حالة الجهاز على البدن: الرمز والنقش يتبعان data-state، فالمفتاح الواحد يقول دائماً ما يفعله */
body[data-state="playing"] #okBtn .ic.start, body:not([data-state="playing"]) #okBtn .ic.pause { display:none; }
.ok .engr { display:none; }
body:not([data-state]) .cap-start, body[data-state="menu"] .cap-start, body[data-state="over"] .cap-start,
body[data-state="playing"] .cap-pause, body[data-state="paused"] .cap-resume { display:block; }

/* ---- الطبقات: الطول يقرّر، لا العرض. الشاشة تتنازل قبل الأزرار،
   ولا ينزل الذراع تحت 48 بكسل مهما ضاق الإطار ---- */
/* بين 700 و759 لا يظهر الشريط السفلي، فيكفي سقف أوسع ليبقى المفتاح في المدى
   نفسه ولا يقفز موضعه عند حدود الطبقة */
@media (min-height: 700px) { body::after { max-height:48px; } }
@media (min-height: 760px) {
  /* فوق 760 يكبر الفائض الرأسي، وثلاثة أثمانه تحت الجهاز كانت ترفع مفتاح البدء
     إلى 208 بكسلاً عن الحافّة السفلى: ارتفاع لا يبلغه الإبهام دون إعادة إمساك
     الجهاز. فيُسقَّف الفراغ السفلي عند 8 بكسلات — يضاف إليها حشو الجسم ومنطقة
     الأمان في الأجهزة الحقيقية — ويذهب الفائض كلّه فوق الجهاز، فيستقرّ المفتاح
     عند ~141 بكسلاً مهما زاد الطول: 794 أو 844 أو 932، ولا تتقلّص الشاشة بكسلاً */
  body::after { max-height:8px; }
  .pad { width:222px; height:222px; } .pad .d { width:74px; height:74px; font-size:20px; }
  .pad .up { left:74px; } .pad .left { top:74px; } .pad .right { left:148px; top:74px; } .pad .dn { left:74px; top:148px; }
  .pad .hub { left:79px; top:79px; width:64px; height:64px; }
  .pad::before { background-size:78px 100%, 100% 78px; }
  .col { height:222px; }
}
@media (max-height: 699px) {
  .unit { gap:8px; padding:10px 10px 12px; }
  .pad { width:192px; height:192px; } .pad .d { width:64px; height:64px; font-size:18px; }
  .pad .up { left:64px; } .pad .left { top:64px; } .pad .right { left:128px; top:64px; } .pad .dn { left:64px; top:128px; }
  .pad .hub { left:68px; top:68px; width:56px; height:56px; }
  .pad::before { background-size:68px 100%, 100% 68px; }
  .col { height:192px; }
  #okBtn { width:60px; height:60px; }
  .ok::before { width:80px; height:80px; margin-left:-40px; }
  .deck { gap:8px; padding:8px 8px 10px; }
}
/* اللوحة العلوية أول ما يسقط حين يقصر الطول: عتبة واحدة لكل ألعاب المجموعة */
@media (max-height: 620px) and (orientation: portrait) { .cap { display:none; } }
@media (max-height: 560px) and (orientation: portrait) {
  .well { padding:6px; }
  .pad { width:174px; height:174px; } .pad .d { width:58px; height:58px; font-size:17px; }
  .pad .up { left:58px; } .pad .left { top:58px; } .pad .right { left:116px; top:58px; } .pad .dn { left:58px; top:116px; }
  .pad .hub { left:62px; top:62px; width:50px; height:50px; }
  .pad::before { background-size:62px 100%, 100% 62px; }
  /* 152 لا 144: العمود يحمل مفتاح صوت 48 ونقشاً تحت مفتاح البدء، والفجوة 14
     بينهما؛ 144 كانت تُلصق المفتاحين ببعضهما بعد توسيع الفجوة */
  .col { height:180px; }
}
/* إطار عريض قصير: الصليب جناحاً أيسر للشاشة، ومفتاحا الصوت والبدء جناحاً أيمن */
@media (orientation: landscape) and (max-height: 560px) {
  body { padding:8px; }
  .unit { flex-direction:row; align-items:center; max-width:none; width:auto; gap:12px; padding:10px 12px; direction:ltr; }
  .cap, .foot { display:none; }
  .well { order:2; flex:0 1 auto; align-self:stretch; }
  .deck, .field { display:contents; }
  .pad { order:1; width:186px; height:186px; }
  .pad .d { width:62px; height:62px; font-size:18px; }
  .pad .up { left:62px; } .pad .left { top:62px; } .pad .right { left:124px; top:62px; } .pad .dn { left:62px; top:124px; }
  .pad .hub { left:66px; top:66px; width:54px; height:54px; }
  .pad::before { background-size:66px 100%, 100% 66px; }
  .col { order:3; height:auto; gap:14px; flex-direction:column; justify-content:center; }
}
</style>
</head>
<body class="ground">

<div class="unit">
  <div class="cap">
    <span class="lamp run" aria-hidden="true"></span>
    <span class="name">SNAKE</span>
    <span class="grille" aria-hidden="true"></span>
  </div>

  <div class="well plate">
    <div class="screen">
      <div class="hud">
        <span id="score">0000</span>
        <span id="bonus" class="bonus">★ <span id="bonusTimer">20</span></span>
        <span class="hud-right"><span id="best">TOP 0000</span></span>
      </div>
      <canvas id="game" width="320" height="240"></canvas>

      <div id="menu" class="overlay">
        <h1>SNAKE II</h1>
        <p>الحواف مفتوحة: اخرج من جهة تعُد من المقابلة.</p>
        <p class="lbl">السرعة</p>
        <div id="levels" class="levels"></div>
        <p class="hint">غيّر السرعة بـ <bdi dir="ltr">&#x25C0;&#xFE0E; &#x25B6;&#xFE0E;</bdi> واضغط الزرّ الأخضر للبدء.</p>
      </div>

      <div id="paused" class="overlay hidden">
        <h1>PAUSE</h1>
        <p>اضغط الزرّ الأخضر للمتابعة</p>
      </div>

      <div id="gameover" class="overlay hidden">
        <h1>GAME OVER</h1>
        <p id="finalScore" class="big">0</p>
        <p id="recordMsg"></p>
        <p>الزرّ الأخضر: العب مرة أخرى</p>
      </div>

      <div id="ovTray" class="tray">
        <button class="go" id="menuBtn" type="button"><span>القائمة</span><i>MENU</i></button>
      </div>
    </div>
  </div>

  <div class="deck">
    <div class="field">
      <div class="pad">
        <button class="key d up"    data-dir="up"    type="button" aria-label="أعلى">&#x25B2;&#xFE0E;</button>
        <button class="key d left"  data-dir="left"  type="button" aria-label="يسار">&#x25C0;&#xFE0E;</button>
        <span class="hub" aria-hidden="true"></span>
        <button class="key d right" data-dir="right" type="button" aria-label="يمين">&#x25B6;&#xFE0E;</button>
        <button class="key d dn"    data-dir="down"  type="button" aria-label="أسفل">&#x25BC;&#xFE0E;</button>
      </div>
      <div class="col">
        <button class="key round fn" id="muteBtn" type="button" aria-label="كتم الصوت" title="الصوت (M)">&#x266A;<i class="dot" aria-hidden="true"></i></button>
        <div class="ok">
          <button class="key round acc" id="okBtn" type="button" aria-label="ابدأ / إيقاف"><span class="ic start">&#x25B6;&#xFE0E;</span><span class="ic pause">&#x2016;</span></button>
          <span class="engr ar cap-start">ابدأ</span><span class="engr ar cap-pause">إيقاف</span><span class="engr ar cap-resume">متابعة</span>
        </div>
      </div>
    </div>
  </div>

  <div class="foot">
    <span class="engr">Model S·320</span>
    <span class="grille" aria-hidden="true"></span>
    <span class="engr">Level 1–9</span>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---------- Grid & rendering constants ----------
  const COLS = 32;
  const ROWS = 24;
  const CELL = 10;               // canvas pixels per cell (canvas is 320x240)
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  /* ألوان شاشة 3310 نفسها: رمادي مخضرّ باهت وحبر شبه أسود */
  const COLOR_BG   = '#b3d492';
  const COLOR_DARK = '#182412';
  const COLOR_MID  = '#47643a';

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const scoreEl = $('score'), bestEl = $('best');
  const bonusEl = $('bonus'), bonusTimerEl = $('bonusTimer');
  const menuEl = $('menu'), pausedEl = $('paused'), overEl = $('gameover');
  const finalScoreEl = $('finalScore'), recordMsgEl = $('recordMsg');
  const levelsEl = $('levels');

  // ---------- Persistent high score ----------
  const BEST_KEY = 'nokia-snake-best';
  let best = 0;
  try { best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (e) { best = 0; }

  // ---------- Game state ----------
  const DIRS = {
    up:    { x: 0,  y: -1 },
    down:  { x: 0,  y: 1 },
    left:  { x: -1, y: 0 },
    right: { x: 1,  y: 0 },
  };
  const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };

  let level = 5;                 // 1..9 like the original
  let state = 'menu';            // menu | playing | paused | over
  let snake = [];                // array of {x,y}, head first
  let dir = 'right';
  let dirQueue = [];             // buffered turns so quick double-taps register
  let food = null;
  let bonus = null;              // {x,y,ticksLeft}
  let foodsEaten = 0;
  let score = 0;
  let growBy = 0;
  let timer = null;
  let flashTicks = 0;            // death animation

  const levelDelay = lvl => Math.round(300 - (lvl - 1) * 27); // ms per tick: 300 → 84

  // ---------- Level picker ----------
  // A display-only widget: the physical ◀ ▶ keys (and the keyboard) change the level while in the menu.
  function renderLevel() {
    levelsEl.innerHTML = '<span class="lvl">&#x25C0;&#xFE0E;&nbsp;' + level + '&nbsp;&#x25B6;&#xFE0E;</span>';
  }
  function setLevel(n) {
    level = Math.min(9, Math.max(1, n));
    renderLevel();
  }

  // ---------- Body state ----------
  // The chassis reads body[data-state]: RUN lamp, the OK key's glyph and caption, the overlay tray.
  function syncState() {
    document.body.dataset.state = state;
  }

  // ---------- Helpers ----------
  const pad4 = n => String(n).padStart(4, '0');
  /* أعلى نتيجة تُكتب وهي ترتفع لا عند الاصطدام وحده: من يُغلق التطبيق في منتصف
     جولة جيدة كان يفقدها ويفقد رقمها معاً. الكتابة مخنوقة بثانية كي لا يُلمس
     التخزين مع كل أكلة، ومضمونة عند المغادرة وعند النهاية. */
  let bestSaved = best, bestAt = 0;
  function writeBest() {
    if (best <= bestSaved) return;
    try { localStorage.setItem(BEST_KEY, String(best)); bestSaved = best; } catch (e) {}
  }
  function bumpBest() {
    if (score <= best) return;
    best = score;
    const now = Date.now();
    if (now - bestAt >= 1000) { bestAt = now; writeBest(); }
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) writeBest(); });
  window.addEventListener('pagehide', writeBest);

  function updateHud() {
    bumpBest();
    scoreEl.textContent = pad4(score);
    bestEl.textContent = 'TOP ' + pad4(best);
    if (bonus) {
      bonusEl.classList.add('on');
      bonusTimerEl.textContent = Math.ceil(bonus.ticksLeft / 2);
    } else {
      bonusEl.classList.remove('on');
    }
  }

  function isOccupied(x, y) {
    return snake.some(s => s.x === x && s.y === y)
        || (food && food.x === x && food.y === y)
        || (bonus && bonus.x === x && bonus.y === y);
  }

  function randomFreeCell() {
    let tries = 0;
    while (tries++ < 2000) {
      const x = Math.floor(Math.random() * COLS);
      const y = Math.floor(Math.random() * ROWS);
      if (!isOccupied(x, y)) return { x, y };
    }
    return null;
  }

  function spawnFood() {
    food = randomFreeCell();
  }

  function spawnBonus() {
    // bonus needs 2 free horizontal cells (the classic "bug")
    for (let t = 0; t < 500; t++) {
      const x = Math.floor(Math.random() * (COLS - 1));
      const y = Math.floor(Math.random() * ROWS);
      if (!isOccupied(x, y) && !isOccupied(x + 1, y)) {
        bonus = { x, y, ticksLeft: 40 };
        return;
      }
    }
  }

  // ---------- Sound (Web Audio, no external files) ----------
  const SOUND_KEY = 'nokia-snake-sound';
  let soundOn = true;
  try { soundOn = localStorage.getItem(SOUND_KEY) !== 'off'; } catch (e) {}
  const muteBtn = $('muteBtn');

  let actx = null;
  function audioCtx() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  // iOS/Safari only allow audio after a user gesture: warm the context on the first one.
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev =>
    document.addEventListener(ev, () => { if (soundOn) audioCtx(); }, { passive: true }));

  // Square-wave beeps, like a monophonic phone speaker.
  // notes: array of [frequencyHz, durationMs, gapMs?]; 0 Hz = rest
  function play(notes, vol = 0.08) {
    if (!soundOn) return;
    const ac = audioCtx();
    if (!ac) return;
    let t = ac.currentTime;
    for (const [freq, dur, gap = 15] of notes) {
      if (freq > 0) {
        const osc = ac.createOscillator();
        const g = ac.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.004);
        g.gain.setValueAtTime(vol, t + dur / 1000 - 0.008);
        g.gain.linearRampToValueAtTime(0, t + dur / 1000);
        osc.connect(g).connect(ac.destination);
        osc.start(t);
        osc.stop(t + dur / 1000 + 0.01);
      }
      t += (dur + gap) / 1000;
    }
  }

  const SFX = {
    eat:        () => play([[880, 45]]),
    turn:       () => play([[220, 12]], 0.025),
    bonusShow:  () => play([[1175, 40], [1568, 40], [1175, 40], [1568, 40]]),
    bonusEat:   () => play([[988, 50], [1319, 50], [1760, 90]]),
    bonusGone:  () => play([[330, 60], [262, 90]], 0.05),
    start:      () => play([[659, 70], [784, 70], [988, 70], [1319, 140]]),
    pause:      () => play([[523, 40], [392, 60]]),
    resume:     () => play([[392, 40], [523, 60]]),
    over:       () => play([[494, 120], [440, 120], [392, 120], [349, 120], [0, 60], [262, 320]]),
    record:     () => play([[784, 60], [988, 60], [1175, 60], [1568, 60], [0, 40], [1568, 60], [0, 40], [1568, 180]]),
    click:      () => play([[660, 25]], 0.05),
  };

  function updateMuteBtn() {
    muteBtn.classList.toggle('off', !soundOn);
    muteBtn.setAttribute('aria-label', soundOn ? 'كتم الصوت' : 'تشغيل الصوت');
  }
  function toggleSound() {
    soundOn = !soundOn;
    try { localStorage.setItem(SOUND_KEY, soundOn ? 'on' : 'off'); } catch (e) {}
    updateMuteBtn();
    if (soundOn) SFX.click();
  }
  muteBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); toggleSound(); });
  updateMuteBtn();

  // ---------- Game lifecycle ----------
  function resetGame() {
    const cy = Math.floor(ROWS / 2);
    snake = [];
    for (let i = 0; i < 5; i++) snake.push({ x: 8 - i, y: cy });
    dir = 'right';
    dirQueue = [];
    score = 0;
    growBy = 0;
    foodsEaten = 0;
    bonus = null;
    flashTicks = 0;
    spawnFood();
    updateHud();
  }

  function showOverlay(which) {
    menuEl.classList.toggle('hidden', which !== 'menu');
    pausedEl.classList.toggle('hidden', which !== 'paused');
    overEl.classList.toggle('hidden', which !== 'over');
  }

  function startGame() {
    resetGame();
    state = 'playing';
    syncState();
    showOverlay(null);
    SFX.start();
    startLoop();
    draw();
  }

  function startLoop() {
    stopLoop();
    timer = setInterval(tick, levelDelay(level));
  }
  function stopLoop() {
    if (timer) clearInterval(timer);
    timer = null;
  }

  function pauseGame() {
    if (state !== 'playing') return;
    state = 'paused';
    syncState();
    stopLoop();
    SFX.pause();
    showOverlay('paused');
  }
  function resumeGame() {
    if (state !== 'paused') return;
    state = 'playing';
    syncState();
    showOverlay(null);
    SFX.resume();
    startLoop();
  }
  function togglePause() {
    if (state === 'playing') pauseGame();
    else if (state === 'paused') resumeGame();
  }

  function gameOver() {
    state = 'over';
    syncState();
    stopLoop();
    const record = score >= best && score > 0;
    if (score > best) best = score;
    writeBest();
    updateHud();
    if (record) SFX.record(); else SFX.over();
    // death flash animation, then overlay
    flashTicks = 6;
    const flash = setInterval(() => {
      flashTicks--;
      draw();
      if (flashTicks <= 0) {
        clearInterval(flash);
        finalScoreEl.textContent = score;
        // A star the UI font draws in ink, not a full-colour emoji: the LCD is one colour.
        recordMsgEl.textContent = record ? '★ رقم قياسي جديد!' : 'أفضل نتيجة: ' + best;
        showOverlay('over');
      }
    }, 150);
  }

  function goMenu() {
    stopLoop();
    state = 'menu';
    syncState();
    resetGame();
    showOverlay('menu');
    draw();
  }

  // ---------- Input ----------
  function queueDir(d) {
    if (!DIRS[d]) return;
    const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
    if (d === last || d === OPPOSITE[last]) return;
    if (dirQueue.length < 3) { dirQueue.push(d); SFX.turn(); }
  }

  const KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right',
    // Phone keypad layout: 2 up, 8 down, 4 left, 6 right
    '2': 'up', '8': 'down', '4': 'left', '6': 'right',
  };

  document.addEventListener('keydown', e => {
    if (state === 'menu') {
      // Menu: 1-9 pick the level directly, left/right step it; nothing here starts the game
      if (/^[1-9]$/.test(e.key)) { e.preventDefault(); setLevel(+e.key); return; }
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); setLevel(level - 1); return; }
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); setLevel(level + 1); return; }
      if (KEYMAP[e.key]) { e.preventDefault(); return; }
    }
    const d = KEYMAP[e.key];
    if (d) {
      e.preventDefault();
      if (state === 'playing') queueDir(d);
      return;
    }
    if (e.key === ' ' || e.key === 'p' || e.key === 'P') {
      e.preventDefault();
      if (state === 'menu') startGame();
      else if (state === 'over') startGame();
      else togglePause();
    }
    if (e.key === 'Enter') {
      if (state === 'menu' || state === 'over') startGame();
      else if (state === 'paused') resumeGame();
    }
    if (e.key === 'm' || e.key === 'M') { toggleSound(); return; }
    if (e.key === 'Escape') {
      if (state === 'playing') pauseGame();
      else if (state === 'paused' || state === 'over') goMenu();
    }
  });

  // The cross steers the snake while playing; in the menu its left/right keys step the speed level
  document.querySelectorAll('.deck [data-dir]').forEach(btn => {
    const handler = e => {
      e.preventDefault();
      const dir = btn.dataset.dir;
      if (state === 'menu') {
        if (dir === 'left') setLevel(level - 1);
        else if (dir === 'right') setLevel(level + 1);
        return;
      }
      if (state === 'playing') queueDir(dir);
    };
    btn.addEventListener('pointerdown', handler);
  });

  // Pressed look on every chassis key: pointer events only, so touch and mouse both show the 2-px travel
  document.querySelectorAll('.key').forEach(k => {
    k.addEventListener('pointerdown', () => k.classList.add('down'));
    for (const t of ['pointerup', 'pointercancel', 'pointerleave']) k.addEventListener(t, () => k.classList.remove('down'));
  });

  // The one green key: start from the menu or after game over, pause / resume otherwise.
  // Bound on pointerdown so it reacts on the first touch, like the arrows.
  $('okBtn').addEventListener('pointerdown', e => {
    e.preventDefault();
    if (state === 'menu' || state === 'over') startGame();
    else togglePause();
  });
  // The menu row lives on the LCD overlay and is only visible while paused or after game over
  $('menuBtn').addEventListener('click', goMenu);

  // Pause automatically when tab is hidden
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') pauseGame();
  });

  // ---------- Game tick ----------
  function tick() {
    if (dirQueue.length) dir = dirQueue.shift();
    const v = DIRS[dir];
    const head = snake[0];
    // Open edges: leaving one side brings the snake back in from the opposite side
    const nx = (head.x + v.x + COLS) % COLS;
    const ny = (head.y + v.y + ROWS) % ROWS;

    // Self collision (tail tip is allowed since it moves away this tick, unless we grow)
    const bodyToCheck = growBy > 0 ? snake : snake.slice(0, -1);
    if (bodyToCheck.some(s => s.x === nx && s.y === ny)) return gameOver();

    snake.unshift({ x: nx, y: ny });

    // Eat regular food
    if (food && nx === food.x && ny === food.y) {
      score += level;
      growBy += 1;
      foodsEaten++;
      food = null;
      spawnFood();
      SFX.eat();
      if (foodsEaten % 5 === 0 && !bonus) { spawnBonus(); if (bonus) SFX.bonusShow(); }
    }
    // Eat bonus (2 cells wide)
    else if (bonus && ny === bonus.y && (nx === bonus.x || nx === bonus.x + 1)) {
      score += level * Math.max(1, Math.ceil(bonus.ticksLeft / 4));
      growBy += 2;
      bonus = null;
      SFX.bonusEat();
    }

    if (growBy > 0) growBy--;
    else snake.pop();

    if (bonus) {
      bonus.ticksLeft--;
      if (bonus.ticksLeft <= 0) { bonus = null; SFX.bonusGone(); }
    }

    updateHud();
    draw();
  }

  // ---------- Drawing ----------
  function cellRect(x, y, inset = 1) {
    ctx.fillRect(x * CELL + inset, y * CELL + inset, CELL - inset * 2, CELL - inset * 2);
  }

  function drawSnake() {
    ctx.fillStyle = COLOR_DARK;
    for (let i = snake.length - 1; i >= 1; i--) {
      const s = snake[i];
      // body segment with a small "checker" hole for the classic look
      cellRect(s.x, s.y, 1);
      ctx.fillStyle = COLOR_BG;
      ctx.fillRect(s.x * CELL + 4, s.y * CELL + 4, 2, 2);
      ctx.fillStyle = COLOR_DARK;
    }
    // head: solid with an eye
    const h = snake[0];
    cellRect(h.x, h.y, 0);
    ctx.fillStyle = COLOR_BG;
    const v = DIRS[dir];
    const ex = h.x * CELL + 5 + v.x * 2 - (v.y !== 0 ? 2 : 0);
    const ey = h.y * CELL + 5 + v.y * 2 - (v.x !== 0 ? 2 : 0);
    ctx.fillRect(ex, ey, 2, 2);
  }

  function drawFood() {
    if (!food) return;
    ctx.fillStyle = COLOR_DARK;
    // small diamond
    const cx = food.x * CELL, cy = food.y * CELL;
    ctx.fillRect(cx + 4, cy + 2, 2, 6);
    ctx.fillRect(cx + 2, cy + 4, 6, 2);
    ctx.fillRect(cx + 3, cy + 3, 4, 4);
  }

  function drawBonus() {
    if (!bonus) return;
    ctx.fillStyle = COLOR_DARK;
    const bx = bonus.x * CELL, by = bonus.y * CELL;
    // a little "bug": body of 2 cells wide, with legs
    ctx.fillRect(bx + 3, by + 3, 14, 4);
    ctx.fillRect(bx + 5, by + 1, 10, 8);
    ctx.fillStyle = COLOR_BG;
    ctx.fillRect(bx + 7, by + 3, 2, 2);
    ctx.fillRect(bx + 11, by + 3, 2, 2);
    ctx.fillStyle = COLOR_MID;
    ctx.fillRect(bx + 1, by + 2, 2, 1); ctx.fillRect(bx + 17, by + 2, 2, 1);
    ctx.fillRect(bx + 1, by + 7, 2, 1); ctx.fillRect(bx + 17, by + 7, 2, 1);
  }

  function drawBorder() {
    // dashed frame: the edges are open, the snake wraps around
    ctx.strokeStyle = COLOR_MID;
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.strokeRect(1, 1, canvas.width - 2, canvas.height - 2);
    ctx.setLineDash([]);
  }

  function draw() {
    ctx.fillStyle = COLOR_BG;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawBorder();
    drawFood();
    drawBonus();
    // death flash: alternate hiding the snake
    if (state === 'over' && flashTicks % 2 === 1) return;
    drawSnake();
  }

  // ---------- Boot ----------
  resetGame();
  renderLevel();
  syncState();
  showOverlay('menu');
  draw();
})();
</script>
</body>
</html>
