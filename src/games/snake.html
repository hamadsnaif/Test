<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nokia Snake II - لعبة الدودة</title>
<style>
  :root {
    /* شاشة 3310: رمادي مخضرّ باهت، لا أخضر الغيم بوي الفاقع */
    --lcd-bg: #9fb0c8;
    --lcd-dark: #17202c;
    --lcd-mid: #43536b;
    --lcd-light: #b3c2d6;
    /* الغطاء الأمامي الأزرق الرمادي المميّز للجهاز */
    --face-hi: #d3dae1;
    --face: #b9c2cc;
    --face-lo: #9aa4b0;
    --key-bg: #aeb8c4;
    --key-hi: #ccd4dd;
    --key-lo: #8f99a6;
    --key-ink: #1e242b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { height: 100%; background: #0e1013; }

  body {
    min-height: 100%;
    background: radial-gradient(ellipse at top, #2b3038 0%, #0e1013 70%) fixed;
    color: #ddd;
    font-family: "Courier New", Courier, monospace;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
    overflow-x: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
  }

  /* ---------- Phone shell ---------- */
  /* ==================== نوكيا 6310 ====================
     الهدف أن يبدو صورةً لجهاز لا رسماً له. لذلك كل قطعة لها مادّتها:
     البدن بلاستيك فحمي مطفأ، والواجهة شمبانيا معدنية، وجناح التنقّل
     كروم، والمفاتيح مطاط داكن. والإضاءة من أعلى في كلّها، فالحوافّ
     العليا تلمع والسفلى تظلّ — وهذا وحده ما يجعل السطح يبدو مجسّماً. */
  .phone {
    position: relative;
    width: 100%;
    max-width: min(340px, 50vh);
    padding: 0 0 10px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    /* البدن: أغمق عند الحواف وأفتح في الوسط، كأسطوانة لا كلوح */
    background:
      linear-gradient(90deg,
        #0d0d0f 0%, #202024 5%, #35353a 13%, #2a2a2e 50%,
        #35353a 87%, #202024 95%, #0d0d0f 100%);
    border-radius: 30px 30px 20px 20px / 44px 44px 18px 18px;
    box-shadow:
      /* حافّة عليا مضيئة، وحافّة سفلى مظلمة، وظلّ على الأرضية */
      inset 0 1.5px 0 rgba(255,255,255,.34),
      inset 0 -2px 4px rgba(0,0,0,.85),
      inset 2px 0 3px rgba(0,0,0,.5),
      inset -2px 0 3px rgba(0,0,0,.5),
      0 26px 46px rgba(0,0,0,.72),
      0 6px 14px rgba(0,0,0,.55);
  }

  /* الواجهة الذهبية: لوح معدني مغروز في البدن، فله ظلّ داخلي حوله */
  .fascia {
    margin: 7px 11px 8px;
    padding: 9px 9px 10px;
    border-radius: 24px 24px 16px 16px / 34px 34px 14px 14px;
    background:
      linear-gradient(103deg,
        #8f7635 0%, #c7ad69 8%, #e8d7a4 22%, #d8c489 42%,
        #c9b277 62%, #e2d09c 80%, #b99f5f 94%, #7e6730 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.62),
      inset 0 -1px 2px rgba(90,70,20,.5),
      0 0 0 1px rgba(0,0,0,.55),
      0 2px 5px rgba(0,0,0,.6);
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  /* ثلاثة شقوق مائلة للسمّاعة، كما في الجهاز */
  .earpiece { display: flex; justify-content: center; gap: 9px; height: 13px; margin-top: 1px; }
  .earpiece i {
    width: 2.5px; height: 13px;
    transform: skewX(-17deg);
    border-radius: 2px;
    background: linear-gradient(180deg, #4a3d18, #2a2209);
    box-shadow: 0 1px 0 rgba(255,255,255,.5), inset 0 1px 1px rgba(0,0,0,.9);
  }

  .brand {
    text-align: center;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    letter-spacing: .5px;
    font-size: 15px;
    color: #3d3115;
    text-shadow: 0 1px 0 rgba(255,255,255,.45);
    direction: ltr;
    margin: -1px 0 1px;
  }

  /* جناح التنقّل: كروم مقوّس، بمفتاحَي اتصال أخضر وأحمر ومفتاح بينهما */
  .navwing {
    position: relative;
    direction: ltr;          /* الأخضر يساراً والأحمر يميناً، كما هو مصبوب */
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 4px;
    padding: 4px 5px;
    border-radius: 26px / 20px;
    background: linear-gradient(180deg, #f2f4f6 0%, #cdd2d8 38%, #9aa0a8 70%, #c2c7cd 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.95),
      inset 0 -2px 3px rgba(0,0,0,.35),
      0 0 0 1px rgba(0,0,0,.45),
      0 2px 4px rgba(0,0,0,.45);
  }
  .call, .end {
    appearance: none; -webkit-appearance: none;
    height: 26px;
    border: 0;
    border-radius: 16px 7px 7px 16px / 14px 7px 7px 14px;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
    touch-action: none;
    color: #f6fff6;
    text-shadow: 0 1px 1px rgba(0,0,0,.55);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), inset 0 -2px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.4);
  }
  .call { background: linear-gradient(180deg, #67c06e, #2f7a38 75%); }
  .end  { background: linear-gradient(180deg, #e0685c, #9e2a22 75%); border-radius: 7px 16px 16px 7px / 7px 14px 14px 7px; }
  .call span { display: inline-block; transform: scaleX(-1); }

  .rocker { position: relative; width: 56px; height: 34px; }
  .rk {
    position: absolute; left: 0; width: 56px;
    appearance: none; -webkit-appearance: none;
    border: 0; padding: 0; cursor: pointer; touch-action: none;
    background: linear-gradient(180deg, #e6eaee, #aab0b8 70%, #c6cbd1);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 1px 2px rgba(0,0,0,.4);
  }
  .rk.up { top: 0; height: 13px; border-radius: 13px 13px 3px 3px; }
  .rk.dn { bottom: 0; height: 13px; border-radius: 3px 3px 13px 13px; }
  .rk.ok {
    top: 12px; height: 10px; border-radius: 2px;
    background: linear-gradient(180deg, #8f959d, #767c84);
    box-shadow: inset 0 1px 2px rgba(0,0,0,.5);
  }
  /* السهمان الأخضران المطبوعان على المفتاح */
  .rk.up::after, .rk.dn::after {
    content: ""; position: absolute; left: 50%; width: 0; height: 0;
    transform: translateX(-50%);
    border-left: 5px solid transparent; border-right: 5px solid transparent;
  }
  .rk.up::after { top: 3px; border-bottom: 6px solid #2f7a38; }
  .rk.dn::after { bottom: 3px; border-top: 6px solid #2f7a38; }

  /* المفاتيح: مطاط داكن، حافّة عليا تلمع وأخرى سفلى تغرق */
  .keypad { display: flex; flex-direction: column; gap: 5px; direction: ltr; margin: 0 13px; }
  .krow { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
  .nk {
    appearance: none; -webkit-appearance: none;
    height: 30px;
    border: 0;
    border-radius: 9px / 11px;
    background: linear-gradient(180deg, #4d4e53 0%, #35363a 42%, #232427 100%);
    color: #eceef1;
    font-family: inherit;
    cursor: pointer;
    padding: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    line-height: 1;
    touch-action: none;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.28),
      inset 0 -2px 3px rgba(0,0,0,.6),
      0 2px 3px rgba(0,0,0,.55);
  }
  .nk b { font-size: 13px; font-weight: 700; text-shadow: 0 1px 1px rgba(0,0,0,.7); }
  .nk i { font-size: 6.5px; font-style: normal; letter-spacing: .4px; color: #a7abb2; }
  .nk.live b { color: #8fd79a; }

  .call:active, .end:active, .rk:active, .nk:active,
  .call.down, .end.down, .rk.down, .nk.down {
    filter: brightness(1.35);
    box-shadow: inset 0 2px 4px rgba(0,0,0,.6);
    transform: translateY(1px);
  }

  /* الشريط الفاتح أسفل الجهاز */
  .chin {
    margin: 9px auto 0;
    width: 46%;
    height: 12px;
    border-radius: 4px 4px 8px 8px;
    background: linear-gradient(180deg, #b9bcc2, #85888e);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 1px 3px rgba(0,0,0,.6);
  }

  /* ---------- Screen ---------- */
  .screen-bezel {
    background: linear-gradient(180deg, #14161a, #23262c);
    border-radius: 7px;
    padding: 7px;
    box-shadow:
      inset 0 2px 6px rgba(0,0,0,.9),
      0 0 0 1px rgba(60,48,16,.7),
      0 1px 0 rgba(255,255,255,.4);
  }
  /* انعكاس زجاج خفيف يقطع الشاشة قطرياً، كما في صورة أي جهاز */
  .screen-bezel { position: relative; overflow: hidden; }
  .screen-bezel::after {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    background: linear-gradient(118deg,
      rgba(255,255,255,.16) 0%, rgba(255,255,255,.05) 26%,
      transparent 42%, transparent 100%);
  }

  .screen {
    position: relative;
    background: var(--lcd-bg);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: inset 0 0 20px rgba(23,32,44,.3);
  }

  .screen::after {
    /* subtle LCD pixel grid */
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(23,32,44,.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(23,32,44,.08) 1px, transparent 1px);
    background-size: 4px 4px;
  }

  .hud {
    direction: ltr;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 10px 2px;
    color: var(--lcd-dark);
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 1px;
  }
  .hud .hud-right { display: inline-flex; align-items: center; gap: 8px; }
  .hud .mute {
    background: transparent;
    border: 2px solid var(--lcd-dark);
    color: var(--lcd-dark);
    width: 22px; height: 22px;
    border-radius: 3px;
    font-size: 13px; line-height: 1;
    font-family: inherit; font-weight: bold;
    cursor: pointer;
    padding: 0;
  }
  .hud .mute.off { color: var(--lcd-bg); background: var(--lcd-dark); text-decoration: line-through; }
  .hud .bonus { visibility: hidden; }
  .hud .bonus.on { visibility: visible; animation: blink .5s steps(2) infinite; }
  @keyframes blink { to { opacity: .2; } }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    color: var(--lcd-dark);
    text-align: center;
    padding: 16px;
    background: rgba(159,176,200,.95);
  }
  .overlay.hidden { display: none; }
  .overlay { gap: 7px; padding: 10px; overflow: hidden; }
  .overlay h1 {
    font-size: 23px;
    letter-spacing: 2px;
    font-family: Arial Black, Arial, sans-serif;
    direction: ltr;
  }
  .overlay h2 { font-size: 18px; }
  .overlay p { font-size: 11.5px; line-height: 1.55; max-width: 100%; }
  .overlay p.tiny { font-size: 10px; }
  .overlay .big { font-size: 32px; font-weight: 900; }
  .overlay .btn {
    margin-top: 2px;
    font-size: 13px;
    padding: 6px 18px;
    background: var(--lcd-dark);
    color: var(--lcd-bg);
    border: none;
    padding: 8px 22px;
    font-family: inherit;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    border-radius: 3px;
    letter-spacing: 1px;
  }
  .overlay .btn:active { transform: translateY(1px); }

  .levels {
    direction: ltr;
    display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
  }
  .levels { gap: 4px; }
  .levels button {
    background: transparent;
    border: 2px solid var(--lcd-dark);
    color: var(--lcd-dark);
    width: 23px; height: 23px;
    font-size: 11px;
    font-family: inherit; font-weight: bold;
    cursor: pointer;
    border-radius: 3px;
  }
  .levels button.sel { background: var(--lcd-dark); color: var(--lcd-bg); }



  /* النصّ داخل الشاشة يُقاس على قدرها، وهي تصغر مع الإطار */
  @media (max-height: 800px) {
    .overlay { gap: 5px; padding: 7px; }
    .overlay h1 { font-size: 17px; }
    .overlay h2 { font-size: 15px; }
    .overlay p { font-size: 9.5px; line-height: 1.45; }
    .overlay p.tiny { font-size: 8.5px; }
    .overlay .big { font-size: 24px; }
    .overlay .btn { font-size: 11px; padding: 5px 14px; }
    .levels { gap: 3px; }
    .levels button { width: 19px; height: 19px; font-size: 9.5px; }
  }
  @media (max-height: 620px) {
    .overlay { gap: 3px; padding: 5px; }
    .overlay h1 { font-size: 14px; letter-spacing: 1px; }
    .overlay h2 { font-size: 12px; }
    .overlay p { font-size: 8px; line-height: 1.35; }
    .overlay p.tiny { display: none; }
    .overlay .big { font-size: 19px; }
    .overlay .btn { font-size: 9px; padding: 4px 11px; margin-top: 0; }
    .levels button { width: 15px; height: 15px; font-size: 8px; border-width: 1px; }
    .nk { height: 25px; }
    .nk i { display: none; }
    .brand { font-size: 12px; }
  }
  /* إطار قصير جداً: الجهاز كله يصغر ليُرى بكامله */
  @media (max-height: 470px) {
    .phone { padding-bottom: 6px; }
    .fascia { margin: 5px 8px 6px; padding: 6px 6px 7px; gap: 4px; }
    .earpiece { height: 9px; } .earpiece i { height: 9px; }
    .brand { font-size: 10px; margin: 0; }
    .keypad { gap: 3px; margin: 0 9px; }
    .krow { gap: 3px; }
    .nk { height: 19px; }
    .nk b { font-size: 11px; }
    .call, .end { height: 19px; font-size: 10px; }
    .rocker { width: 42px; height: 25px; }
    .rk { width: 42px; }
    .rk.up, .rk.dn { height: 10px; }
    .rk.ok { top: 9px; height: 7px; }
    .chin { height: 8px; margin-top: 5px; }
    .screen-bezel { padding: 5px; }
  }
</style>
</head>
<body>

<div class="phone">
  <!-- نوكيا 6310: بدن فحمي، وواجهة ذهبية في وسطه، ومجموعة تنقّل فضّية
       بمفتاحَي اتصال، ثم مفاتيح داكنة. -->
  <div class="fascia">
    <div class="earpiece" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="brand">Nokia</div>

    <div class="screen-bezel">
      <div class="screen">
        <div class="hud">
          <span id="score">0000</span>
          <span id="bonus" class="bonus">★ <span id="bonusTimer">20</span></span>
          <span class="hud-right">
            <span id="best">TOP 0000</span>
            <button id="muteBtn" class="mute" aria-label="كتم الصوت" title="الصوت (M)">♪</button>
          </span>
        </div>
        <canvas id="game" width="320" height="240"></canvas>

        <div id="menu" class="overlay">
          <h1>SNAKE II</h1>
          <p>الحواف مفتوحة: اخرج من جهة تعُد من المقابلة.</p>
          <p>السرعة:</p>
          <div class="levels" id="levels"></div>
          <button class="btn" id="startBtn">ابدأ</button>
          <p class="tiny">وجّه بمفاتيح الجهاز: 2 و4 و6 و8، أو بمفتاح التمرير.</p>
        </div>

        <div id="paused" class="overlay hidden">
          <h2>إيقاف مؤقت</h2>
          <p>اضغط مسافة للمتابعة</p>
          <button class="btn" id="resumeBtn">متابعة</button>
        </div>

        <div id="gameover" class="overlay hidden">
          <h2>انتهت اللعبة</h2>
          <div class="big" id="finalScore">0</div>
          <p id="recordMsg"></p>
          <button class="btn" id="againBtn">العب مرة أخرى</button>
          <button class="btn" id="menuBtn">القائمة</button>
        </div>
      </div>
    </div>
    <div class="navwing">
      <button class="call" id="softLeft" aria-label="قائمة"><span>&#9742;</span></button>
      <div class="rocker">
        <button class="rk up" data-dir="up" aria-label="أعلى"></button>
        <button class="rk ok" id="okBtn" aria-label="اختيار"></button>
        <button class="rk dn" data-dir="down" aria-label="أسفل"></button>
      </div>
      <button class="end" id="softRight" aria-label="إيقاف"><span>&#9742;</span></button>
    </div>
  </div>

  <div class="keypad">
    <div class="krow">
      <button class="nk" data-k="1"><b>1</b><i>&#8734;</i></button>
      <button class="nk live" data-k="2" data-dir="up"><b>2</b><i>abc</i></button>
      <button class="nk" data-k="3"><b>3</b><i>def</i></button>
    </div>
    <div class="krow">
      <button class="nk live" data-k="4" data-dir="left"><b>4</b><i>ghi</i></button>
      <button class="nk" data-k="5"><b>5</b><i>jkl</i></button>
      <button class="nk live" data-k="6" data-dir="right"><b>6</b><i>mno</i></button>
    </div>
    <div class="krow">
      <button class="nk" data-k="7"><b>7</b><i>pqrs</i></button>
      <button class="nk live" data-k="8" data-dir="down"><b>8</b><i>tuv</i></button>
      <button class="nk" data-k="9"><b>9</b><i>wxyz</i></button>
    </div>
    <div class="krow">
      <button class="nk" data-k="*"><b>*</b><i>+</i></button>
      <button class="nk" data-k="0"><b>0</b><i>&nbsp;</i></button>
      <button class="nk" data-k="#"><b>#</b><i>&nbsp;</i></button>
    </div>
  </div>
  <div class="chin" aria-hidden="true"></div>
</div>

<script>
(() => {
  'use strict';

  // ---------- Grid & rendering constants ----------
  const COLS = 32;
  const ROWS = 24;
  const CELL = 10;               // canvas pixels per cell (canvas is 320x240)
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  /* ألوان شاشة 3310 نفسها: رمادي مخضرّ باهت وحبر شبه أسود */
  const COLOR_BG   = '#9fb0c8';
  const COLOR_DARK = '#17202c';
  const COLOR_MID  = '#43536b';

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const scoreEl = $('score'), bestEl = $('best');
  const bonusEl = $('bonus'), bonusTimerEl = $('bonusTimer');
  const menuEl = $('menu'), pausedEl = $('paused'), overEl = $('gameover');
  const finalScoreEl = $('finalScore'), recordMsgEl = $('recordMsg');
  const levelsEl = $('levels');

  // ---------- Persistent high score ----------
  const BEST_KEY = 'nokia-snake-best';
  let best = 0;
  try { best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (e) { best = 0; }

  // ---------- Game state ----------
  const DIRS = {
    up:    { x: 0,  y: -1 },
    down:  { x: 0,  y: 1 },
    left:  { x: -1, y: 0 },
    right: { x: 1,  y: 0 },
  };
  const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };

  let level = 5;                 // 1..9 like the original
  let state = 'menu';            // menu | playing | paused | over
  let snake = [];                // array of {x,y}, head first
  let dir = 'right';
  let dirQueue = [];             // buffered turns so quick double-taps register
  let food = null;
  let bonus = null;              // {x,y,ticksLeft}
  let foodsEaten = 0;
  let score = 0;
  let growBy = 0;
  let timer = null;
  let flashTicks = 0;            // death animation

  const levelDelay = lvl => Math.round(300 - (lvl - 1) * 27); // ms per tick: 300 → 84

  // ---------- Level picker ----------
  for (let i = 1; i <= 9; i++) {
    const b = document.createElement('button');
    b.textContent = i;
    b.dataset.level = i;
    if (i === level) b.classList.add('sel');
    b.addEventListener('click', () => {
      level = i;
      [...levelsEl.children].forEach(c => c.classList.toggle('sel', +c.dataset.level === level));
    });
    levelsEl.appendChild(b);
  }

  // ---------- Helpers ----------
  const pad4 = n => String(n).padStart(4, '0');
  function updateHud() {
    scoreEl.textContent = pad4(score);
    bestEl.textContent = 'TOP ' + pad4(best);
    if (bonus) {
      bonusEl.classList.add('on');
      bonusTimerEl.textContent = Math.ceil(bonus.ticksLeft / 2);
    } else {
      bonusEl.classList.remove('on');
    }
  }

  function isOccupied(x, y) {
    return snake.some(s => s.x === x && s.y === y)
        || (food && food.x === x && food.y === y)
        || (bonus && bonus.x === x && bonus.y === y);
  }

  function randomFreeCell() {
    let tries = 0;
    while (tries++ < 2000) {
      const x = Math.floor(Math.random() * COLS);
      const y = Math.floor(Math.random() * ROWS);
      if (!isOccupied(x, y)) return { x, y };
    }
    return null;
  }

  function spawnFood() {
    food = randomFreeCell();
  }

  function spawnBonus() {
    // bonus needs 2 free horizontal cells (the classic "bug")
    for (let t = 0; t < 500; t++) {
      const x = Math.floor(Math.random() * (COLS - 1));
      const y = Math.floor(Math.random() * ROWS);
      if (!isOccupied(x, y) && !isOccupied(x + 1, y)) {
        bonus = { x, y, ticksLeft: 40 };
        return;
      }
    }
  }

  // ---------- Sound (Web Audio, no external files) ----------
  const SOUND_KEY = 'nokia-snake-sound';
  let soundOn = true;
  try { soundOn = localStorage.getItem(SOUND_KEY) !== 'off'; } catch (e) {}
  const muteBtn = $('muteBtn');

  let actx = null;
  function audioCtx() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  // iOS/Safari only allow audio after a user gesture: warm the context on the first one.
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev =>
    document.addEventListener(ev, () => { if (soundOn) audioCtx(); }, { passive: true }));

  // Square-wave beeps, like a monophonic phone speaker.
  // notes: array of [frequencyHz, durationMs, gapMs?]; 0 Hz = rest
  function play(notes, vol = 0.08) {
    if (!soundOn) return;
    const ac = audioCtx();
    if (!ac) return;
    let t = ac.currentTime;
    for (const [freq, dur, gap = 15] of notes) {
      if (freq > 0) {
        const osc = ac.createOscillator();
        const g = ac.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.004);
        g.gain.setValueAtTime(vol, t + dur / 1000 - 0.008);
        g.gain.linearRampToValueAtTime(0, t + dur / 1000);
        osc.connect(g).connect(ac.destination);
        osc.start(t);
        osc.stop(t + dur / 1000 + 0.01);
      }
      t += (dur + gap) / 1000;
    }
  }

  const SFX = {
    eat:        () => play([[880, 45]]),
    turn:       () => play([[220, 12]], 0.025),
    bonusShow:  () => play([[1175, 40], [1568, 40], [1175, 40], [1568, 40]]),
    bonusEat:   () => play([[988, 50], [1319, 50], [1760, 90]]),
    bonusGone:  () => play([[330, 60], [262, 90]], 0.05),
    start:      () => play([[659, 70], [784, 70], [988, 70], [1319, 140]]),
    pause:      () => play([[523, 40], [392, 60]]),
    resume:     () => play([[392, 40], [523, 60]]),
    over:       () => play([[494, 120], [440, 120], [392, 120], [349, 120], [0, 60], [262, 320]]),
    record:     () => play([[784, 60], [988, 60], [1175, 60], [1568, 60], [0, 40], [1568, 60], [0, 40], [1568, 180]]),
    click:      () => play([[660, 25]], 0.05),
  };

  function updateMuteBtn() {
    muteBtn.classList.toggle('off', !soundOn);
    muteBtn.setAttribute('aria-label', soundOn ? 'كتم الصوت' : 'تشغيل الصوت');
  }
  function toggleSound() {
    soundOn = !soundOn;
    try { localStorage.setItem(SOUND_KEY, soundOn ? 'on' : 'off'); } catch (e) {}
    updateMuteBtn();
    if (soundOn) SFX.click();
  }
  muteBtn.addEventListener('click', e => { e.stopPropagation(); toggleSound(); });
  updateMuteBtn();

  // ---------- Game lifecycle ----------
  function resetGame() {
    const cy = Math.floor(ROWS / 2);
    snake = [];
    for (let i = 0; i < 5; i++) snake.push({ x: 8 - i, y: cy });
    dir = 'right';
    dirQueue = [];
    score = 0;
    growBy = 0;
    foodsEaten = 0;
    bonus = null;
    flashTicks = 0;
    spawnFood();
    updateHud();
  }

  function showOverlay(which) {
    menuEl.classList.toggle('hidden', which !== 'menu');
    pausedEl.classList.toggle('hidden', which !== 'paused');
    overEl.classList.toggle('hidden', which !== 'over');
  }

  function startGame() {
    resetGame();
    state = 'playing';
    showOverlay(null);
    SFX.start();
    startLoop();
    draw();
  }

  function startLoop() {
    stopLoop();
    timer = setInterval(tick, levelDelay(level));
  }
  function stopLoop() {
    if (timer) clearInterval(timer);
    timer = null;
  }

  function pauseGame() {
    if (state !== 'playing') return;
    state = 'paused';
    stopLoop();
    SFX.pause();
    showOverlay('paused');
  }
  function resumeGame() {
    if (state !== 'paused') return;
    state = 'playing';
    showOverlay(null);
    SFX.resume();
    startLoop();
  }
  function togglePause() {
    if (state === 'playing') pauseGame();
    else if (state === 'paused') resumeGame();
  }

  function gameOver() {
    state = 'over';
    stopLoop();
    let record = false;
    if (score > best) {
      best = score;
      record = true;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
    }
    updateHud();
    if (record) SFX.record(); else SFX.over();
    // death flash animation, then overlay
    flashTicks = 6;
    const flash = setInterval(() => {
      flashTicks--;
      draw();
      if (flashTicks <= 0) {
        clearInterval(flash);
        finalScoreEl.textContent = score;
        recordMsgEl.textContent = record ? '🏆 رقم قياسي جديد!' : 'أفضل نتيجة: ' + best;
        showOverlay('over');
      }
    }, 150);
  }

  function goMenu() {
    stopLoop();
    state = 'menu';
    resetGame();
    showOverlay('menu');
    draw();
  }

  // ---------- Input ----------
  function queueDir(d) {
    if (!DIRS[d]) return;
    const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
    if (d === last || d === OPPOSITE[last]) return;
    if (dirQueue.length < 3) { dirQueue.push(d); SFX.turn(); }
  }

  const KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right',
    // Nokia keypad layout: 2 up, 8 down, 4 left, 6 right
    '2': 'up', '8': 'down', '4': 'left', '6': 'right',
  };

  document.addEventListener('keydown', e => {
    const d = KEYMAP[e.key];
    if (d) {
      e.preventDefault();
      if (state === 'menu') startGame();
      if (state === 'playing') queueDir(d);
      return;
    }
    if (e.key === ' ' || e.key === 'p' || e.key === 'P') {
      e.preventDefault();
      if (state === 'menu') startGame();
      else if (state === 'over') startGame();
      else togglePause();
    }
    if (e.key === 'Enter') {
      if (state === 'menu' || state === 'over') startGame();
      else if (state === 'paused') resumeGame();
    }
    if (e.key === 'm' || e.key === 'M') { toggleSound(); return; }
    if (e.key === 'Escape') {
      if (state === 'playing') pauseGame();
      else if (state === 'paused' || state === 'over') goMenu();
    }
  });

  // كل مفتاح يحمل اتجاهاً يقود الدودة: مفتاح التمرير، و2/4/6/8 كما على الجهاز
  document.querySelectorAll('.keypad [data-dir]').forEach(btn => {
    const handler = e => {
      e.preventDefault();
      if (state === 'menu') startGame();
      if (state === 'playing') queueDir(btn.dataset.dir);
    };
    btn.addEventListener('pointerdown', handler);
  });

  // بقيّة الأرقام لا توجّه، لكنها تضغط: 5 يبدأ ويختار، وC يوقف
  document.querySelectorAll('.nk:not([data-dir])').forEach(btn => {
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (btn.dataset.k === '5' && (state === 'menu' || state === 'over')) startGame();
    });
  });
  /* مفتاح الإنهاء الأحمر يوقف، كما يفعل في الجهاز */

  $('okBtn').addEventListener('click', () => {
    if (state === 'menu' || state === 'over') startGame();
    else togglePause();
  });
  $('softLeft').addEventListener('click', goMenu);
  $('softRight').addEventListener('click', () => {
    if (state === 'playing' || state === 'paused') togglePause();
  });
  $('startBtn').addEventListener('click', startGame);
  $('resumeBtn').addEventListener('click', resumeGame);
  $('againBtn').addEventListener('click', startGame);
  $('menuBtn').addEventListener('click', goMenu);

  // Swipe on the screen
  let touchStart = null;
  const screen = document.querySelector('.screen');
  screen.addEventListener('touchstart', e => {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  screen.addEventListener('touchmove', e => {
    if (!touchStart) return;
    const t = e.touches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    const TH = 24;
    if (Math.abs(dx) < TH && Math.abs(dy) < TH) return;
    const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    if (state === 'playing') queueDir(d);
    touchStart = null;
  }, { passive: true });
  screen.addEventListener('touchend', () => { touchStart = null; }, { passive: true });

  // Pause automatically when tab is hidden
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') pauseGame();
  });

  // ---------- Game tick ----------
  function tick() {
    if (dirQueue.length) dir = dirQueue.shift();
    const v = DIRS[dir];
    const head = snake[0];
    // Open edges: leaving one side brings the snake back in from the opposite side
    const nx = (head.x + v.x + COLS) % COLS;
    const ny = (head.y + v.y + ROWS) % ROWS;

    // Self collision (tail tip is allowed since it moves away this tick, unless we grow)
    const bodyToCheck = growBy > 0 ? snake : snake.slice(0, -1);
    if (bodyToCheck.some(s => s.x === nx && s.y === ny)) return gameOver();

    snake.unshift({ x: nx, y: ny });

    // Eat regular food
    if (food && nx === food.x && ny === food.y) {
      score += level;
      growBy += 1;
      foodsEaten++;
      food = null;
      spawnFood();
      SFX.eat();
      if (foodsEaten % 5 === 0 && !bonus) { spawnBonus(); if (bonus) SFX.bonusShow(); }
    }
    // Eat bonus (2 cells wide)
    else if (bonus && ny === bonus.y && (nx === bonus.x || nx === bonus.x + 1)) {
      score += level * Math.max(1, Math.ceil(bonus.ticksLeft / 4));
      growBy += 2;
      bonus = null;
      SFX.bonusEat();
    }

    if (growBy > 0) growBy--;
    else snake.pop();

    if (bonus) {
      bonus.ticksLeft--;
      if (bonus.ticksLeft <= 0) { bonus = null; SFX.bonusGone(); }
    }

    updateHud();
    draw();
  }

  // ---------- Drawing ----------
  function cellRect(x, y, inset = 1) {
    ctx.fillRect(x * CELL + inset, y * CELL + inset, CELL - inset * 2, CELL - inset * 2);
  }

  function drawSnake() {
    ctx.fillStyle = COLOR_DARK;
    for (let i = snake.length - 1; i >= 1; i--) {
      const s = snake[i];
      // body segment with a small "checker" hole for the classic look
      cellRect(s.x, s.y, 1);
      ctx.fillStyle = COLOR_BG;
      ctx.fillRect(s.x * CELL + 4, s.y * CELL + 4, 2, 2);
      ctx.fillStyle = COLOR_DARK;
    }
    // head: solid with an eye
    const h = snake[0];
    cellRect(h.x, h.y, 0);
    ctx.fillStyle = COLOR_BG;
    const v = DIRS[dir];
    const ex = h.x * CELL + 5 + v.x * 2 - (v.y !== 0 ? 2 : 0);
    const ey = h.y * CELL + 5 + v.y * 2 - (v.x !== 0 ? 2 : 0);
    ctx.fillRect(ex, ey, 2, 2);
  }

  function drawFood() {
    if (!food) return;
    ctx.fillStyle = COLOR_DARK;
    // small diamond
    const cx = food.x * CELL, cy = food.y * CELL;
    ctx.fillRect(cx + 4, cy + 2, 2, 6);
    ctx.fillRect(cx + 2, cy + 4, 6, 2);
    ctx.fillRect(cx + 3, cy + 3, 4, 4);
  }

  function drawBonus() {
    if (!bonus) return;
    ctx.fillStyle = COLOR_DARK;
    const bx = bonus.x * CELL, by = bonus.y * CELL;
    // a little "bug": body of 2 cells wide, with legs
    ctx.fillRect(bx + 3, by + 3, 14, 4);
    ctx.fillRect(bx + 5, by + 1, 10, 8);
    ctx.fillStyle = COLOR_BG;
    ctx.fillRect(bx + 7, by + 3, 2, 2);
    ctx.fillRect(bx + 11, by + 3, 2, 2);
    ctx.fillStyle = COLOR_MID;
    ctx.fillRect(bx + 1, by + 2, 2, 1); ctx.fillRect(bx + 17, by + 2, 2, 1);
    ctx.fillRect(bx + 1, by + 7, 2, 1); ctx.fillRect(bx + 17, by + 7, 2, 1);
  }

  function drawBorder() {
    // dashed frame: the edges are open, the snake wraps around
    ctx.strokeStyle = COLOR_MID;
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.strokeRect(1, 1, canvas.width - 2, canvas.height - 2);
    ctx.setLineDash([]);
  }

  function draw() {
    ctx.fillStyle = COLOR_BG;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawBorder();
    drawFood();
    drawBonus();
    // death flash: alternate hiding the snake
    if (state === 'over' && flashTicks % 2 === 1) return;
    drawSnake();
  }

  // ---------- Boot ----------
  resetGame();
  showOverlay('menu');
  draw();
})();
</script>
</body>
</html>
