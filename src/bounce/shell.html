<title>Bounce</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --ground: #14161c;          /* الصفحة تبقى داكنة ليبرز البدن الفاتح */
    --body-hi: #cdd2d9;         /* الغلاف الفضّي */
    --body: #b2b8c1;
    --body-lo: #969ca6;
    --face-hi: #eef0f3;         /* اللوحة الأمامية، رمادي أفتح قليلاً */
    --face: #dfe2e7;
    --face-lo: #ccd0d6;
    --key: #e8eaee;             /* مفاتيح فضّية فاتحة */
    --key-down: #c0c5cd;
    --key-ink: #23262c;         /* حبر داكن عليها */
    --accent: #e8231f;     /* لون اللعبة: المؤشّران وحلقة العصا */
    --amber: #e59a4d;
    --muted: #8a93a8;
    --border: #969ca6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    position: fixed;
    inset: 0;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    background: var(--ground);
    color: var(--key-ink);
    font-family: Tahoma, "Segoe UI", -apple-system, Arial, sans-serif;
  }
  #shell {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-inline: 4px;
    padding-block: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-bottom));
  }
  #top {
    display: flex;
    align-items: baseline;
    gap: 12px;
    width: 100%;
    max-width: 720px;
    justify-content: space-between;
    flex: 0 0 auto;
  }
  #brand { font-family: "Courier New", monospace; font-weight: 700; font-size: 16px; letter-spacing: 3px; color: var(--amber); margin: 0; }
  #sub { font-size: 12px; color: var(--muted); direction: rtl; }
  /* ==================== الهيكل ====================
     سبيكة عامودية واحدة: شاشة كبيرة أعلاها، ولوحة تحكّم أسفلها حيث يصل
     الإبهام. القاعدة التي تحكم كل مقاس: لا هدف لمس دون 46 بكسل. */
  .unit {
    width: 100%;
    max-width: min(400px, 58vh);
    height: 100%;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
    /* الصورة تكبر بمضاعفات صحيحة، فكل بكسل من الحشوة قد يكلّف درجة كاملة */
    padding: 8px 8px 12px;
    border-radius: 26px;
    background:
      /* أربعة براغٍ في الزوايا: طابع الأجهزة القديمة بلا كلفة في المساحة */
      radial-gradient(circle 4px at 16px 16px, #16191e 0 52%, rgba(255,255,255,.10) 54% 68%, transparent 70%),
      radial-gradient(circle 4px at calc(100% - 16px) 16px, #16191e 0 52%, rgba(255,255,255,.10) 54% 68%, transparent 70%),
      radial-gradient(circle 4px at 16px calc(100% - 16px), #16191e 0 52%, rgba(255,255,255,.10) 54% 68%, transparent 70%),
      radial-gradient(circle 4px at calc(100% - 16px) calc(100% - 16px), #16191e 0 52%, rgba(255,255,255,.10) 54% 68%, transparent 70%),
      linear-gradient(168deg, #3a4048 0%, #24282e 46%, #171a1f 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.14),
      inset 0 -2px 6px rgba(0,0,0,.6),
      0 20px 44px rgba(0,0,0,.7);
  }
  .cap {
    flex: none;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    height: 16px;
  }
  .led {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .name {
    font-family: var(--font-pixel, monospace);
    font-size: 11px; letter-spacing: 5px; direction: ltr;
    color: #8f98a5;
  }
  .well {
    flex: 1 1 auto;
    min-height: 0;
    padding: 7px;
    border-radius: 14px;
    background: #0c0e11;
    box-shadow:
      inset 0 3px 9px rgba(0,0,0,.9),
      0 0 0 1px rgba(232,35,31,.14),
      0 0 22px rgba(232,35,31,.10),
      0 1px 0 rgba(255,255,255,.1);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game {
    display: block;
    background: #000;
    border-radius: 3px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
  }

  .deck {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 11px 10px 10px;
    border-radius: 16px;
    background: linear-gradient(180deg, #2b3138, #1e2228);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 1px 0 rgba(255,255,255,.06);
  }
  .pills { display: flex; gap: 10px; width: 100%; }
  .pill {
    flex: 1;
    appearance: none; -webkit-appearance: none;
    height: 46px;
    border: 1px solid #3d444d;
    border-radius: 23px;
    background: linear-gradient(180deg, #39404a, #262b32);
    color: #dfe5ee;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    touch-action: none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 2px 0 #12151a;
  }
  .pill:active, .pill.down {
    transform: translateY(2px);
    box-shadow: inset 0 2px 5px rgba(0,0,0,.5);
    background: linear-gradient(180deg, #454d58, #2f353d);
  }

  /* الفرّار: قرص عريض، العصا تظهر حيث يقع الإبهام فلا شيء صغير يُصاب */
  #stickpad {
    width: 100%;
    height: 156px;
    position: relative;
    direction: ltr;
    touch-action: none;
  }
  #stickzone {
    position: absolute;
    inset: 0;
    border-radius: 78px;
    border: 1px solid #3d444d;
    background: linear-gradient(180deg, #2f353d, #20242a);
    box-shadow: inset 0 2px 6px rgba(0,0,0,.55);
    touch-action: none;
  }
  #stickbase {
    position: absolute;
    width: 112px; height: 112px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.03);
    pointer-events: none;
    opacity: .7;
  }
  #stickbase.active { opacity: 1; border-color: rgba(232,35,31,.4); }
  #stickknob {
    position: absolute;
    left: 30px; top: 30px;
    width: 52px; height: 52px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #545c68, #2b3038 72%);
    border: 1px solid #454d58;
    box-shadow: 0 3px 6px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.2);
  }
  #stickbase.active #stickknob {
    background: radial-gradient(circle at 38% 32%, #6a7280, #363c46 72%);
    box-shadow: 0 3px 6px rgba(0,0,0,.6), inset 0 0 0 2px rgba(232,35,31,.35);
  }

  /* لوحة الأرقام: النظام البديل من القائمة */
  #keypad {
    display: none;
    width: 100%;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .num {
    appearance: none; -webkit-appearance: none;
    height: 52px;
    border: 1px solid #3d444d;
    border-radius: 12px;
    background: linear-gradient(180deg, #39404a, #262b32);
    color: #dfe5ee;
    font-family: inherit;
    cursor: pointer; padding: 0;
    touch-action: none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 3px 0 #12151a;
  }
  .num b { font-size: 17px; font-weight: 700; }
  .num.live b { color: var(--accent); }
  .num:active, .num.down { transform: translateY(2px); box-shadow: inset 0 2px 5px rgba(0,0,0,.5); }

  body.joystick #keypad { display: none; }
  body.joystick #stickpad { display: block; }
  body:not(.joystick) #stickpad { display: none; }
  body:not(.joystick) #keypad { display: grid; }

  @media (max-height: 700px) {
    .unit { gap: 8px; padding: 10px 10px 12px; }
    #stickpad { height: 132px; }
    .deck { gap: 8px; padding: 9px 8px 9px; }
    .num { height: 48px; }
  }
  @media (max-height: 560px) {
    .cap { display: none; }
    #stickpad { height: 116px; }
    .pill { height: 44px; font-size: 12px; }
    .num { height: 46px; }
  }
  /* إطار عريض قصير: اللوحة إلى جانب الشاشة */
  @media (orientation: landscape) and (max-height: 560px) {
    .unit { flex-direction: row; align-items: center; max-width: none; width: auto; gap: 12px; }
    .cap { display: none; }
    .well { flex: 0 1 auto; min-width: 0; align-self: stretch; }
    .deck { flex: none; align-self: center; width: 190px; }
    .pills { flex-direction: column; }
    .pill { flex: none; width: 100%; height: 46px; }
    #stickpad { height: 150px; }
  }

  #hint { display: none; }
  body.touch:not(.joystick) #pad { display: grid; }
  body.touch #hint-keys { display: none; }
  body:not(.touch) #hint-touch { display: none; }
  @media (max-height: 460px) {
    #shell { gap: 6px; }
    #top, #hint { display: none; }
    #pad button { height: 56px; font-size: 22px; }
    #stickpad { height: 104px; }
    #stickbase { width: 88px; height: 88px; }
    #stickknob { left: 22px; top: 22px; width: 42px; height: 42px; }
  }
  @media (max-width: 400px) { #sub { display: none; } }
  /* installed as an app: give the whole screen to the game */
  @media (display-mode: standalone), (display-mode: fullscreen) {
    #top, #hint { display: none; }
    #shell { gap: 8px; }
  }
  body.standalone #top, body.standalone #hint { display: none; }
</style>

<div id="shell">
  <div class="unit">
    <div class="cap">
      <span class="led" aria-hidden="true"></span>
      <span class="name">BOUNCE</span>
      <span class="led" aria-hidden="true"></span>
    </div>

    <div class="well">
      <div id="stage"><canvas id="game" width="384" height="384"></canvas></div>
    </div>

    <div class="deck">
      <div class="pills">
        <button class="pill" id="softL">القائمة</button>
        <button class="pill" id="softR">إيقاف</button>
      </div>

      <div id="stickpad">
        <div id="stickzone"><div id="stickbase"><div id="stickknob"></div></div></div>
      </div>

      <div id="keypad">
        <button class="num" data-k="1"><b>1</b></button>
        <button class="num" data-k="2"><b>2</b></button>
        <button class="num" data-k="3"><b>3</b></button>
        <button class="num" data-k="4"><b>4</b></button>
        <button class="num" data-k="5"><b>5</b></button>
        <button class="num" data-k="6"><b>6</b></button>
      </div>
    </div>
  </div>
</div>
