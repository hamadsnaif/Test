<title>Bounce</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --ground: #14161c;
    --key: #2b3040;
    --key-down: #3d4460;
    --key-ink: #dfe6f5;
    --amber: #e59a4d;
    --muted: #8a93a8;
    --border: #3a4152;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    position: fixed;
    inset: 0;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    background: var(--ground);
    color: var(--key-ink);
    font-family: Tahoma, "Segoe UI", -apple-system, Arial, sans-serif;
  }
  #shell {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding-inline: 16px;
    padding-block: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-bottom));
  }
  #top {
    display: flex;
    align-items: baseline;
    gap: 12px;
    width: 100%;
    max-width: 720px;
    justify-content: space-between;
    flex: 0 0 auto;
  }
  #brand { font-family: "Courier New", monospace; font-weight: 700; font-size: 16px; letter-spacing: 3px; color: var(--amber); margin: 0; }
  #sub { font-size: 12px; color: var(--muted); direction: rtl; }
  #stage {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game {
    display: block;
    background: #000;
    border: 3px solid var(--border);
    border-radius: 4px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
  }
  #pad {
    flex: 0 0 auto;
    width: 100%;
    max-width: 720px;
    display: none;
    grid-template-columns: 0.55fr 1fr 1fr 1.4fr;
    gap: 10px;
    direction: ltr;
  }
  #pad button {
    height: 72px;
    font-size: 26px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--key);
    color: var(--key-ink);
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.35);
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    padding: 0;
  }
  #pad button.down, #pad button:active {
    background: var(--key-down);
    box-shadow: inset 0 3px 0 rgba(0,0,0,.35);
    transform: translateY(2px);
  }
  #pad button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  /* joystick scheme */
  #stickpad {
    flex: 0 0 auto;
    width: 100%;
    max-width: 720px;
    height: 132px;
    display: none;
    position: relative;
    direction: ltr;
    touch-action: none;
  }
  #stickzone, #jumpzone {
    position: absolute;
    top: 0;
    height: 100%;
    width: 42%;
    touch-action: none;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: rgba(43, 48, 64, 0.35);
  }
  #stickzone { left: 0; }
  #jumpzone {
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    color: var(--key-ink);
  }
  #jumpzone.down { background: var(--key-down); }
  #jumpdot {
    width: 92px; height: 92px;
    border-radius: 50%;
    background: var(--key);
    border: 1px solid var(--border);
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  #jumpzone.down #jumpdot { background: var(--key-down); box-shadow: inset 0 3px 0 rgba(0,0,0,.35); }
  #stickbase {
    position: absolute;
    width: 104px; height: 104px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: rgba(43, 48, 64, 0.5);
    left: 14px; top: 14px;
    pointer-events: none;
    opacity: .6;
  }
  #stickbase.active { opacity: 1; }
  #stickknob {
    position: absolute;
    left: 28px; top: 28px;
    width: 48px; height: 48px;
    border-radius: 50%;
    background: var(--key);
    border: 1px solid var(--border);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.35);
  }
  #stickbase.active #stickknob { background: var(--key-down); }
  #btnM2 {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 52px; height: 52px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--key);
    color: var(--key-ink);
    font-size: 20px;
    padding: 0;
    touch-action: none;
  }
  #btnM2:active { background: var(--key-down); }
  body.touch.joystick #pad { display: none; }
  body.touch.joystick #stickpad { display: block; }
  /* landscape: float the stick and the jump pad in the side margins so the
     game itself can use the whole height */
  @media (orientation: landscape) and (max-height: 560px) {
    body.touch.joystick #shell { position: relative; }
    body.touch.joystick #stickpad {
      position: absolute;
      inset: 0;
      height: auto;
      max-width: none;
      pointer-events: none;
    }
    body.touch.joystick #stickzone,
    body.touch.joystick #jumpzone {
      pointer-events: auto;
      width: min(150px, 22vw);
      height: min(160px, 46vh);
      top: auto;
      bottom: max(10px, env(safe-area-inset-bottom));
    }
    body.touch.joystick #stickzone { left: max(10px, env(safe-area-inset-left)); }
    body.touch.joystick #jumpzone { right: max(10px, env(safe-area-inset-right)); }
    body.touch.joystick #btnM2 {
      pointer-events: auto;
      left: auto; top: max(8px, env(safe-area-inset-top));
      right: max(10px, env(safe-area-inset-right));
      transform: none;
    }
  }
  #hint { font-size: 12px; color: var(--muted); direction: rtl; text-align: center; flex: 0 0 auto; }
  body.touch:not(.joystick) #pad { display: grid; }
  body.touch #hint-keys { display: none; }
  body:not(.touch) #hint-touch { display: none; }
  @media (max-height: 460px) {
    #shell { gap: 6px; }
    #top, #hint { display: none; }
    #pad button { height: 56px; font-size: 22px; }
    #stickpad { height: 104px; }
    #stickbase { width: 88px; height: 88px; }
    #stickknob { left: 22px; top: 22px; width: 42px; height: 42px; }
    #jumpdot { width: 76px; height: 76px; }
  }
  @media (max-width: 400px) { #sub { display: none; } }
  /* installed as an app: give the whole screen to the game */
  @media (display-mode: standalone), (display-mode: fullscreen) {
    #top, #hint { display: none; }
    #shell { gap: 8px; }
  }
  body.standalone #top, body.standalone #hint { display: none; }
</style>

<div id="shell">
  <div id="top">
    <h1 id="brand">BOUNCE</h1>
    <div id="sub">نوكيا، المرحلة الأولى الأصلية</div>
  </div>
  <div id="stage"><canvas id="game" width="384" height="384"></canvas></div>
  <div id="pad">
    <button id="btnM" aria-label="القائمة">☰</button>
    <button id="btnL" aria-label="يسار">◀ 4</button>
    <button id="btnR" aria-label="يمين">6 ▶</button>
    <button id="btnJ" aria-label="قفز">2 ▲ قفز</button>
  </div>
  <div id="stickpad">
    <div id="stickzone"><div id="stickbase"><div id="stickknob"></div></div></div>
    <button id="btnM2" aria-label="القائمة">☰</button>
    <div id="jumpzone"><div id="jumpdot">قفز</div></div>
  </div>
  <div id="hint">
    <span id="hint-keys">← → أو 4 / 6 للحركة، ↑ أو 2 أو المسافة للقفز، Esc للإيقاف المؤقت والعودة للقائمة. التقدم يُحفظ تلقائياً.</span>
    <span id="hint-touch">بدّل بين الأزرار والعصا من القائمة. ☰ للإيقاف المؤقت. التقدم يُحفظ تلقائياً.</span>
  </div>
</div>
