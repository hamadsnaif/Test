<title>Bounce</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ==================== المادة المشتركة: «عاج وألمنيوم مؤكسد» ====================
   جسم من بلاستيك عاجي دافئ كأجهزة السبعينات (آلة حاسبة، راديو جيب)، ولوحة
   شاشة من ألمنيوم داكن مصقول تطوّقها حلقة مؤكسدة بلون اللعبة، ومفاتيح محدّبة
   عاجية يعلوها مفتاح واحد بلون اللعبة. لا سطح مسطّح في الجهاز كله: كل طبقة
   تحمل تدرّجاً خفياً وتموّجاً خافتاً يُقرأ كعرق المادة لا كخطوط.
   كل التفاصيل رسومات CSS لا تكلّف الشاشة بكسلاً واحداً. */
:root {
  --ivory-hi:#f7f2e7; --ivory:#e9e2d1; --ivory-lo:#d5ccb7; --ivory-edge:#b9ae97; --ivory-deep:#a3977e;
  --ink:#2a2723; --engrave:#6e6555;
  --alu-hi:#464a51; --alu:#2b2e33; --alu-lo:#181a1e;
  --mat:#1a1714; --mat-hi:#2f2a24;
  --font-ui: "Helvetica Neue", Helvetica, Arial, Tahoma, "Segoe UI", sans-serif;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
/* ---- الأرضية: بساط لبّاد داكن تحت بقعة ضوء دافئة، لا لون واحد مسطّح ---- */
.ground {
  background:
    radial-gradient(120% 70% at 50% -8%, rgba(255,236,205,.20), rgba(255,236,205,0) 62%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.016) 0 2px, rgba(0,0,0,0) 2px 6px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.016) 0 2px, rgba(0,0,0,0) 2px 6px),
    radial-gradient(110% 90% at 50% 110%, var(--mat-hi), var(--mat) 65%);
}
/* ---- البدن: عاج دافئ بلمعة خفية من أعلى اليسار وتموّج أفقي خافت جداً.
   الحافة حلقة ظلّ لا border كي لا تكلّف بكسلاً من عرض الشاشة ---- */
.unit {
  background:
    radial-gradient(120% 60% at 15% 0%, rgba(255,255,255,.60), rgba(255,255,255,0) 55%),
    repeating-linear-gradient(180deg, rgba(255,255,255,.055) 0 1px, rgba(0,0,0,0) 1px 3px),
    linear-gradient(162deg, var(--ivory-hi) 0%, var(--ivory) 48%, var(--ivory-lo) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 0 -3px 8px rgba(90,70,40,.22),
    inset 0 0 44px rgba(120,95,60,.13),
    0 0 0 1px var(--ivory-edge),
    0 2px 0 var(--ivory-deep),
    0 26px 48px rgba(0,0,0,.62);
}
/* ---- لوحة الشاشة: ألمنيوم داكن بخطوط صقل أفقية وحلقة مؤكسدة بلون اللعبة ---- */
.plate {
  position:relative;
  background:
    repeating-linear-gradient(180deg, rgba(255,255,255,.05) 0 1px, rgba(0,0,0,0) 1px 2px, rgba(0,0,0,.08) 2px 3px),
    linear-gradient(180deg, var(--alu-hi), var(--alu) 55%, var(--alu-lo));
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.07),
    inset 0 0 0 2.5px var(--acc-ring),
    inset 0 3px 8px rgba(0,0,0,.75),
    0 1px 0 rgba(255,255,255,.6),
    0 0 0 1px rgba(0,0,0,.4);
}
/* انعكاس زجاجي خافت فوق الشاشة (لا يستقبل اللمس) */
.plate::after {
  content:""; position:absolute; inset:7px; pointer-events:none; border-radius:5px; z-index:3;
  background:linear-gradient(118deg, rgba(255,255,255,.09) 0%, rgba(255,255,255,.025) 32%, rgba(255,255,255,0) 52%);
}
/* ---- لوحة المفاتيح: حوض عاجي غائر قليلاً بخيط ضوء أسفله (الدرزة) ---- */
.deck {
  border-radius:18px;
  background:
    repeating-linear-gradient(180deg, rgba(255,255,255,.045) 0 1px, rgba(0,0,0,0) 1px 3px),
    linear-gradient(180deg, var(--ivory-lo), var(--ivory) 32%, var(--ivory-lo));
  box-shadow:
    inset 0 2px 5px rgba(90,70,40,.28),
    inset 0 -1px 0 rgba(255,255,255,.75),
    0 1px 0 rgba(255,255,255,.65);
}
/* ---- المفتاح: قبّة عاجية محدّبة في تجويف مصبوب، تغوص 2 بكسل عند الضغط ---- */
.key {
  flex:none;
  appearance:none; -webkit-appearance:none; border:0; padding:0; margin:0; cursor:pointer;
  touch-action:none; -webkit-user-select:none; user-select:none;
  display:inline-flex; align-items:center; justify-content:center;
  color:var(--ink); font:700 16px/1 var(--font-ui);
  border-radius:14px;
  background:
    radial-gradient(90% 70% at 35% 22%, rgba(255,255,255,.95), rgba(255,255,255,0) 60%),
    linear-gradient(180deg, var(--ivory-hi), var(--ivory-lo));
  box-shadow:
    inset 0 1px 0 #fff,
    inset 0 -2px 3px rgba(90,70,40,.22),
    0 0 0 1px var(--ivory-edge),
    0 3px 0 var(--ivory-deep),
    0 3px 0 1px rgba(0,0,0,.22),
    0 6px 8px rgba(0,0,0,.28),
    0 0 0 5px rgba(80,60,30,.075);
}
.key:active, .key.down {
  transform:translateY(2px);
  box-shadow:
    inset 0 1px 0 #fff,
    inset 0 2px 4px rgba(60,45,20,.22),
    0 0 0 1px var(--ivory-edge),
    0 1px 0 var(--ivory-deep),
    0 2px 3px rgba(0,0,0,.25),
    0 0 0 5px rgba(80,60,30,.075);
}
.key.round { border-radius:50%; }
/* مفتاح اللون: مطاط مؤكسد بلون اللعبة، واحد لكل جهاز (الفعل الرئيسي) */
.key.acc {
  color:#fff; text-shadow:0 -1px 0 rgba(0,0,0,.3);
  background:
    radial-gradient(90% 70% at 35% 22%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%),
    linear-gradient(180deg, var(--acc-hi), var(--acc) 55%, var(--acc-lo));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.5),
    inset 0 -2px 3px rgba(0,0,0,.28),
    0 0 0 1px var(--acc-lo),
    0 3px 0 var(--acc-lo),
    0 3px 0 1px rgba(0,0,0,.28),
    0 6px 8px rgba(0,0,0,.32),
    0 0 0 5px rgba(80,60,30,.075);
}
.key.acc:active, .key.acc.down {
  transform:translateY(2px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 2px 5px rgba(0,0,0,.35),
    0 0 0 1px var(--acc-lo), 0 1px 0 var(--acc-lo), 0 2px 3px rgba(0,0,0,.3), 0 0 0 5px rgba(80,60,30,.075);
}
.key small { font-size:8.5px; letter-spacing:.12em; font-weight:700; opacity:.8; margin-top:2px; }
/* ---- التفاصيل المضيئة والمحفورة ---- */
.lamp {
  display:inline-block; width:9px; height:9px; border-radius:50%; flex:none;
  background:radial-gradient(circle at 38% 32%, #fff 0 12%, var(--acc-hi) 30%, var(--acc) 60%, var(--acc-lo) 100%);
  box-shadow: 0 0 7px var(--acc-glow), 0 0 0 1.5px rgba(0,0,0,.35), 0 0 0 2.5px rgba(255,255,255,.4);
}
/* مصباح RUN مطفأ: كل حالة غير اللعب تُطفئه */
body:not([data-mode="play"]) .lamp.run {
  background:radial-gradient(circle at 38% 32%, #d9d0bd 0 12%, #8f8674 45%, #5a5244 100%);
  box-shadow: 0 0 0 1.5px rgba(0,0,0,.35), 0 0 0 2.5px rgba(255,255,255,.4), inset 0 1px 2px rgba(0,0,0,.5);
}
.engr {
  color:var(--engrave); font:700 9px/1 var(--font-ui); letter-spacing:.16em; text-transform:uppercase;
  text-shadow:0 1px 0 rgba(255,255,255,.8); white-space:nowrap;
}
.engr.ar { letter-spacing:0; font-size:10px; direction:rtl; }
.name {
  color:var(--engrave); font:800 12px/1 var(--font-ui); letter-spacing:.42em; direction:ltr;
  text-shadow:0 1px 0 rgba(255,255,255,.85), 0 -1px 0 rgba(90,70,40,.25);
}
/* شبكة سمّاعة: ثقوب مثقوبة في العاج، كل ثقب بظلّ علوي وضوء سفلي */
.grille {
  background:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.65) 0 1.1px, transparent 1.6px) 0 1.2px / 6px 6px,
    radial-gradient(circle at 50% 50%, #5a5244 0 1.2px, transparent 1.7px) 0 0 / 6px 6px;
}
/* ---- اللوحة العلوية والشريط السفلي: يمتصّان الفراغ الرأسي ويختفيان حين يضيق الطول ---- */
.cap { flex:none; height:24px; display:flex; align-items:center; gap:10px; direction:ltr; padding:0 8px; }
.cap .grille { flex:1; height:10px; max-width:120px; margin-left:auto; opacity:.8; background-repeat:round; }
.foot { flex:none; height:26px; display:none; align-items:center; gap:12px; direction:ltr; padding:0 12px; }
.foot .grille { flex:1; height:12px; opacity:.85; background-repeat:round; }
@media (min-height: 760px) {
  .foot { display:flex; height:30px; }
  .cap { height:30px; }
  /* الشريط السفلي حاضر هنا بشبكته، فلا داعي لشبكة ثانية في صفّ المفتاح */
  .side .grille { display:none; }
}
/* ---- الحركة: لا رسوم متحرّكة دائمة؛ ما يتحرّك يحترم تفضيل المستخدم ---- */
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }

/* ==================== Bounce — أحمر مؤكسد ====================
   لون هذا الجهاز: أحمر كرة اللعبة. حلقة اللوحة، مصباح RUN، ومفتاح القفز
   على لوحة الأرقام هي المواضع الوحيدة التي يظهر فيها. */
:root { --acc:#d63b2f; --acc-hi:#f07a68; --acc-lo:#8d1d14; --acc-ring:rgba(214,59,47,.55); --acc-glow:rgba(214,59,47,.6); }
html, body { height:100%; }
body {
  margin:0; position:fixed; inset:0; overflow:hidden; overscroll-behavior:none; touch-action:none;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  background:var(--mat);            /* أرضية داكنة حتى قبل أن يضيف المحرّك صنف البساط */
  color:var(--ink); font-family:var(--font-ui);
}
/* ---- الهيكل: عمود يوسّط الجهاز، وفراغان بنسبة 5:3 فوقه وتحته كي يهبط
   صفّ المفاتيح حيث يستريح الإبهامان لا في منتصف الشاشة ---- */
#shell {
  height:100%; display:flex; flex-direction:column; align-items:center;
  /* الحشوة الجانبية 3 بكسل فقط: كل بكسل حول الشاشة قد يكلّف درجة تكبير كاملة */
  padding-inline:max(3px, env(safe-area-inset-left)) max(3px, env(safe-area-inset-right));
  padding-block:max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-bottom));
}
#shell::before { content:""; flex:5 1 0; min-height:0; }
#shell::after  { content:""; flex:3 1 0; min-height:0; }
/* الشاشات الطويلة تترك فائضاً كبيراً؛ نسبة 6:2 تدفع الجهاز كلّه إلى أسفل حتى
   يهبط صفّ المفاتيح إلى حيث يستريح الإبهام بدل أن يعوم في المنتصف */
@media (min-height: 760px) {
  #shell::before { flex:6 1 0; }
  #shell::after  { flex:2 1 0; }
}
/* لا تُلصق الهيكل بحافة الشاشة: 3 بكسل لازمة عند 390 وحدها كي تبقى درجة
   التكبير 8، وما دون ذلك يأخذ الجهاز هامشاً كهوامش أخوته */
@media (max-width: 380px) {
  #shell { padding-inline:max(7px, env(safe-area-inset-left)) max(7px, env(safe-area-inset-right)); }
}
.unit {
  width:100%; max-width:430px;
  display:flex; flex-direction:column; gap:8px;
  padding:8px 7px 10px; border-radius:28px;
}
/* البئر: الصورة تكبر بمضاعفات صحيحة، والحشوة 7 هي ما يطرحه المحرّك (22 = 7+7+8) */
.well {
  flex:1 1 auto; min-height:0; padding:7px; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
}
#stage { width:100%; display:flex; align-items:center; justify-content:center; }
#game { display:block; background:#000; border-radius:3px; image-rendering:pixelated; image-rendering:crisp-edges; touch-action:none; }

/* ---- المنصة: طبقتان فوق بعضهما. الطبق يأخذ عرض المنصة كاملاً كما كان قبل
   إعادة التصميم (العصا هي أداة اللعب، فلا يقتطع منها عمود جانبي)، ومفتاح
   الإيقاف يهبط إلى صفّ خاص تحته: بذلك يصل مركزه إلى ارتفاع الإبهام المستريح
   بدل أن يعلو معه. صفّ مادي فاتجاهه يسار→يمين دائماً ---- */
.deck { flex:none; width:100%; display:flex; flex-direction:column; align-items:stretch; gap:10px; padding:10px 6px; direction:ltr; }
/* صفّ المفتاح: المفتاح إلى اليسار وبجانبه نقشه المحفور، وشبكة تملأ ما تبقّى */
/* صفُّ الإيقاف صار فوق اللوحة ملاصقاً للشاشة: مستطيلٌ صغير كزرّ ‎start‎ في
   ذراع التحكّم — لا يقع تحت الإبهامين وهما على المفاتيح، فلا يُضغط خطأً،
   ولا يقضم من مساحتهما شيئاً. */
.side { flex:none; width:100%; display:flex; flex-direction:row; align-items:center;
  justify-content:center; gap:10px; padding:0; }
.side .grille { flex:1; height:12px; min-width:0; opacity:.75; background-repeat:round; }
/* مفتاح الإيقاف: 60 بكسل، رمزه ونقشه يتبدّلان مع حالة اللعبة لا مع التوقّف
   وحده: ❚❚ أثناء اللعب، ▶ في كل حالة أخرى — فلا يكون المفتاح ميّتاً أبداً */
#softR { width:78px; height:44px; border-radius:12px; font-size:20px; flex:none; }
#softR .ic.pause { font-size:22px; letter-spacing:-2px; }
#softR .ic.play { font-size:19px; padding-left:3px; }
body:not([data-mode="play"]) #softR .ic.pause, body[data-mode="play"] #softR .ic.play { display:none; }
.cap-pause, .cap-resume, .cap-start { display:none; }
body[data-mode="play"] .cap-pause,
body[data-mode="pause"] .cap-resume,
body:not([data-mode="play"]):not([data-mode="pause"]) .cap-start { display:inline; }

/* ---- الطبق: ألمنيوم مخروط بحلقات خراطة، العصا تظهر حيث يقع الإبهام،
   وعليه رموز محفورة تشرح الاتجاهات دون أن تكون أهدافاً ---- */
/* الطبق يُزاح 2 بكسل إلى الداخل عن حافة الحوض: مفتاح الإيقاف تحته يبدأ عند
   الحافة نفسها، فيبقى يسار الطبق قياساً لا شكلاً فقط (شرط ترتيب الاتجاه) */
/* منطقة التحكّم ارتفاعها واحد في النظامين، فلا يتغيّر حجم الجهاز ولا أبعاده
   حين يُبدَّل بينهما — كان الفرق ‎١١٤‎ بكسلاً فيقفز الجهاز كلّه. */
:root { --ctlh:150px; }
#stickpad { flex:none; height:var(--ctlh); margin-inline:2px; position:relative; direction:ltr; touch-action:none; }
#stickzone {
  position:absolute; inset:0; border-radius:999px; touch-action:none;
  background:
    radial-gradient(60% 120% at 50% 50%, rgba(0,0,0,.30), rgba(0,0,0,0) 72%),
    repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.05) 0 1px, rgba(0,0,0,0) 1px 4px),
    linear-gradient(180deg, var(--alu-lo), var(--alu) 60%, var(--alu-hi));
  box-shadow:
    inset 0 4px 9px rgba(0,0,0,.85), inset 0 -1px 0 rgba(255,255,255,.14),
    0 1px 0 rgba(255,255,255,.7), 0 0 0 1px rgba(0,0,0,.45);
}
/* النقوش على الطبق تُقرأ كنقش على ألمنيوم: حبرها فاتح بما يكفي ليُقرأ كدليل
   مفاتيح من مسافة الذراع، والظلّ الداكن تحتها يبقيها غائرة لا مطبوعة */
.etch {
  position:absolute; pointer-events:none; font:700 10px/1 var(--font-ui);
  color:rgba(255,255,255,.42); letter-spacing:.1em; white-space:nowrap;
  text-shadow:0 -1px 0 rgba(0,0,0,.7);
}
.etch.l { left:14px; top:50%; transform:translateY(-50%); }
.etch.r { right:14px; top:50%; transform:translateY(-50%); }
/* نقش القفز أعلى الطبق هو الأهم، فيكبر بكسلاً واحداً عن نقشي الجهتين */
.etch.t { top:8px; left:50%; transform:translateX(-50%); font-size:11px; }
#stickbase {
  position:absolute; width:112px; height:112px; border-radius:50%;
  border:2px solid rgba(255,255,255,.12); background:rgba(255,255,255,.03);
  pointer-events:none; opacity:.75;
}
#stickbase.active { opacity:1; border-color:var(--acc-ring); }
/* المقبض: زرّ راديو أسود بخطّ دليل أبيض؛ 52 بكسل في كل مقاس، فراحة العصا لا تتغيّر */
#stickknob {
  position:absolute; left:30px; top:30px; width:52px; height:52px; border-radius:50%;
  background:
    linear-gradient(180deg, rgba(255,255,255,.85) 0 2px, transparent 2px) 50% 6px / 2px 12px no-repeat,
    radial-gradient(circle at 38% 30%, #5f6672, #2a2e35 70%);
  border:1px solid #4a5059;
  box-shadow: 0 4px 7px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.25), inset 0 -3px 4px rgba(0,0,0,.4);
}
#stickbase.active #stickknob { box-shadow: 0 4px 7px rgba(0,0,0,.65), inset 0 0 0 2px var(--acc-ring), inset 0 -3px 4px rgba(0,0,0,.4); }

/* ---- لوحة الأسهم البديلة (من القائمة): ثلاثة مفاتيح فقط — يسار، قفز، يمين.
   القفز هو المفتاح الملوّن الوحيد في هذا النظام ---- */
#keypad {
  display:none; margin-inline:2px;
  grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; direction:ltr;
}
/* اليسار واليمين يملآن ارتفاع المنطقة كلّه بعدما صعد مفتاح الإيقاف من تحتهما،
   والقفز قرصٌ أكبر يتوسّطها رأسياً لا يلتصق بالشاشة. */
.num { width:100%; height:var(--ctlh); font-size:22px; }
.num.round { width:min(var(--ctlh), 116px); height:min(var(--ctlh), 116px);
  justify-self:center; align-self:center; font-size:26px; }
body.joystick #keypad { display:none; } body.joystick #stickpad { display:block; }
body:not(.joystick) #stickpad { display:none; } body:not(.joystick) #keypad { display:grid; }

/* ---- الطبقات حسب الطول: كل ما يصغر هو الطبق ومفتاح الإيقاف، الشاشة لا تصغر أبداً ---- */
@media (max-height: 700px) {
  :root { --ctlh:126px; }
  .unit { gap:8px; padding:8px 7px 10px; }
  .deck { gap:8px; padding:8px 6px 9px; }
  #softR { width:72px; height:44px; }
}
/* عتبة واحدة متّفق عليها للأجهزة الثلاثة: اللوحة المكتوب عليها الاسم تختفي
   عند الطول نفسه في الثلاثة، فتظل الأجهزة تبدو إخوة عند 375 و320 */
@media (max-height: 620px) and (orientation: portrait) { .cap { display:none; } }
@media (max-height: 560px) and (orientation: portrait) {
  :root { --ctlh:100px; }
  #softR { width:66px; height:44px; }
}
/* نافذة عريضة قصيرة على الحاسوب (مثل 900×650): صفّ المفتاح تحت الطبق يكلّف
   من الطول أكثر مما تبقّى، وإنزال درجة التكبير ممنوع — فيعود المفتاح هنا
   وحده إلى جانب الطبق كما كان */
@media (orientation: landscape) and (min-height: 561px) and (max-height: 660px) {
  .deck { flex-direction:row; align-items:center; gap:10px; padding:8px 6px 9px; }
  .side { order:-1; width:56px; flex:none; flex-direction:column; gap:6px; padding:0; }
  .side .grille { display:none; }
  #stickpad, #keypad { flex:1 1 auto; width:auto; min-width:0; }
}
/* ---- إطار عريض قصير: شبكة ثلاثة أعمدة (كل خلية مثبّتة في الصفّ الأول كي لا يزحف
   التوزيع التلقائي بالجناح إلى صفّ ثانٍ) — جناح الإيقاف يساراً (الإبهام الأيسر)،
   الشاشة وسطاً بكامل الطول، وطبق طويل يميناً (الإبهام الأيمن) بمدى 44 بكسل
   كاملاً من أي نقطة هبوط ---- */
@media (orientation: landscape) and (max-height: 560px) {
  #shell { padding-block:max(4px, env(safe-area-inset-top)) max(4px, env(safe-area-inset-bottom)); }
  .unit { display:grid; grid-template-columns:96px minmax(0,1fr) 200px; grid-template-rows:1fr; align-items:stretch;
          max-width:none; width:auto; gap:12px; padding:6px 10px; direction:ltr; }
  .cap, .foot { display:none; }
  .well { grid-column:2; grid-row:1; align-self:stretch; min-width:0; }
  .deck { display:contents; }
  .side { grid-column:1; grid-row:1; width:auto; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; padding:6px 0; gap:6px; }
  /* الجناح ضيّق ورأسي: لا شبكة فيه، وإلا مطّت نفسها ورفعت المفتاح عن أسفله */
  .side .grille { display:none; }
  /* الاسم محفوراً رأسياً في الجناح، مكان اللوحة العلوية المخفية */
  .side::before {
    content:"BOUNCE"; writing-mode:vertical-rl; transform:rotate(180deg); margin-bottom:auto;
    color:var(--engrave); font:800 12px/1 var(--font-ui); letter-spacing:.42em;
    text-shadow:-1px 0 0 rgba(255,255,255,.85), 1px 0 0 rgba(90,70,40,.25);
  }
  #softR { width:60px; height:60px; }
  #stickpad { grid-column:3; grid-row:1; width:180px; height:auto; align-self:stretch; justify-self:center; }
  #stickzone { border-radius:90px; }
  /* الأسهم في الوضع العريض: عمودان لا عمود واحد — القفز المستدير يعلو الصفّ
     كلّه، ويسار ويمين تحته كلٌّ في جهته، فلا يصير «اليسار» هو المفتاح الأعلى */
  #keypad { grid-column:3; grid-row:1; grid-template-columns:1fr 1fr; align-content:center; }
  .num { width:100%; height:72px; }
  .num[data-k="5"] { grid-column:1 / -1; grid-row:1; width:72px; height:72px; justify-self:center; }
  .num[data-k="4"] { grid-column:1; grid-row:2; }
  .num[data-k="6"] { grid-column:2; grid-row:2; }
}
</style>

<div id="shell">
  <div class="unit">
    <div class="cap"><span class="lamp run" aria-hidden="true"></span><span class="name">BOUNCE</span><span class="grille" aria-hidden="true"></span></div>
    <div class="well plate"><div id="stage"><canvas id="game" width="384" height="384"></canvas></div></div>
    <div class="deck">
      <div class="side">
        <span class="grille" aria-hidden="true"></span>
        <button class="key" id="softR" type="button" aria-label="إيقاف / متابعة / ابدأ"><span class="ic pause">&#x2016;</span><span class="ic play">&#x25B6;&#xFE0E;</span></button>
        <span class="engr ar cap-pause">إيقاف</span><span class="engr ar cap-resume">متابعة</span><span class="engr ar cap-start">ابدأ</span>
        <span class="grille" aria-hidden="true"></span>
      </div>
      <div id="stickpad"><div id="stickzone"><span class="etch l">&#x25C0;&#xFE0E;</span><span class="etch r">&#x25B6;&#xFE0E;</span><span class="etch t">&#x25B2;&#xFE0E; قفز</span><div id="stickbase"><div id="stickknob"></div></div></div></div>
      <div id="keypad">
        <button class="key num" data-k="4" type="button" aria-label="يسار">&#x25C0;&#xFE0E;</button>
        <button class="key num round acc" data-k="5" type="button" aria-label="قفز">&#x25B2;&#xFE0E;</button>
        <button class="key num" data-k="6" type="button" aria-label="يمين">&#x25B6;&#xFE0E;</button>
      </div>
    </div>
    <div class="foot"><span class="engr">Model B·128</span><span class="grille" aria-hidden="true"></span><span class="engr">1 Player</span></div>
  </div>
</div>
