<title>Bounce</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --ground: #14161c;
    --key: #2b3040;
    --key-down: #3d4460;
    --key-ink: #dfe6f5;
    --amber: #e59a4d;
    --muted: #8a93a8;
    --border: #3a4152;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    position: fixed;
    inset: 0;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    background: var(--ground);
    color: var(--key-ink);
    font-family: Tahoma, "Segoe UI", -apple-system, Arial, sans-serif;
  }
  #shell {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding-inline: 10px;
    padding-block: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-bottom));
  }
  #top {
    display: flex;
    align-items: baseline;
    gap: 12px;
    width: 100%;
    max-width: 720px;
    justify-content: space-between;
    flex: 0 0 auto;
  }
  #brand { font-family: "Courier New", monospace; font-weight: 700; font-size: 16px; letter-spacing: 3px; color: var(--amber); margin: 0; }
  #sub { font-size: 12px; color: var(--muted); direction: rtl; }
  /* ---------- هيكل الجوال ---------- */
  #phone {
    position: relative;
    flex: 0 1 auto;
    max-height: 100%;
    min-height: 0;
    width: 100%;
    max-width: 410px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 10px 10px 14px;
    border-radius: 34px / 40px;      /* الاستدارة البيضوية المميّزة للهيكل */
    background: linear-gradient(175deg, #4a4740 0%, #34322c 42%, #2a2823 100%);
    border: 1px solid #55514a;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.14),
      inset 0 -2px 6px rgba(0,0,0,.45),
      0 10px 26px rgba(0,0,0,.5);
  }
  #grille {
    flex: 0 0 auto;
    width: 62px; height: 7px;
    border-radius: 4px;
    background: #16150f;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.08);
  }
  #nokia {
    flex: 0 0 auto;
    font-family: var(--font-pixel, monospace);
    font-size: 13px;
    letter-spacing: 4px;
    color: #cfc8b6;
    opacity: .75;
    direction: ltr;
  }
  #stage {
    flex: 0 1 auto;
    width: 100%;
    aspect-ratio: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* الشاشة غائرة في الهيكل لا ملصقة عليه، والبئر بمقاس الصورة تماماً */
  #screen {
    padding: 9px;
    border-radius: 10px;
    background: #14130f;
    box-shadow: inset 0 3px 8px rgba(0,0,0,.75), 0 1px 0 rgba(255,255,255,.07);
    line-height: 0;
  }
  #game {
    display: block;
    background: #000;
    border: 3px solid var(--border);
    border-radius: 4px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
  }
  /* ---------- الأزرار ---------- */
  #keys {
    flex: 0 0 auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  #softrow {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px;
  }
  .soft {
    height: 30px;
    border: 1px solid #5d584f;
    border-radius: 8px 8px 16px 16px;
    background: linear-gradient(180deg, #565147, #3d3931);
    color: #efe9dc;
    font-family: inherit;
    font-size: 12.5px;
    padding: 0 6px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 2px 0 #1e1b16;
    touch-action: none;
  }
  #softL { border-radius: 8px 16px 16px 8px; }
  #softR { border-radius: 16px 8px 8px 16px; }
  .soft:active, .soft.down { transform: translateY(2px); box-shadow: inset 0 1px 3px rgba(0,0,0,.5); }

  /* مفتاح التنقّل: قرص واحد بأربعة اتجاهات ومركز */
  #nav {
    position: relative;
    width: 96px; height: 62px;
    border-radius: 50%;
    background: linear-gradient(180deg, #575248, #3b372f);
    border: 1px solid #5d584f;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 2px 0 #1e1b16;
  }
  .nv {
    position: absolute;
    border: 0;
    background: transparent;
    color: #e8e2d4;
    font-size: 11px;
    padding: 0;
    touch-action: none;
    line-height: 1;
  }
  #navU { top: 1px; left: 50%; transform: translateX(-50%); width: 38px; height: 20px; }
  #navD { bottom: 1px; left: 50%; transform: translateX(-50%); width: 38px; height: 20px; }
  #navL { left: 2px; top: 50%; transform: translateY(-50%); width: 24px; height: 34px; }
  #navR { right: 2px; top: 50%; transform: translateY(-50%); width: 24px; height: 34px; }
  #navC {
    left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 30px; height: 24px; border-radius: 12px;
    background: #2f2c26;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.6);
  }
  .nv:active, .nv.down { color: var(--accent, #9fd07a); filter: brightness(1.5); }

  /* لوحة الأرقام: أربعة صفوف، والحروف تحت الرقم كما في الأصل */
  #keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .num {
    height: 38px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    border: 1px solid #5d584f;
    border-radius: 9px;
    background: linear-gradient(180deg, #565147, #3d3931);
    color: #f1ece0;
    font-family: inherit;
    padding: 0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 2px 0 #1e1b16;
    touch-action: none;
  }
  .num b { font-size: 15px; font-weight: 700; line-height: 1; direction: ltr; }
  .num i { font-size: 8px; font-style: normal; letter-spacing: .6px; color: #a79f8d; direction: ltr; }
  .num:active, .num.down { transform: translateY(2px); box-shadow: inset 0 1px 3px rgba(0,0,0,.5); background: #6b6558; }
  /* المفاتيح التي تحرّك الكرة تُميَّز بلمسة لون، فيعرفها اللاعب دون شرح */
  .num.live b { color: var(--accent, #9fd07a); }

  body.joystick #keys { display: none; }
  body:not(.joystick) #stickpad { display: none; }

  #pad {
    flex: 0 0 auto;
    width: 100%;
    max-width: 720px;
    display: none;
    grid-template-columns: 0.55fr 1fr 1fr 1.4fr;
    gap: 10px;
    direction: ltr;
  }
  #pad button {
    height: 72px;
    font-size: 26px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--key);
    color: var(--key-ink);
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.35);
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    padding: 0;
  }
  #pad button.down, #pad button:active {
    background: var(--key-down);
    box-shadow: inset 0 3px 0 rgba(0,0,0,.35);
    transform: translateY(2px);
  }
  #pad button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  /* joystick scheme */
  #stickpad {
    flex: 0 0 auto;
    width: 100%;
    max-width: 720px;
    height: 132px;
    display: none;
    position: relative;
    direction: ltr;
    touch-action: none;
  }
  #stickzone {
    position: absolute;
    inset: 0;
    touch-action: none;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: rgba(43, 48, 64, 0.35);
  }
  #stickbase {
    position: absolute;
    width: 104px; height: 104px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: rgba(43, 48, 64, 0.5);
    left: 14px; top: 14px;
    pointer-events: none;
    opacity: .6;
  }
  #stickbase.active { opacity: 1; }
  #stickknob {
    position: absolute;
    left: 28px; top: 28px;
    width: 48px; height: 48px;
    border-radius: 50%;
    background: var(--key);
    border: 1px solid var(--border);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.35);
  }
  #stickbase.active #stickknob { background: var(--key-down); }
  #btnM2 {
    position: absolute;
    right: 10px; top: 10px;
    width: 44px; height: 44px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--key);
    color: var(--key-ink);
    font-size: 20px;
    padding: 0;
    touch-action: none;
  }
  #btnM2:active { background: var(--key-down); }
  body.touch.joystick #pad { display: none; }
  body.touch.joystick #stickpad { display: block; }
  /* landscape: float the stick in the left margin so the game keeps the
     whole height */
  /* شاشة قصيرة: المفاتيح تتنازل عن ارتفاعها للشاشة، لا العكس.
     الشاشة تقيس بمضاعفات صحيحة، فكل بضعة بكسلات قد تعني درجة كاملة. */
  @media (max-height: 740px) and (orientation: portrait) {
    #phone { gap: 6px; padding-top: 8px; }
    #grille { height: 5px; }
    #nokia { font-size: 11px; }
    #keys { gap: 5px; }
    #keypad { gap: 4px; }
    .num { height: 30px; }
    .num b { font-size: 13px; }
    .num i { display: none; }
    #nav { width: 84px; height: 52px; }
    .soft { height: 26px; }
  }
  @media (max-height: 620px) and (orientation: portrait) {
    .num { height: 25px; }
    #nav { width: 76px; height: 44px; }
    #nokia, #grille { display: none; }
  }

  /* الوضع الأفقي: الجهاز العامودي لا يُقلب، فيتحوّل إلى هيئة عرضية —
     الشاشة بكامل الارتفاع ومفتاح التنقّل والزرّان بجانبها. لوحة الأرقام
     تحتاج ارتفاعاً لا يوجد هنا، فتُخفى بدل أن تسحق الشاشة إلى لا شيء. */
  @media (orientation: landscape) and (max-height: 560px) {
    #phone {
      flex-direction: row;
      align-items: center;
      justify-content: center;
      max-width: none;
      gap: 14px;
      padding: 10px 14px;
    }
    #grille, #nokia, #keypad { display: none; }
    #stage { height: 100%; width: auto; aspect-ratio: 1; flex: 0 1 auto; }
    #keys { width: auto; flex: 0 0 auto; }
    #softrow { grid-template-columns: 1fr; justify-items: center; gap: 10px; }
    .soft { width: 100%; }

    body.touch.joystick #shell { position: relative; }
    body.touch.joystick #stickpad {
      position: absolute;
      inset: 0;
      height: auto;
      max-width: none;
      pointer-events: none;
    }
    body.touch.joystick #stickzone {
      pointer-events: auto;
      inset: auto auto max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      width: min(190px, 30vw);
      height: min(190px, 52vh);
    }
    body.touch.joystick #btnM2 {
      pointer-events: auto;
      left: auto; top: max(8px, env(safe-area-inset-top));
      right: max(10px, env(safe-area-inset-right));
      transform: none;
    }
  }
  #hint { font-size: 12px; color: var(--muted); direction: rtl; text-align: center; flex: 0 0 auto; }
  body.touch:not(.joystick) #pad { display: grid; }
  body.touch #hint-keys { display: none; }
  body:not(.touch) #hint-touch { display: none; }
  @media (max-height: 460px) {
    #shell { gap: 6px; }
    #top, #hint { display: none; }
    #pad button { height: 56px; font-size: 22px; }
    #stickpad { height: 104px; }
    #stickbase { width: 88px; height: 88px; }
    #stickknob { left: 22px; top: 22px; width: 42px; height: 42px; }
  }
  @media (max-width: 400px) { #sub { display: none; } }
  /* installed as an app: give the whole screen to the game */
  @media (display-mode: standalone), (display-mode: fullscreen) {
    #top, #hint { display: none; }
    #shell { gap: 8px; }
  }
  body.standalone #top, body.standalone #hint { display: none; }
</style>

<div id="shell">
  <!-- هيكل الجوال العامودي الكلاسيكي: سمّاعة، فوقها الاسم، ثم شاشة غائرة،
       ثم زرّان جانبيان ومفتاح تنقّل رباعي، ثم لوحة الأرقام بحروفها.
       الأرقام تعمل كما في نوكيا الأصلية لا كزينة. -->
  <div id="phone">
    <div id="grille" aria-hidden="true"></div>
    <div id="nokia">NOKIA</div>
    <div id="stage"><div id="screen"><canvas id="game" width="384" height="384"></canvas></div></div>

    <div id="keys">
      <div id="softrow">
        <button class="soft" id="softL">القائمة</button>
        <div id="nav">
          <button class="nv" id="navU" aria-label="قفز">▲</button>
          <button class="nv" id="navL" aria-label="يسار">◀</button>
          <button class="nv" id="navC" aria-label="اختيار"></button>
          <button class="nv" id="navR" aria-label="يمين">▶</button>
          <button class="nv" id="navD" aria-label="أسفل">▼</button>
        </div>
        <button class="soft" id="softR">إيقاف</button>
      </div>

      <div id="keypad">
        <button class="num" data-k="1"><b>1</b><i>∞</i></button>
        <button class="num" data-k="2"><b>2</b><i>abc</i></button>
        <button class="num" data-k="3"><b>3</b><i>def</i></button>
        <button class="num" data-k="4"><b>4</b><i>ghi</i></button>
        <button class="num" data-k="5"><b>5</b><i>jkl</i></button>
        <button class="num" data-k="6"><b>6</b><i>mno</i></button>
        <button class="num" data-k="7"><b>7</b><i>pqrs</i></button>
        <button class="num" data-k="8"><b>8</b><i>tuv</i></button>
        <button class="num" data-k="9"><b>9</b><i>wxyz</i></button>
        <button class="num" data-k="*"><b>*</b><i>+</i></button>
        <button class="num" data-k="0"><b>0</b><i>␣</i></button>
        <button class="num" data-k="#"><b>#</b><i>↵</i></button>
      </div>
    </div>

    <div id="stickpad">
      <div id="stickzone"><div id="stickbase"><div id="stickknob"></div></div></div>
      <button id="btnM2" aria-label="القائمة">☰</button>
    </div>
  </div>

  <div id="hint">
    <span id="hint-keys">← → أو 4 / 6 للحركة، ↑ أو 2 أو المسافة للقفز، Esc للإيقاف المؤقت. التقدم يُحفظ تلقائياً.</span>
    <span id="hint-touch">لوحة المفاتيح تعمل كما في نوكيا: 4 و6 للحركة، و2 أو 5 للقفز. بدّلها بعصا من القائمة.</span>
  </div>
</div>
