<style>
/* ==========================================================================
   بينبول الفضاء — استثناء مقصود من عقد المظهر في README.
   الألعاب الثلاث الأخرى أجهزة نوكيا لها هيكل يحيط بشاشة صغيرة. طاولة البينبول
   عكس ذلك: نسبتها تحتاج كل بكسل رأسي، ومضرباها يُلعبان بنصفَي الشاشة لا
   بأزرار. فالطاولة هي الجهاز. وما يبقى من العقد كما هو: بلا إنترنت، ولا هدف
   لمس تحت ٤٤ بكسلاً، وخلفية ليست لوناً مسطّحاً، وحركة تحترم تفضيل النظام،
   وحفظ عند مغادرة الصفحة لا عند ضغط زرّ.
   ========================================================================== */
:root { --ink:#f4ecff; --neon:#c46bff; --neon-2:#5de1ff; --amber:#ffc24d;
  --font-ui:"Helvetica Neue", Helvetica, Arial, Tahoma, "Segoe UI", sans-serif; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; }
body {
  font-family:var(--font-ui); color:var(--ink);
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  touch-action:none; overscroll-behavior:none; -webkit-text-size-adjust:100%;
  background:
    radial-gradient(120% 80% at 18% 4%, rgba(150,80,220,.26), rgba(150,80,220,0) 55%),
    radial-gradient(90% 70% at 88% 24%, rgba(60,170,230,.14), rgba(60,170,230,0) 60%),
    radial-gradient(140% 100% at 50% 108%, #23103f 0%, #140a26 42%, #080413 100%);
}
#table { position:fixed; inset:0; width:100%; height:100%; display:block; z-index:1; }

/* شريط الأزرار: عمود صغير أعلى اليسار، خارج مسار الإبهامين ومسار الكرة.
   الزرّ ٤٤×٤٤ رقعة لمس شفافة والشكل المرسوم ٣٠ عبر ::before، و::after يوسّع
   الرقعة نحو حافة الشاشة لا نحو الزرّ المجاور. */
#rail { position:fixed; z-index:6; direction:ltr; display:flex; flex-direction:column; gap:2px;
  top:calc(env(safe-area-inset-top, 0px) + 2px); left:calc(env(safe-area-inset-left, 0px) + 2px); }
#rail button { position:relative; width:44px; height:44px; flex:none; padding:0; border:0;
  background:transparent; color:var(--ink); display:flex; align-items:center; justify-content:center;
  font:600 13px/1 var(--font-ui); cursor:pointer; }
#rail button::before { content:""; position:absolute; top:7px; left:7px; width:30px; height:30px;
  border-radius:50%; z-index:-1;
  background:radial-gradient(70% 70% at 32% 26%, rgba(255,255,255,.22), rgba(255,255,255,0) 60%),
             linear-gradient(165deg, rgba(90,50,140,.9), rgba(24,12,46,.92));
  box-shadow:inset 0 0 0 1px rgba(196,107,255,.45), 0 2px 6px rgba(0,0,0,.55); }
#rail button::after { content:""; position:absolute; top:0; bottom:0; left:-6px; right:-2px; }
#rail button .g { position:relative; z-index:1; font-size:15px; line-height:1; }
#rail button.off .g { opacity:.42; }
#rail button:disabled { opacity:.35; pointer-events:none; }

.sheet { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:13px; text-align:center;
  padding:calc(env(safe-area-inset-top, 0px) + 18px) 20px calc(env(safe-area-inset-bottom, 0px) + 18px);
  background:radial-gradient(90% 60% at 50% 22%, rgba(196,107,255,.22), rgba(196,107,255,0) 62%),
             linear-gradient(180deg, rgba(6,3,14,.90), rgba(6,3,14,.965));
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
.sheet[hidden] { display:none; }
.logo { font:800 clamp(26px, 8vw, 46px)/1.05 var(--font-ui); letter-spacing:.5px;
  background:linear-gradient(180deg, #fff 0%, var(--neon) 58%, #6a2ea8 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:0 0 22px rgba(196,107,255,.35); }
.sub { font:600 13px/1.7 var(--font-ui); color:#b9a6d8; max-width:30ch; }
.big { font:800 clamp(22px,7vw,34px)/1.2 var(--font-ui); color:var(--amber); }
.rank { font:700 14px/1.5 var(--font-ui); color:var(--neon-2); }
.go { appearance:none; -webkit-appearance:none; min-width:168px; min-height:48px; padding:0 22px;
  border-radius:26px; border:1.5px solid rgba(196,107,255,.6); cursor:pointer;
  background:linear-gradient(180deg, rgba(150,80,220,.5), rgba(60,24,110,.6));
  color:var(--ink); font:800 16px/1 var(--font-ui);
  box-shadow:0 0 18px rgba(196,107,255,.22), inset 0 1px 0 rgba(255,255,255,.22); }
.hint { font:600 12px/1.8 var(--font-ui); color:#9d8cbb; max-width:34ch;
  border-top:1px solid rgba(196,107,255,.2); padding-top:12px; }
.hint b { color:var(--neon-2); font-weight:800; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>

<script>
"use strict";
/* ==========================================================================
   ١ — الطاولة: هندسة محسوبة لا مقدَّرة
   --------------------------------------------------------------------------
   الدرس الذي دفعتُ ثمنه: ممرّ رُسم بالعين ضاق إلى أقلّ من قطر الكرة فانحشرت
   فيه ووقفت اللعبة. فكل ممرّ هنا يُشتقّ من قضيب واحد بإزاحة ثابتة، لا يُرسم
   نقطةً نقطة: ممر الخروج ٤٦ وممر العودة ٥٠، وقطر الكرة ٢٨ — فلا موضع في
   الطاولة أضيق من الكرة، ولا يمكن أن يصير كذلك بتعديل لاحق.

   والبنية بنية Space Cadet نفسها ومسار كرتها: ممر القاذف على اليمين يصعد،
   يتحوّل بلا فاصل إلى مِزلق يطوف سقف الطاولة (deployment chute)، ويُسقط
   الكرة أعلى اليسار في ممرّات الإطلاق الثلاثة فوق المنافخ. القضبان السفلية
   متماثلة تماماً حول المحور ٢٩٤: ‏٢٩٤−٧٨ = ٥١٠−٢٩٤ = ٢١٦.
   ========================================================================== */
var TW = 600, TH = 1160;
var BR = 14;                       // نصف قطر الكرة (القطر ٢٨)
var BHALF = BR * 0.5;              // خطوة التقسيم الفرعي (pb::BallHalfRadius)
var BMAX = BR * 200;               // السقف الأصلي للسرعة (pb::BallMaxSpeed)
var GRAV = 1020;
var EL = 0.62, SM = 0.96;          // الافتراضيان في loader.cpp
var ARCW = { e: 0.9, s: 0.985 };   // قطع الأقواس: مرونة أعلى، وإلا بدّدت ملامساتها المتكرّرة طاقة المدار

var CX = 294, CY = 300, R_OUT = 272, R_IN = 216;   // ‏٢٧٢−٢١٦ = ٥٦ عرض المِزلق
var LANE_IN = 510, LANE_OUT = 566;                 // ممر القاذف ٥٦
var W_OUT = 46, W_IN = 50;                         // ممرّا الخروج والعودة
var EDGE_L = 78, EDGE_R = LANE_IN;                 // حافّتا الملعب أسفل الطاولة
var DIV_L = EDGE_L + W_OUT, DIV_R = EDGE_R - W_OUT;            // ‏١٢٤ و٤٦٤
var SB_L = DIV_L + W_IN, SB_R = DIV_R - W_IN;                  // ظهرا المصدّين ‏١٧٤ و٤١٤
var PIV_L = 190, PIV_R = 398, PIV_Y = 1010;
/* طول المضرب ليس ذوقاً: الفجوة بين طرفَي المضربين تُنقَص منها نصف قطر كلٍّ
   منهما، فالممرّ الفعلي إلى المصرف = الفجوة − ٢×FLIP_R. بطول ٩٦ كان ٢٣.٨
   وقطر الكرة ٢٨، فكانت تنحشر بين الطرفين ولا تنزل أبداً. بطول ٨٦ يصير ٤١،
   أي نحو مرّة ونصف قطر الكرة — وهي نسبة الطاولات الحقيقية. */
var FLIP_LEN = 86, FLIP_R = 9;
var REST_A = 0.5236, UP_A = -0.5585;               // ‏٣٠ درجة سكوناً، ‏‎-٣٢ رفعاً
var FLIP_W = 14.5;                                 // سرعة زاوية (راديان/ث)
var PLUNGE_REST = 1080, LANE_FLOOR = 1122;

var D2R = Math.PI / 180;
function pol(a, r, cx, cy) { return [(cx === undefined ? CX : cx) + r * Math.cos(a * D2R), (cy === undefined ? CY : cy) + r * Math.sin(a * D2R)]; }
function arc(cx, cy, r, a0, a1, step) {
  var pts = [], n = Math.max(2, Math.ceil(Math.abs(a1 - a0) / (step || 6))), i;
  for (i = 0; i <= n; i++) pts.push(pol(a0 + (a1 - a0) * i / n, r, cx, cy));
  return pts;
}
function mir(pts) { var o = [], i; for (i = 0; i < pts.length; i++) o.push([2 * CX - pts[i][0], pts[i][1]]); return o; }

var WALLS = [];
function wall(pts, o) {
  o = o || {};
  for (var i = 0; i < pts.length - 1; i++)
    WALLS.push({ a: pts[i], b: pts[i + 1], e: o.e === undefined ? EL : o.e,
                 s: o.s === undefined ? SM : o.s, k: o.k || 'w', r: o.r || 0 });
}

/* ---- المِزلق العلوي: قوسان متراكزان، والداخلي ينتهي عند ‎(510,300)‎ بالضبط
   فيصير امتداداً لجدار ممر القاذف بلا فاصل ولا فتحة ولا حافّة يستقرّ عليها
   شيء. الكرة المقذوفة تُحمل داخله حول السقف وتخرج أعلى اليسار. ---- */
wall(arc(CX, CY, R_OUT, 180, 360), ARCW);
wall(arc(CX, CY, R_IN, 185, 360), ARCW);
wall([[LANE_IN, CY], [LANE_IN, LANE_FLOOR]]);       // جدار الممر الداخلي = حافّة الملعب اليمنى
wall([[LANE_OUT, CY], [LANE_OUT, LANE_FLOOR]]);
wall([[LANE_IN, LANE_FLOOR], [LANE_OUT, LANE_FLOOR]]);

// ---- الحافّة اليسرى: من القبّة نزولاً، ثم تضيق إلى محور التماثل ----
wall([[2 * CX - LANE_OUT, CY], [22, 680], [EDGE_L, 780], [EDGE_L, PIV_Y], [110, 1070], [136, TH]]);
wall([[EDGE_R, PIV_Y], [478, 1070], [452, TH]]);

// ---- القضبان السفلية: ممر خروج ثم فاصل ثم ممر عودة ثم ظهر المصدّ ----
var DIVIDER_L = [[DIV_L, 760], [DIV_L, 940], [PIV_L, PIV_Y]];
wall(DIVIDER_L); wall(mir(DIVIDER_L));

/* ---- المصدّان: الوجه المائل يركل، والضلعان الآخران جدار. ---- */
var SLING_L = { a: [SB_L, 838], b: [246, 912], back: [[SB_L, 838], [SB_L, 948], [246, 912]] };
var SLING_R = { a: [SB_R, 838], b: [2 * CX - 246, 912], back: mir(SLING_L.back) };
var SLINGS = [{ a: SLING_L.a, b: SLING_L.b, lit: 0 }, { a: SLING_R.a, b: SLING_R.b, lit: 0 }];
wall(SLING_L.back, { k: 'sl' }); wall(SLING_R.back, { k: 'sl' });

// ---- ممرّات الإطلاق الثلاثة تحت مخرج المِزلق ----
wall([[100, 320], [100, 396]]); wall([[166, 320], [166, 396]]);
// ---- موجّهات ممرّات العودة أعلى الطاولة ----
wall([[262, 100], [262, 180]]); wall([[326, 100], [326, 180]]);

/* ---- الأعمدة المطّاطية: تكسر انزلاق الكرة على الجدار وترميها داخل الملعب ---- */
var POSTS = [
  { x: DIV_L, y: 754, r: 9 }, { x: DIV_R, y: 754, r: 9 },
  { x: SB_L, y: 834, r: 9 }, { x: SB_R, y: 834, r: 9 },
  { x: 206, y: 300, r: 9 }, { x: 382, y: 300, r: 9 },
  { x: 100, y: 396, r: 8 }, { x: 166, y: 396, r: 8 }
];

// ---- المنافخ: أربعة هجوم في القلب، وثلاثة إطلاق تحت ممرّات الإطلاق ----
var BUMPERS = [
  { x: 294, y: 206, r: 27, g: 0, i: 0 }, { x: 232, y: 258, r: 27, g: 0, i: 1 },
  { x: 356, y: 258, r: 27, g: 0, i: 2 }, { x: 294, y: 310, r: 27, g: 0, i: 3 },
  { x: 170, y: 470, r: 25, g: 1, i: 0 }, { x: 234, y: 444, r: 25, g: 1, i: 1 },
  { x: 234, y: 500, r: 25, g: 1, i: 2 }
];

/* ---- الأهداف: ساقطة (drop) تختفي حين تُصاب وترجع مع بنكها، ونقطية (spot)
   حسّاس لا يختفي. ---- */
var TARGETS = [];
function bank(kind, group, list, ang, label) {
  for (var i = 0; i < list.length; i++)
    TARGETS.push({ k: kind, g: group, i: i, x: list[i][0], y: list[i][1], a: ang,
                   down: false, flash: 0, hw: kind === 'drop' ? 20 : 12, lab: label });
}
bank('drop', 'mult',  [[436, 204], [436, 244], [436, 284]], 90, '2X');
bank('drop', 'boost', [[152, 204], [152, 244], [152, 284]], 90, 'BOOST');
bank('drop', 'medal', [[206, 560], [250, 560], [294, 560]], 0, 'MEDAL');
bank('spot', 'mission', [[150, 660], [294, 648], [438, 660]], 0, 'MISSION');
bank('spot', 'fuel',    [[170, 790], [294, 798], [418, 790]], 0, 'FUEL');
bank('spot', 'hazL',    [[110, 722], [160, 722], [210, 722]], 0, 'HAZARD');
bank('spot', 'hazR',    [[378, 722], [428, 722], [478, 722]], 0, 'HAZARD');
bank('spot', 'wdest',   [[368, 470]], 0, 'WARP');

// ---- المجسّات ----
var ROLLS = [];
function roll(g, i, x, y, r) { ROLLS.push({ g: g, i: i, x: x, y: y, r: r || 22, on: false, t: 0 }); }
for (var _i = 0; _i < 6; _i++) { var _p = pol(200 + _i * 28, 244); roll('orbit', _i, _p[0], _p[1], 24); }
roll('reentry', 0, 232, 128); roll('reentry', 1, 294, 110); roll('reentry', 2, 356, 128);
roll('launch', 0, 60, 376);   roll('launch', 1, 133, 376);  roll('launch', 2, 206, 376);
roll('outL', 0, EDGE_L + W_OUT / 2, 890); roll('outR', 0, EDGE_R - W_OUT / 2, 890);
roll('inL', 0, DIV_L + W_IN / 2, 890);    roll('inR', 0, DIV_R - W_IN / 2, 890);
roll('bonus', 0, DIV_L + W_IN / 2, 806);
roll('warp', 0, 294, 880, 26);                       // قلب الشعار في وسط الطاولة

/* ---- الثقوب والمنحدرات: تبتلع الكرة ثم تقذفها. ما له path تُرى الكرة
   تسير عليه (منحدر سلكي)، وما لا path له تختفي فيه (ثقب). ---- */
var HOLES = [
  { id: 'hyper', x: 430, y: 380, r: 24, wait: 1.1, out: [294, 470], dir: [0, 1], spd: 560, lab: 'HYPERSPACE' },
  { id: 'worm0', x: 64, y: 486, r: 22, wait: 1.3, out: [368, 470], dir: [0.15, 1], spd: 430, c: '#ffd34d' },
  { id: 'worm1', x: 64, y: 566, r: 22, wait: 1.3, out: [368, 470], dir: [0, 1], spd: 430, c: '#ff5a6e' },
  { id: 'worm2', x: 64, y: 646, r: 22, wait: 1.3, out: [368, 470], dir: [-0.15, 1], spd: 430, c: '#5cf08a' },
  { id: 'ramp',  x: 452, y: 540, r: 24, wait: 1.7, out: [133, 340], dir: [-0.15, 1], spd: 380, lab: 'LAUNCH RAMP',
    path: [[452, 540], [484, 452], [492, 356], [486, 290], [438, 218], [360, 164], [284, 142], [212, 158], [164, 198], [142, 256], [138, 322], [133, 340]] },
  { id: 'chute', x: 452, y: 648, r: 22, wait: 1.2, out: [232, 340], dir: [-0.2, 1], spd: 460, lab: 'CHUTE',
    path: [[452, 648], [416, 570], [372, 480], [318, 402], [266, 360], [232, 340]] }
];

// ---- الأعلام الدوّارة ----
var FLAGS = [{ x: 110, y: 470, r: 22, spin: 0, v: 0, rolls: 0 }, { x: 478, y: 470, r: 22, spin: 0, v: 0, rolls: 0 }];
// ---- حارس المصرف وقت تعدّد الكرات ----
var BLOCKER = { a: [PIV_L, PIV_Y + 62], b: [PIV_R, PIV_Y + 62], on: false };
// ---- الرافعتان الجانبيتان: إنقاذ واحد لكل جانب في كل كرة ----
var KICKS = [{ x: EDGE_L + W_OUT / 2, y: 948, on: false }, { x: EDGE_R - W_OUT / 2, y: 948, on: false }];
// ---- شعار الرتبة في وسط الطاولة ----
var EMB = { x: 294, y: 880, r1: 52, r2: 76 };
/* ==========================================================================
   ٢ — الفيزياء
   --------------------------------------------------------------------------
   الكرة تحمل اتجاهاً واحديّاً وسرعة قياسية منفصلة كما في الأصل، لا متّجه سرعة.
   وكل خطوة زمنية ثابتة تُقسَّم داخلياً إلى قفزات لا تتجاوز نصف قطر الكرة، وفي
   كل قفزة يُطلق شعاع مُكتسِح يبحث عن أقرب تصادم — فلا تعبر الكرة جداراً مهما
   بلغت سرعتها. هذه بنية ‎pb::timed_frame‎ نفسها.
   ========================================================================== */
function Ball(x, y) {
  this.x = x; this.y = y; this.dx = 0; this.dy = 1; this.spd = 0;
  this.hole = null; this.ht = 0;
  /* wait: الكرة مركونة عند القاذف تنتظر السحب. تُشتقّ من الموضع لا تُمسك يدوياً:
     أي كرة بطيئة في ممر القاذف تُركن، فقذفة ضعيفة لا تبلغ أعلى الممر تعود
     وتُركن من جديد بدل أن تموت في القاع بلا طريقة لقذفها ثانية. */
  this.wait = true; this.stuck = 0; this.px = x; this.py = y; this.ro = {};
}

/* ارتداد: نقل حرفي لـ‎maths::basic_collision‎.
   n متّجه واحدي خارج السطح، e مرونة، s نعومة (احتكاك مماسّي). */
function bounce(b, nx, ny, e, s, thr, boost) {
  var proj = -(nx * b.dx + ny * b.dy), m;
  if (proj < 0) { proj = -proj; }
  else {
    var d1x = proj * nx, d1y = proj * ny;
    b.dx = (d1x + b.dx) * s + d1x * e;
    b.dy = (d1y + b.dy) * s + d1y * e;
    m = Math.sqrt(b.dx * b.dx + b.dy * b.dy) || 1; b.dx /= m; b.dy /= m;
  }
  var rs = proj * b.spd;
  b.spd -= (1 - e) * rs;
  if (rs >= thr) {
    b.dx = b.spd * b.dx + nx * boost;
    b.dy = b.spd * b.dy + ny * boost;
    m = Math.sqrt(b.dx * b.dx + b.dy * b.dy);
    b.spd = m; if (m > 1e-6) { b.dx /= m; b.dy /= m; }
  }
  if (b.spd > BMAX) b.spd = BMAX;
  return rs;
}

// أقرب تلامس بين قرص متحرّك وقطعة مستقيمة: الوجه أولاً ثم طرفاه
var _h = { t: 0, nx: 0, ny: 0, push: 0 };
/* أقرب تلامس بين قرص متحرّك وقطعة مستقيمة: الوجه أولاً ثم طرفاها.
   وفي كلٍّ منهما فرعٌ للتداخل القائم أصلاً — يحدث حين يدور المضرب إلى داخل
   كرة ساكنة عليه — وبلا هذا الفرع يعيد الحساب زمناً سالباً فتُرفض الملامسة
   وتسقط الكرة عبر المضرب. ولا يُمدّ الوجه خارج طرفيه: خارجهما الطرف دائرة
   لا خطّ، ومدّه هناك يصنع جداراً وهمياً يعلّق الكرة بين المضربين. */
function hitSeg(px, py, mx, my, rad, ax, ay, bx, by, out) {
  var ux = bx - ax, uy = by - ay, L = Math.sqrt(ux * ux + uy * uy);
  if (L < 1e-9) return -1;
  ux /= L; uy /= L;
  var nx = -uy, ny = ux;
  var sx = px - ax, sy = py - ay, side = sx * nx + sy * ny;
  if (side < 0) { nx = -nx; ny = -ny; side = -side; }
  var den = mx * nx + my * ny, best = -1, q0 = sx * ux + sy * uy;
  out.push = 0;
  if (side < rad) {
    if (q0 >= 0 && q0 <= L && den < 0) {
      out.t = 0; out.nx = nx; out.ny = ny; out.push = rad - side; return 0;
    }
  } else if (den < -1e-9) {
    var t = (rad - side) / den;
    if (t >= 0 && t <= 1) {
      var q = (sx + mx * t) * ux + (sy + my * t) * uy;
      if (q >= 0 && q <= L) { out.t = t; out.nx = nx; out.ny = ny; return t; }
    }
  }
  var ex, ey, i;
  for (i = 0; i < 2; i++) {
    ex = i ? bx : ax; ey = i ? by : ay;
    var ox = px - ex, oy = py - ey, dd = ox * ox + oy * oy;
    if (dd < rad * rad) {                       // متداخلة مع طرف القطعة
      var dl = Math.sqrt(dd) || 1e-6, ex2 = ox / dl, ey2 = oy / dl;
      if (mx * ex2 + my * ey2 < 0) { out.t = 0; out.nx = ex2; out.ny = ey2; out.push = rad - dl; return 0; }
      continue;
    }
    var A = mx * mx + my * my; if (A < 1e-12) continue;
    var B = 2 * (mx * ox + my * oy), C = dd - rad * rad;
    var D = B * B - 4 * A * C; if (D < 0) continue;
    var tt = (-B - Math.sqrt(D)) / (2 * A);
    if (tt < 0 || tt > 1) continue;
    if (best < 0 || tt < best) {
      var cx = ox + mx * tt, cy = oy + my * tt, mm = Math.sqrt(cx * cx + cy * cy) || 1;
      best = tt; out.t = tt; out.nx = cx / mm; out.ny = cy / mm; out.push = 0;
    }
  }
  return best;
}

function hitCirc(px, py, mx, my, rad, cx, cy, cr) {
  var ox = px - cx, oy = py - cy, sum = rad + cr;
  var A = mx * mx + my * my; if (A < 1e-12) return -1;
  var B = 2 * (mx * ox + my * oy), C = ox * ox + oy * oy - sum * sum;
  out2.push = 0;
  if (C < 0) {                                  // متداخلة أصلاً: ادفعها للخارج
    var d = Math.sqrt(ox * ox + oy * oy) || 1;
    out2.t = 0; out2.nx = ox / d; out2.ny = oy / d; out2.push = sum - d; return 0;
  }
  var D = B * B - 4 * A * C; if (D < 0) return -1;
  var t = (-B - Math.sqrt(D)) / (2 * A);
  if (t < 0 || t > 1) return -1;
  var qx = ox + mx * t, qy = oy + my * t, m = Math.sqrt(qx * qx + qy * qy) || 1;
  out2.t = t; out2.nx = qx / m; out2.ny = qy / m; return t;
}
var out2 = { t: 0, nx: 0, ny: 0, push: 0 };

// قطعة الهدف الساقط: عرضها حول مركزها بزاوية البنك
function tgtSeg(t) {
  var a = t.a * D2R, ux = Math.cos(a) * t.hw, uy = Math.sin(a) * t.hw;
  return [t.x - ux, t.y - uy, t.x + ux, t.y + uy];
}

/* ---- المضربان: كلٌّ كبسولة تدور حول محورها. الزاوية تُقسَّم مع خطوة الكرة،
   فالمضرب في كل قفزة ساكن عند زاويته، وتُضاف سرعة سطحه إلى الارتداد —
   وهذا ما ينقل الطاقة: طرف المضرب أسرع من قاعدته فيضرب أقوى. ---- */
function Flipper(px, py, side) {
  this.px = px; this.py = py; this.side = side;      // side: 0 يسار، 1 يمين
  this.rest = side ? Math.PI - REST_A : REST_A;
  this.up = side ? Math.PI - UP_A : UP_A;
  this.a = this.rest; this.held = false; this.w = 0;
}
Flipper.prototype.step = function (dt) {
  var tgt = this.held ? this.up : this.rest;
  var d = tgt - this.a, dir = d > 0 ? 1 : -1, max = FLIP_W * dt;
  if (Math.abs(d) <= max) { this.w = d / (dt || 1); this.a = tgt; }
  else { this.w = dir * FLIP_W; this.a += dir * max; }
};
Flipper.prototype.tip = function () { return [this.px + FLIP_LEN * Math.cos(this.a), this.py + FLIP_LEN * Math.sin(this.a)]; };

var flipL = new Flipper(PIV_L, PIV_Y, 0), flipR = new Flipper(PIV_R, PIV_Y, 1);
var FLIPS = [flipL, flipR];

/* ---- وجها المصدّين يُضافان إلى الجدران بمفتاح خاص ليُعرفا عند الإصابة ---- */
WALLS.push({ a: SLINGS[0].a, b: SLINGS[0].b, e: 0.4, s: 0.9, k: 'sl0' });
WALLS.push({ a: SLINGS[1].a, b: SLINGS[1].b, e: 0.4, s: 0.9, k: 'sl1' });

/* أقرب تصادم على امتداد حركة واحدة. يعيد نوع المصدوم ومعاملاته كي تتولّى
   طبقة القواعد ما بعد الارتداد (نقاط، أصوات، أضواء). */
var CH = { t: 0, nx: 0, ny: 0, kind: null, obj: null, e: EL, s: SM, boost: 0, push: 0 };
function cast(b, mx, my) {
  var best = 2, i, t, o;
  CH.kind = null;
  for (i = 0; i < WALLS.length; i++) {
    o = WALLS[i];
    t = hitSeg(b.x, b.y, mx, my, BR, o.a[0], o.a[1], o.b[0], o.b[1], _h);
    if (t >= 0 && t < best) { best = t; CH.t = t; CH.nx = _h.nx; CH.ny = _h.ny; CH.kind = o.k; CH.obj = o; CH.e = o.e; CH.s = o.s; CH.boost = 0; CH.push = _h.push; }
  }
  for (i = 0; i < BUMPERS.length; i++) {
    o = BUMPERS[i];
    t = hitCirc(b.x, b.y, mx, my, BR, o.x, o.y, o.r);
    if (t >= 0 && t < best) { best = t; CH.t = t; CH.nx = out2.nx; CH.ny = out2.ny; CH.kind = 'bump'; CH.obj = o; CH.e = 0.5; CH.s = 0.9; CH.boost = 0; CH.push = out2.push; }
  }
  for (i = 0; i < POSTS.length; i++) {
    o = POSTS[i];
    t = hitCirc(b.x, b.y, mx, my, BR, o.x, o.y, o.r);
    if (t >= 0 && t < best) { best = t; CH.t = t; CH.nx = out2.nx; CH.ny = out2.ny; CH.kind = 'post'; CH.obj = o; CH.e = 0.82; CH.s = 0.92; CH.boost = 0; CH.push = out2.push; }
  }
  for (i = 0; i < TARGETS.length; i++) {
    o = TARGETS[i];
    if (o.k !== 'drop' || o.down) continue;
    var sg = tgtSeg(o);
    t = hitSeg(b.x, b.y, mx, my, BR, sg[0], sg[1], sg[2], sg[3], _h);
    if (t >= 0 && t < best) { best = t; CH.t = t; CH.nx = _h.nx; CH.ny = _h.ny; CH.kind = 'drop'; CH.obj = o; CH.e = 0.35; CH.s = 0.85; CH.boost = 0; CH.push = _h.push; }
  }
  if (BLOCKER.on) {
    t = hitSeg(b.x, b.y, mx, my, BR, BLOCKER.a[0], BLOCKER.a[1], BLOCKER.b[0], BLOCKER.b[1], _h);
    if (t >= 0 && t < best) { best = t; CH.t = t; CH.nx = _h.nx; CH.ny = _h.ny; CH.kind = 'blocker'; CH.obj = BLOCKER; CH.e = 0.5; CH.s = 0.9; CH.boost = 0; CH.push = _h.push; }
  }
  for (i = 0; i < 2; i++) {
    var f = FLIPS[i], tp = f.tip();
    t = hitSeg(b.x, b.y, mx, my, BR + FLIP_R, f.px, f.py, tp[0], tp[1], _h);
    if (t >= 0 && t < best) {
      // سرعة السطح عند نقطة التلامس: ω × r، ومركّبتها على العمود هي الدفعة
      var cxp = b.x + mx * t - f.px, cyp = b.y + my * t - f.py;
      var vsx = -f.w * cyp, vsy = f.w * cxp;
      var vn = vsx * _h.nx + vsy * _h.ny;
      best = t; CH.t = t; CH.nx = _h.nx; CH.ny = _h.ny; CH.kind = 'flip'; CH.obj = f;
      CH.e = 0.32; CH.s = 0.92; CH.boost = vn > 0 ? vn * 0.92 : 0; CH.push = _h.push;
    }
  }
  return best <= 1 ? best : -1;
}

var PICK = {

  if (G.bonusFlag) { G.bonus = Math.min(5000000, G.bonus + n); }

  var id = G.sel; G.sel = 0; G.mission = id; G.part = 0; G.cnt = MIS[id].p[0].n;

  say('قُبلت المهمّة — ' + got.toLocaleString('en-US'), 3);
  sfx('accept');
}
function missionEv(kind) {
  if (!G.mission || G.tiltLock) return;
  var m = MIS[G.mission], part = m.p[G.part], ok =
    part.ev === kind ||
    (part.ev === 'worm' && kind.slice(0, 4) === 'worm') ||
    (part.ev === 'hyperRamp' && (kind === 'hyper' || kind === 'ramp'));
  if (!ok) return;
  if (--G.cnt > 0) { sfx('goal'); return; }
  if (++G.part < m.p.length) { G.cnt = m.p[G.part].n; info('المرحلة التالية', 2); sfx('goal'); return; }

}
function missionDone() {
  var m = MIS[G.mission];

  G.mission = 0; G.part = 0; G.jackFlag = false; G.jack = 0;
  say(m.d + ' — ' + got.toLocaleString('en-US'), 6);
  sfx('mission');
  rankProgress(m.r);
}
function missionAbort() {
  if (!G.mission && !G.sel) return;
  G.mission = 0; G.sel = 0; G.jackFlag = false;
  say('أُلغيت المهمّة', 3);
}

// ---------- أحداث الطاولة ----------
function onBumper(b) {
  if (G.tiltLock) return;
  var grp = b.g, lv = grp ? G.lauLv : G.atkLv;
  addScore((grp ? SC.lau : SC.atk)[lv]);
  sfx('bump', 1 + lv * 0.12);
  b.flash = 0.18;
  if (!b.lit) {
    b.lit = true;
    var all = true, i;
    for (i = 0; i < BUMPERS.length; i++) if (BUMPERS[i].g === grp && !BUMPERS[i].lit) all = false;
    if (all) {
      for (i = 0; i < BUMPERS.length; i++) if (BUMPERS[i].g === grp) BUMPERS[i].lit = false;
      if (grp) { if (G.lauLv < 3) { G.lauLv++; missionEv('lauUp'); info('طُوِّرت منافخ الإطلاق'); } }
      else { if (G.atkLv < 3) { G.atkLv++; missionEv('atkUp'); info('طُوِّرت منافخ الهجوم'); } }
    }
  }
  missionEv(grp ? 'lau' : 'atk');
}
function bankDown(g) { var i, all = true; for (i = 0; i < TARGETS.length; i++) if (TARGETS[i].g === g && !TARGETS[i].down) all = false; return all; }
function bankReset(g) { for (var i = 0; i < TARGETS.length; i++) if (TARGETS[i].g === g) TARGETS[i].down = false; }
function onTarget(t) {
  if (G.tiltLock) return;
  t.flash = 0.3;
  if (t.k === 'drop') {
    t.down = true; sfx('target');
    if (t.g === 'mult') {
      addScore(SC.mult[Math.min(1, G.multLv)]);
      if (bankDown('mult')) {
        bankReset('mult'); G.multLv = Math.min(1, G.multLv + 1);
        if (G.mult < 4) { G.mult++; info('مضاعِف ×' + MULTS[G.mult], 3); sfx('up'); }
      }
    } else if (t.g === 'medal') {
      addScore(SC.medal[Math.min(2, G.medalLv)]);
      if (bankDown('medal')) {
        bankReset('medal');
        if (G.medalLv < 2) { G.medalLv++; info(['وسام برونزي', 'وسام فضّي', 'وسام ذهبي'][G.medalLv], 3); sfx('up'); }
        else if (!G.extraLit) { G.extraLit = true; info('كرة إضافية مُضاءة', 3); sfx('up'); }
      }
    } else {
      addScore(SC.boost[Math.min(1, G.boostLv)]);
      if (bankDown('boost')) {
        bankReset('boost'); G.boostLv = Math.min(1, G.boostLv + 1);
        G.bonusFlag = true; info('المكافأة تتراكم', 3); sfx('up');
      }
    }
    missionEv('drop');
    return;
  }
  sfx('spot');
  if (t.g === 'mission') { addScore(SC.missionT[0]); missionPick(t.i); }
  else if (t.g === 'fuel') { addScore(SC.fuelT[0]); G.fuel = Math.min(6, G.fuel + 1); }
  else if (t.g === 'hazL' || t.g === 'hazR') {
    addScore(SC.hazard[0]);
    var arr = t.g === 'hazL' ? G.hazL : G.hazR;
    if (!arr[t.i]) { arr[t.i] = true; missionEv(t.g); }
    if (arr[0] && arr[1] && arr[2]) { arr[0] = arr[1] = arr[2] = false; info('اكتمل بنك الخطر', 2); }
  } else { addScore(SC.wdest[0]); G.wdest = ((G.wdest || 0) + 1) % 3; info('وجهة الثقب الدودي تغيّرت', 2); }
  missionEv('spot');
}
function onRoll(r) {
  if (G.tiltLock) return;
  sfx('roll');
  if (r.g === 'orbit') { addScore(SC.fuelRoll[0]); G.fuel = Math.min(6, G.fuel + 1); }
  else if (r.g === 'reentry') { addScore(SC.reen[0]); missionEv('reen'); missionEv('lane'); }
  else if (r.g === 'launch') { addScore(SC.laneRoll[0]); missionEv('lane'); }
  else if (r.g === 'outL' || r.g === 'outR') {
    addScore(SC.outl[0]); missionEv('outl');
    if (G.extraLit) { G.extraLit = false; G.extra++; info('كرة إضافية!', 3); sfx('extra'); }
  }
  else if (r.g === 'inL' || r.g === 'inR') { addScore(SC.inl[G.comboT > 0 ? 1 : 0]); G.comboT = 3; missionEv('lane'); }
  else if (r.g === 'bonus') { addScore(SC.bonusLane[0]); G.bonusFlag = true; }
  else if (r.g === 'warp') { addScore(SC.warp[0]); missionEv('warp'); }
}
function onHole(b, h) {
  if (G.tiltLock) return;
  sfx('hole');
  if (h.id === 'hyper') {
    addScore(SC.hyper[G.hyperLv]); if (G.hyperLv < 4) G.hyperLv++;
    if (!G.mission && !G.sel) missionPick(3); else missionEv('hyper');
  } else if (h.id.slice(0, 4) === 'worm') {
    var i = +h.id[4];
    addScore(SC.sink[i]);
    if (!G.wormLit[i]) { G.wormLit[i] = true; }
    missionEv('worm' + i);
    if (G.wormLit[0] && G.wormLit[1] && G.wormLit[2] && balls.length < 2) {
      G.wormLit = [false, false, false]; startMultiball();
    }
  } else if (h.id === 'ramp') {
    sfx('ramp'); addScore(SC.ramp[0]);
    if (G.sel && G.fuel > 0) missionAccept(); else missionEv('ramp');
  } else if (h.id === 'chute') {
    addScore(SC.chute[G.chuteLv]); G.chuteLv = (G.chuteLv + 1) % 6; missionEv('chute');
  }
}
function onSling(i) {
  if (G.tiltLock) return;
  SLINGS[i].lit = 0.16; addScore(SC.rebo[0]); sfx('sling'); missionEv('rebo');
}
function onFlag(f) {
  if (G.tiltLock) return;
  addScore(SC.flag[Math.min(1, G.flagLv)]); sfx('flag');
  f.rolls = (f.rolls || 0) + 1;
  if (f.rolls % 10 === 0 && G.flagLv < 1) { G.flagLv++; missionEv('flagUp'); info('طُوِّرت الأعلام'); }

// ---------- الإمالة ----------
function doTilt() {
  if (G.tiltLock) return;
  G.tiltLock = true; G.tiltT = 30;

/* ==========================================================================
   ٤ — دورة الكرة والمحاكاة
   ========================================================================== */
var LANE_MID = (LANE_IN + LANE_OUT) / 2;
var PLUNGE = { pull: 0 };

function park(b) {
  b.wait = true; b.spd = 0; b.x = LANE_MID; b.y = PLUNGE_REST; b.dx = 0; b.dy = -1; b.ro = {};
  PLUNGE.pull = 0;
}
function newBall() {
  var b = new Ball(LANE_MID, PLUNGE_REST);
  park(b);
  balls.push(b);
  PLUNGE.pull = 0;
  KICKS[0].on = KICKS[1].on = true;      // إنقاذ واحد لكل جانب في كل كرة
  return b;
}
function startMultiball() {
  info('كرات متعدّدة!', 4); sfx('multi');
  var i, b;
  for (i = 0; i < 2; i++) {
    b = new Ball(CX + (i ? 44 : -44), 470); b.wait = false;
    b.dx = i ? 0.3 : -0.3; b.dy = 1; b.spd = 300;
    balls.push(b);
  }
}
function drainBall(b) {
  var i = balls.indexOf(b); if (i >= 0) balls.splice(i, 1);
  if (balls.length) { sfx('drain1'); return; }
  endOfBall();
}
function endOfBall() {
  sfx('lost');
  if (!G.tiltLock && G.bonus > 0) {
    var got = special(G.bonus);
    info('مكافأة: ' + got.toLocaleString('en-US'), 3);
  }
  missionAbort();
  G.tiltLock = false; G.tilt = 0; G.bonus = 0; G.bonusFlag = false; G.jackFlag = false;
  G.mult = 0; G.fuel = 6; G.atkLv = 0; G.lauLv = 0; G.flagLv = 0;
  G.hazL = [false, false, false]; G.hazR = [false, false, false]; G.wormLit = [false, false, false];
  bankReset('mult'); bankReset('medal'); bankReset('boost');
  for (var i = 0; i < BUMPERS.length; i++) BUMPERS[i].lit = false;
  if (G.extra > 0) { G.extra--; say('اضرب ثانية', 4); newBall(); return; }
  G.ball++;
  if (G.ball > G.ballsTotal) { gameOver(); return; }
  say('الكرة ' + G.ball, 3);
  newBall();
}

/* ---- الجاذبية ثم التقدّم بخطوات نصف قطر ----
   عدد القفزات يُشتق من أسرع متحرّك في المشهد: الكرة أو طرف المضرب، فتبقى
   الدقّة ثابتة مهما اشتدّت الحركة. */
var STEP = 1 / 120, ACC = 0;
function physics(dt) {
  var i, b, vx, vy, maxS = 1;
  for (i = 0; i < balls.length; i++) {
    b = balls[i];
    if (b.hole) { b.ht -= dt; continue; }
    if (b.wait) continue;
    vx = b.dx * b.spd; vy = b.dy * b.spd;
    vy += GRAV * dt;
    if (G.nudgeX) { vx += G.nudgeX * dt * 60; }
    var drag = 1 - 0.2 * dt; vx *= drag; vy *= drag;
    b.spd = Math.sqrt(vx * vx + vy * vy);
    if (b.spd > 1e-6) { b.dx = vx / b.spd; b.dy = vy / b.spd; }
    if (b.spd > BMAX) b.spd = BMAX;
    var st = Math.ceil(b.spd * dt / BHALF); if (st > maxS) maxS = st;
  }
  var fs = Math.ceil(FLIP_W * dt * FLIP_LEN / BHALF); if (fs > maxS) maxS = fs;
  if (maxS > 24) maxS = 24;
  var sdt = dt / maxS;
  for (var s = 0; s < maxS; s++) {
    flipL.step(sdt); flipR.step(sdt);
    for (i = 0; i < balls.length; i++) moveBall(balls[i], sdt);
  }
  G.nudgeX = 0;
  for (i = balls.length - 1; i >= 0; i--) sensors(balls[i], dt);
  ballToBall();
}

function moveBall(b, dt) {
  if (b.hole || b.wait) return;
  var remain = dt, guard = 0;
  while (remain > 1e-9 && guard++ < 8) {
    var mx = b.dx * b.spd * remain, my = b.dy * b.spd * remain;
    var t = cast(b, mx, my);
    if (t < 0) { b.x += mx; b.y += my; break; }
    b.x += mx * t; b.y += my * t;
    var kind = CH.kind, obj = CH.obj, nx = CH.nx, ny = CH.ny, sp = b.spd;
    var push = (CH.push || 0) + 0.05;
    b.x += nx * push; b.y += ny * push;
    bounce(b, nx, ny, CH.e, CH.s, 0, CH.boost);
    hit(b, kind, obj, nx, ny, sp);
    remain *= (1 - t);
    if (b.spd < 1e-6) break;
  }
}
// دفعة خارجية على امتداد العمود: هذا ما يجعل المنفاخ منفاخاً لا جداراً
function kick(b, nx, ny, add) {
  var vx = b.dx * b.spd + nx * add, vy = b.dy * b.spd + ny * add;
  var m = Math.sqrt(vx * vx + vy * vy);
  b.spd = Math.min(BMAX, m); if (m > 1e-6) { b.dx = vx / m; b.dy = vy / m; }
}
function shake(a) { shakeX += (Math.random() - 0.5) * a; shakeY += (Math.random() - 0.5) * a; }
function hit(b, kind, obj, nx, ny, sp) {
  if (kind === 'bump') { kick(b, nx, ny, 540 + 60 * (obj.g ? G.lauLv : G.atkLv)); onBumper(obj); shake(3.5); }
  else if (kind === 'sl0') { kick(b, nx, ny, 560); onSling(0); shake(2.5); }
  else if (kind === 'sl1') { kick(b, nx, ny, 560); onSling(1); shake(2.5); }
  else if (kind === 'post') { if (sp > 300) sfx('post', Math.min(1, sp / 1400)); }
  else if (kind === 'drop') { onTarget(obj); }
  else if (kind === 'flip') { if (sp > 260) sfx('flip'); }
  else if (sp > 420) sfx('wall', Math.min(1, sp / 1600));
}

/* ---- الحسّاسات: مجسّات وأهداف نقطية وثقوب وأعلام ومصرف.
   لكل كرة ذاكرة دخول/خروج كي لا يتكرّر الحدث ما دامت فوق الحسّاس. ---- */
function sensors(b, dt) {
  if (b.hole) {
    if (b.hole.path) {                            // منحدر سلكي: الكرة مرئية تصعده
      var u = 1 - b.ht / b.hole.wait, P = b.hole.path;
      var f = Math.max(0, Math.min(0.9999, u)) * (P.length - 1), k = f | 0, g = f - k;
      b.x = P[k][0] + (P[k + 1][0] - P[k][0]) * g;
      b.y = P[k][1] + (P[k + 1][1] - P[k][1]) * g;
    }
    if (b.ht <= 0) {
      var h = b.hole; b.hole = null;
      b.x = h.out[0]; b.y = h.out[1];
      var m = Math.sqrt(h.dir[0] * h.dir[0] + h.dir[1] * h.dir[1]) || 1;
      b.dx = h.dir[0] / m; b.dy = h.dir[1] / m; b.spd = h.spd;
    }
    return;
  }
  if (b.wait) return;
  var i, o, d, key;
  for (i = 0; i < ROLLS.length; i++) {
    o = ROLLS[i]; key = 'r' + i;
    d = (b.x - o.x) * (b.x - o.x) + (b.y - o.y) * (b.y - o.y) < o.r * o.r;
    if (d && !b.ro[key]) { b.ro[key] = 1; o.on = true; o.t = 0.7; onRoll(o); }
    else if (!d && b.ro[key]) b.ro[key] = 0;
  }
  for (i = 0; i < TARGETS.length; i++) {
    o = TARGETS[i]; if (o.k !== 'spot') continue; key = 't' + i;
    d = (b.x - o.x) * (b.x - o.x) + (b.y - o.y) * (b.y - o.y) < (o.hw + BR) * (o.hw + BR);
    if (d && !b.ro[key]) { b.ro[key] = 1; onTarget(o); }
    else if (!d && b.ro[key]) b.ro[key] = 0;
  }
  for (i = 0; i < FLAGS.length; i++) {
    o = FLAGS[i]; key = 'f' + i;
    d = (b.x - o.x) * (b.x - o.x) + (b.y - o.y) * (b.y - o.y) < o.r * o.r;
    if (d && !b.ro[key]) { b.ro[key] = 1; o.v = 14; onFlag(o); }
    else if (!d && b.ro[key]) b.ro[key] = 0;
  }
  for (i = 0; i < HOLES.length; i++) {
    o = HOLES[i];
    if ((b.x - o.x) * (b.x - o.x) + (b.y - o.y) * (b.y - o.y) < o.r * o.r) {
      b.hole = o; b.ht = o.wait; b.spd = 0; b.ro = {}; onHole(b, o); return;
    }
  }
  if (b.y > TH + 20) { drainBall(b); return; }
  // كرة هدأت في ممر القاذف: أعدها إلى وضع الانتظار كي تُقذف من جديد
  if (b.x > LANE_IN && b.y > 980 && b.spd < 120) { park(b); return; }
  // الرافعة الجانبية: تُعيد الكرة من ممر الخروج حين تكون مُضاءة
  for (i = 0; i < KICKS.length; i++) {
    o = KICKS[i];
    if (o.on && b.y > o.y - 30 && Math.abs(b.x - o.x) < 34) {
      o.on = false; o.flash = 0.3; b.dx = 0; b.dy = -1; b.spd = 1250; sfx('kickback');
    }
  }
  // كرة عالقة: هزّة خفيفة كما تفعل ‎control::UnstuckBall‎
  var moved = (b.x - b.px) * (b.x - b.px) + (b.y - b.py) * (b.y - b.py);
  b.px = b.x; b.py = b.y;
  if (b.spd < 24 && moved < 1) {
    b.stuck += dt;
    if (b.stuck > 1.6) {
      b.stuck = 0; b.kicks = (b.kicks || 0) + 1;
      b.dx = (Math.random() - 0.5); b.dy = -1;
      var mm = Math.sqrt(b.dx * b.dx + 1); b.dx /= mm; b.dy /= mm; b.spd = 300 + 90 * b.kicks;
      /* شبكة أمان أخيرة: هندسة فيها جيب لم أره قد تبتلع كرة إلى الأبد وتُجمّد
         الجولة. بعد خمس محاولات تُعدّ الكرة ضائعة وتمضي اللعبة — خسارة كرة
         أرحم من طاولة واقفة لا تفعل شيئاً. */
      if (b.kicks > 5) { drainBall(b); return; }
    }
  } else { b.stuck = 0; b.kicks = 0; }
}
function ballToBall() {
  for (var i = 0; i < balls.length; i++) for (var j = i + 1; j < balls.length; j++) {
    var a = balls[i], c = balls[j];
    if (a.hole || c.hole || a.wait || c.wait) continue;
    var dx = c.x - a.x, dy = c.y - a.y, d = Math.sqrt(dx * dx + dy * dy);
    if (d < 1e-6 || d >= BR * 2) continue;
    var nx = dx / d, ny = dy / d, overlap = BR * 2 - d;
    a.x -= nx * overlap * 0.5; a.y -= ny * overlap * 0.5;
    c.x += nx * overlap * 0.5; c.y += ny * overlap * 0.5;
    var av = a.dx * nx + a.dy * ny, cv = c.dx * nx + c.dy * ny;
    var ai = av * a.spd, ci = cv * c.spd;
    if (ai - ci <= 0) continue;
    kick(a, -nx, -ny, (ai - ci) * 0.9); kick(c, nx, ny, (ai - ci) * 0.9);
  }
}


/* ==========================================================================
   ٥ — الصوت: كل شيء مُولَّد بـWebAudio، ولا ملف صوتي واحد
   --------------------------------------------------------------------------
   الرقعة السابقة كانت نغمات عارية فبدت كتنبيهات لا كطاولة. هذه تُبنى كما
   تُبنى أصوات الطاولة الحقيقية: لكل اصطدام «طَرْق» ضوضائي قصير يعطي المادة
   (معدن، بلاستيك، مطّاط) فوق «جسم» منغَّم يعطي الحجم، والكل يمرّ بصدى قصير
   مُولَّد يجعل الصوت داخل خزانة لا في الفراغ. ويُضاف إلى ذلك صوت تدحرج مستمر
   يتبع سرعة الكرة — وهو أكثر ما يُشعر باللعب.
   ========================================================================== */
var SKEY = 'pinball-sound', soundOn = true;
try { soundOn = localStorage.getItem(SKEY) !== 'off'; } catch (e) {}
var actx = null, master = null, wet = null, mus = null, nbuf = null, warmed = false;
var roller = null, rollGain = null, rollFilt = null;

function ac() {
  if (!actx) {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
    var comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
    comp.connect(actx.destination);
    master = actx.createGain(); master.gain.value = 0.85; master.connect(comp);
    // صدى قصير: ضوضاء متلاشية تصنع حيّز الخزانة بلا ملفّ
    var len = Math.floor(actx.sampleRate * 0.55), ir = actx.createBuffer(2, len, actx.sampleRate), ch, k;
    for (ch = 0; ch < 2; ch++) {
      var d = ir.getChannelData(ch);
      for (k = 0; k < len; k++) d[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / len, 3.2);
    }
    var conv = actx.createConvolver(); conv.buffer = ir;
    wet = actx.createGain(); wet.gain.value = 0.22; wet.connect(conv); conv.connect(master);
    mus = actx.createGain(); mus.gain.value = 0.15; mus.connect(master);
    // ضوضاء بيضاء مشتركة
    nbuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    var nd = nbuf.getChannelData(0);
    for (k = 0; k < nd.length; k++) nd[k] = Math.random() * 2 - 1;
    // صوت التدحرج: مصدر واحد دائم يُفتح ويُغلق بسرعة الكرة
    roller = actx.createBufferSource(); roller.buffer = nbuf; roller.loop = true;
    rollFilt = actx.createBiquadFilter(); rollFilt.type = 'bandpass'; rollFilt.Q.value = 1.1;
    rollFilt.frequency.value = 400;
    rollGain = actx.createGain(); rollGain.gain.value = 0;
    roller.connect(rollFilt).connect(rollGain).connect(master);
    roller.start();
  }
  if (actx.state === 'suspended') actx.resume();

}

  for (k = 0; k < RP.length; k++) { c.beginPath(); c.moveTo(r1[k][0], r1[k][1]); c.lineTo(r2[k][0], r2[k][1]); c.stroke(); }
  rail(c, r1, 5); rail(c, r2, 5);

  // ---- القضبان: كل جدار في الطاولة يُرسم فولاذاً، والأقواس قطعة واحدة ----
  rail(c, arc(CX, CY, R_OUT, 180, 360, 4), 7);
  rail(c, arc(CX, CY, R_IN, 185, 360, 4), 7);
  var runs = wallPts(function (o) { return o.k === 'w'; });
  for (i = 0; i < runs.length; i++) if (runs[i].length > 2 || Math.hypot(runs[i][1][0] - runs[i][0][0], runs[i][1][1] - runs[i][0][1]) > 40) rail(c, runs[i], 7);
  runs = wallPts(function (o) { return o.k === 'sl'; });
  for (i = 0; i < runs.length; i++) rail(c, runs[i], 6);

  c.restore();
  c.setTransform(1, 0, 0, 1, 0, 0);
}

// مصباح تحت الدهان: مطفأً حفرة داكنة، ومُضاءً بؤرة تتوهّج خلف البلاستيك
function insert(c, x, y, r, on, col) {
  c.save();
  c.fillStyle = 'rgba(0,0,0,.55)'; c.beginPath(); c.arc(x, y, r + 1.5, 0, 6.2832); c.fill();
  if (on) {
    var g = c.createRadialGradient(x, y, 0, x, y, r * 3.4);
    g.addColorStop(0, col); g.addColorStop(0.28, col); g.addColorStop(1, 'rgba(0,0,0,0)');
    c.globalAlpha = 0.85; c.fillStyle = g;
    c.beginPath(); c.arc(x, y, r * 3.4, 0, 6.2832); c.fill(); c.globalAlpha = 1;
    c.fillStyle = '#fff'; c.beginPath(); c.arc(x, y, r * 0.62, 0, 6.2832); c.fill();
  } else {
    var d = c.createRadialGradient(x - r * .35, y - r * .35, 1, x, y, r);
    d.addColorStop(0, 'rgba(255,255,255,.26)'); d.addColorStop(0.6, 'rgba(190,175,225,.13)');
    d.addColorStop(1, 'rgba(20,10,40,.5)');
    c.fillStyle = d; c.beginPath(); c.arc(x, y, r, 0, 6.2832); c.fill();
  }
  c.strokeStyle = on ? 'rgba(255,255,255,.75)' : 'rgba(210,200,240,.45)'; c.lineWidth = 1.4;
  c.beginPath(); c.arc(x, y, r, 0, 6.2832); c.stroke();
  c.restore();
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, VW, VH);
  ctx.drawImage(stat, shakeX * S, shakeY * S, VW, VH);
  var c = ctx, i, o, p, b;
  tableCtx(c);

  // ---- حلقة الرتبة: تسعة أضواء للرتبة، وأربعة وعشرون للتقدّم نحو الترقية ----
  for (i = 0; i < 9; i++) { p = pol(-90 + i * 40, EMB.r1, EMB.x, EMB.y); insert(c, p[0], p[1], 6, i <= G.rank, 'rgba(93,225,255,.95)'); }
  for (i = 0; i < OUTER_LIGHTS; i++) { p = pol(-90 + i * (360 / OUTER_LIGHTS), EMB.r2, EMB.x, EMB.y); insert(c, p[0], p[1], 4.6, i < G.prog, 'rgba(255,190,60,.95)'); }

  // ---- المجسّات ----
  for (i = 0; i < ROLLS.length; i++) {
    o = ROLLS[i];
    insert(c, o.x, o.y, o.g === 'warp' ? 9 : 6, o.t > 0, 'rgba(255,230,120,.95)');
    c.strokeStyle = 'rgba(255,255,255,.16)'; c.lineWidth = 1.4;
    c.beginPath(); c.arc(o.x, o.y, o.r * 0.78, 0, 6.2832); c.stroke();
  }
  // ---- الأهداف ----
  for (i = 0; i < TARGETS.length; i++) {
    o = TARGETS[i];
    var col = o.g === 'mult' ? '#5de1ff' : o.g === 'medal' ? '#ffd34d' : o.g === 'boost' ? '#ff77c8'
            : o.g === 'mission' ? '#c46bff' : o.g === 'fuel' ? '#5cf08a' : '#5de1ff';
    if (o.k === 'drop') {
      var sg = tgtSeg(o), vert = o.a === 90;
      if (o.down) {                                 // شقّ في الدهان مكان الهدف
        c.strokeStyle = 'rgba(0,0,0,.6)'; c.lineWidth = 5; c.lineCap = 'round';
        c.beginPath(); c.moveTo(sg[0], sg[1]); c.lineTo(sg[2], sg[3]); c.stroke();
        continue;
      }
      c.save(); c.translate(o.x, o.y); if (vert) c.rotate(Math.PI / 2);
      var hw = o.hw, hh = 9;
      c.fillStyle = 'rgba(0,0,0,.5)'; rr(c, -hw, -hh + 4, hw * 2, hh * 2, 3); c.fill();
      var tg = c.createLinearGradient(0, -hh, 0, hh);
      tg.addColorStop(0, o.flash > 0 ? '#fff' : '#ffffff'); tg.addColorStop(0.35, col); tg.addColorStop(1, 'rgba(0,0,0,.65)');
      c.fillStyle = tg; rr(c, -hw, -hh, hw * 2, hh * 2, 3); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1.2; c.stroke();
      c.restore();
    } else {
      var on = o.flash > 0 || (o.g === 'hazL' && G.hazL[o.i]) || (o.g === 'hazR' && G.hazR[o.i]) ||
               (o.g === 'mission' && !!(G.sel || G.mission));
      // هدف نقطي: عمود معدني صغير أمام مصباح
      insert(c, o.x, o.y, 9, on, col);
      c.fillStyle = 'rgba(0,0,0,.45)'; rr(c, o.x - 3.5, o.y - 15, 7, 13, 2); c.fill();
      var pg = c.createLinearGradient(o.x - 3, 0, o.x + 3, 0);
      pg.addColorStop(0, '#f2f4ff'); pg.addColorStop(1, '#7b8296');
      c.fillStyle = pg; rr(c, o.x - 3, o.y - 16, 6, 13, 2); c.fill();
    }
  }
  // ---- المنافخ: قاعدة ملوّنة، تنّورة، وقبّعة فطرية ----
  for (i = 0; i < BUMPERS.length; i++) {
    o = BUMPERS[i];
    var f = o.flash > 0, rr2 = o.r;
    c.fillStyle = 'rgba(0,0,0,.5)'; c.beginPath(); c.arc(o.x + 3, o.y + 4, rr2, 0, 6.2832); c.fill();
    var ring = c.createRadialGradient(o.x, o.y, rr2 * 0.5, o.x, o.y, rr2);
    ring.addColorStop(0, f ? 'rgba(255,255,255,.95)' : (o.lit ? 'rgba(93,225,255,.9)' : 'rgba(196,107,255,.75)'));
    ring.addColorStop(1, 'rgba(20,8,40,.9)');
    c.fillStyle = ring; c.beginPath(); c.arc(o.x, o.y, rr2, 0, 6.2832); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.45)'; c.lineWidth = 1.5;
    c.beginPath(); c.arc(o.x, o.y, rr2, 0, 6.2832); c.stroke();
    var cap = c.createRadialGradient(o.x - rr2 * .32, o.y - rr2 * .38, 1, o.x, o.y, rr2 * .68);
    cap.addColorStop(0, '#ffffff'); cap.addColorStop(0.5, f ? '#ffe58a' : '#d9d2ec'); cap.addColorStop(1, '#5b5273');
    c.fillStyle = cap; c.beginPath(); c.arc(o.x, o.y, rr2 * 0.66, 0, 6.2832); c.fill();
    c.strokeStyle = f ? '#fff' : 'rgba(255,255,255,.55)'; c.lineWidth = 2;
    c.beginPath(); c.arc(o.x, o.y, rr2 * 0.66, 0, 6.2832); c.stroke();
  }
  // ---- الأعمدة: بلاستيك أبيض عليه حلقة مطّاط ----
  for (i = 0; i < POSTS.length; i++) {
    o = POSTS[i];
    c.fillStyle = 'rgba(0,0,0,.5)'; c.beginPath(); c.arc(o.x + 2, o.y + 3, o.r + 2, 0, 6.2832); c.fill();
    c.fillStyle = '#e2436b'; c.beginPath(); c.arc(o.x, o.y, o.r + 2.5, 0, 6.2832); c.fill();
    var pgd = c.createRadialGradient(o.x - o.r * .4, o.y - o.r * .4, 1, o.x, o.y, o.r);
    pgd.addColorStop(0, '#fff'); pgd.addColorStop(1, '#b9b3c9');
    c.fillStyle = pgd; c.beginPath(); c.arc(o.x, o.y, o.r, 0, 6.2832); c.fill();
  }
  // ---- المصدّان: شريط مطّاط بين عمودين ----
  for (i = 0; i < 2; i++) {
    o = SLINGS[i];
    var lit = o.lit > 0;
    c.lineCap = 'round';
    c.strokeStyle = 'rgba(0,0,0,.5)'; c.lineWidth = 11;
    c.beginPath(); c.moveTo(o.a[0], o.a[1] + 3); c.lineTo(o.b[0], o.b[1] + 3); c.stroke();
    c.strokeStyle = lit ? '#ffffff' : '#e2436b'; c.lineWidth = lit ? 10 : 8;
    c.beginPath(); c.moveTo(o.a[0], o.a[1]); c.lineTo(o.b[0], o.b[1]); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(o.a[0], o.a[1] - 2); c.lineTo(o.b[0], o.b[1] - 2); c.stroke();
    for (var q = 0; q < 2; q++) {
      var pp = q ? o.b : o.a;
      c.fillStyle = '#efe9ff'; c.beginPath(); c.arc(pp[0], pp[1], 6, 0, 6.2832); c.fill();
    }
  }
  // ---- الأعلام الدوّارة ----
  for (i = 0; i < FLAGS.length; i++) {
    o = FLAGS[i];
    c.save(); c.translate(o.x, o.y); c.rotate(o.spin);
    for (var w = 0; w < 3; w++) {
      c.rotate(2.0944);
      c.strokeStyle = 'rgba(0,0,0,.45)'; c.lineWidth = 6;
      c.beginPath(); c.moveTo(0, 2); c.lineTo(o.r * 0.9, 2); c.stroke();
      c.strokeStyle = G.flagLv > 0 ? '#ffd34d' : '#9fd0ff'; c.lineWidth = 4;
      c.beginPath(); c.moveTo(0, 0); c.lineTo(o.r * 0.9, 0); c.stroke();
    }
    c.restore();
    c.fillStyle = '#6d7488'; c.beginPath(); c.arc(o.x, o.y, 4, 0, 6.2832); c.fill();
  }
  // ---- حارس المصرف والرافعتان ----
  if (BLOCKER.on) {
    c.strokeStyle = 'rgba(93,225,255,.95)'; c.lineWidth = 7; c.setLineDash([14, 10]);
    c.beginPath(); c.moveTo(BLOCKER.a[0], BLOCKER.a[1]); c.lineTo(BLOCKER.b[0], BLOCKER.b[1]); c.stroke();
    c.setLineDash([]);
  }
  for (i = 0; i < KICKS.length; i++) insert(c, KICKS[i].x, KICKS[i].y, 6, KICKS[i].on, 'rgba(120,255,160,.95)');

  // ---- المضربان: مضرب مستدقّ بخطّ أبيض ومحور معدني ----
  for (i = 0; i < 2; i++) {
    var fl = FLIPS[i], tp = fl.tip();
    c.save(); c.lineCap = 'round';
    c.strokeStyle = 'rgba(0,0,0,.5)'; c.lineWidth = (FLIP_R + 3) * 2;
    c.beginPath(); c.moveTo(fl.px, fl.py + 4); c.lineTo(tp[0], tp[1] + 4); c.stroke();
    c.strokeStyle = '#8e1f52'; c.lineWidth = FLIP_R * 2 + 2;
    c.beginPath(); c.moveTo(fl.px, fl.py); c.lineTo(tp[0], tp[1]); c.stroke();
    var fg = c.createLinearGradient(fl.px, fl.py - FLIP_R, fl.px, fl.py + FLIP_R);
    fg.addColorStop(0, '#ffd7e6'); fg.addColorStop(0.42, '#ff5f9e'); fg.addColorStop(1, '#a32360');
    c.strokeStyle = fg; c.lineWidth = FLIP_R * 2 - 2;
    c.beginPath(); c.moveTo(fl.px, fl.py); c.lineTo(tp[0], tp[1]); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.65)'; c.lineWidth = 2.2;
    c.beginPath(); c.moveTo(fl.px + (tp[0] - fl.px) * .12, fl.py + (tp[1] - fl.py) * .12 - 2.5);
    c.lineTo(fl.px + (tp[0] - fl.px) * .85, fl.py + (tp[1] - fl.py) * .85 - 2.5); c.stroke();
    c.fillStyle = '#c9c3dc'; c.beginPath(); c.arc(fl.px, fl.py, 5, 0, 6.2832); c.fill();
    c.fillStyle = '#2a1044'; c.beginPath(); c.arc(fl.px, fl.py, 2.4, 0, 6.2832); c.fill();
    c.restore();
  }

  // ---- القاذف ومؤشّر قوّته ----
  var py = PLUNGE_REST + 26 - PLUNGE.pull * 30;
  c.strokeStyle = '#6d7488'; c.lineWidth = 13; c.lineCap = 'butt';
  c.beginPath(); c.moveTo(LANE_MID, py); c.lineTo(LANE_MID, LANE_FLOOR); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 3;
  c.beginPath(); c.moveTo(LANE_MID - 3, py); c.lineTo(LANE_MID - 3, LANE_FLOOR); c.stroke();
  c.fillStyle = '#ffd34d'; rr(c, LANE_MID - 14, py - 10, 28, 11, 3); c.fill();
  c.strokeStyle = 'rgba(0,0,0,.4)'; c.lineWidth = 1; c.stroke();
  if (PLUNGE.pull > 0.02) {
    var mTop = 760, mBot = 1040, mh = mBot - mTop;
    c.fillStyle = 'rgba(0,0,0,.5)'; rr(c, LANE_IN + 10, mTop, 11, mh, 5); c.fill();
    var ph = mh * PLUNGE.pull;
    var pgd2 = c.createLinearGradient(0, mTop, 0, mBot);
    pgd2.addColorStop(0, '#ff5a6e'); pgd2.addColorStop(0.5, '#ffd34d'); pgd2.addColorStop(1, '#5cf08a');
    c.fillStyle = pgd2; rr(c, LANE_IN + 10, mBot - ph, 11, ph, 5); c.fill();
  }

  // ---- الكرات: ظلّ، ذيل حركة، ومعدن مصقول ----
  for (i = 0; i < balls.length; i++) {
    b = balls[i];
    if (b.hole && !b.hole.path) continue;
    if (b.trail) for (var tI = 0; tI < b.trail.length; tI++) {
      var tr = b.trail[tI], al = (tI + 1) / b.trail.length * 0.3;
      c.fillStyle = 'rgba(210,205,235,' + al.toFixed(2) + ')';
      c.beginPath(); c.arc(tr[0], tr[1], BR * (0.35 + 0.5 * al), 0, 6.2832); c.fill();
    }
    c.fillStyle = 'rgba(0,0,0,.5)';
    c.beginPath(); c.arc(b.x + 4, b.y + 5, BR, 0, 6.2832); c.fill();
    var bgd = c.createRadialGradient(b.x - BR * 0.42, b.y - BR * 0.48, 1, b.x, b.y, BR);
    bgd.addColorStop(0, '#ffffff'); bgd.addColorStop(0.3, '#dcd8ea');
    bgd.addColorStop(0.72, '#8a84a4'); bgd.addColorStop(1, '#332d47');
    c.fillStyle = bgd; c.beginPath(); c.arc(b.x, b.y, BR, 0, 6.2832); c.fill();
    c.fillStyle = 'rgba(255,255,255,.85)';
    c.beginPath(); c.arc(b.x - BR * 0.38, b.y - BR * 0.44, BR * 0.2, 0, 6.2832); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1;
    c.beginPath(); c.arc(b.x, b.y, BR - 0.5, 0, 6.2832); c.stroke();
  }
  c.restore();
  drawHud();
}

function drawHud() {
  var c = ctx, top = OY - HUD, right = VW - 8;
  c.save();
  c.textBaseline = 'middle';
  c.fillStyle = 'rgba(8,4,18,.55)'; c.fillRect(0, Math.max(0, top - 2), VW, HUD + 4);
  c.textAlign = 'right';
  c.fillStyle = '#ffd34d';
  c.font = '800 ' + Math.round(HUD * 0.42) + 'px ' + FONT;
  c.fillText(G.score.toLocaleString('en-US'), right, top + HUD * 0.30);
  c.font = '700 ' + Math.round(HUD * 0.2) + 'px ' + FONT;
  c.fillStyle = '#b9a6d8';
  c.fillText(RANKS[G.rank] + '  ·  كرة ' + G.ball + '/' + G.ballsTotal +
    (G.mult ? '  ·  ×' + MULTS[G.mult] : '') + (G.extra ? '  ·  +' + G.extra : ''), right, top + HUD * 0.62);
  c.textAlign = 'left';
  var lx = Math.max(52, OX + 2);
  c.fillStyle = 'rgba(185,166,216,.75)';
  c.fillText('TOP ' + G.best.toLocaleString('en-US'), lx, top + HUD * 0.62);
  for (var i = 0; i < 6; i++) {
    c.fillStyle = i < G.fuel ? (G.fuel <= 2 ? '#ff5a6e' : '#5cf08a') : 'rgba(255,255,255,.16)';
    c.fillRect(lx + i * 9, top + HUD * 0.18, 6, Math.round(HUD * 0.2));
  }
  var txt = (G.infoT > 0 && G.info) || (G.msgT > 0 && G.msg) || missionLine();
  c.fillStyle = G.tiltLock ? '#ff5a6e' : (G.msgT > 0 && G.msg) ? '#ffd34d' : '#e9dcff';
  if (txt) {
    c.textAlign = 'center';
    c.font = '700 ' + Math.round(Math.max(11, HUD * 0.23)) + 'px ' + FONT;
    c.fillText(txt, VW / 2, top + HUD * 0.9);
  }
  c.restore();
}

var BKEY = 'pinball-best', bestSaved = 0, bestAt = 0;
try { G.best = parseInt(localStorage.getItem(BKEY) || '0', 10) || 0; } catch (e) { G.best = 0; }
bestSaved = G.best;
/* أعلى نتيجة تُكتب وهي ترتفع لا عند انتهاء الجولة وحدها: من يُغلق التطبيق في
   منتصف جولة جيدة كان يفقد رقمها. الكتابة مخنوقة بثانية كي لا يُلمس التخزين
   مع كل منفاخ، ومضمونة عند مغادرة الصفحة. هذا نمط snake.html وtetris.html. */
function writeBest() {
  if (G.best <= bestSaved) return;
  try { localStorage.setItem(BKEY, String(G.best)); bestSaved = G.best; } catch (e) {}
}
function bumpBest() {
  if (G.score <= G.best) return;
  G.best = G.score;
  var now = Date.now();
  if (now - bestAt >= 1000) { bestAt = now; writeBest(); }
}
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { writeBest(); if (G.state === 'play') doPause(); stopLoop(); }
  else startLoop();
});
window.addEventListener('pagehide', function () { writeBest(); stopLoop(); });

var $ = function (id) { return document.getElementById(id); };

  $('pauseBtn').disabled = !el ? false : true;

}
function startGame() {
  G.score = 0; G.ball = 1; G.extra = 0; G.rank = 0; G.prog = 0; G.mult = 0;
  G.bonus = 0; G.bonusFlag = false; G.jack = 0; G.jackFlag = false; G.fuel = 6; G.fuelT = 0;
  G.mission = 0; G.sel = 0; G.part = 0; G.cnt = 0; G.tilt = 0; G.tiltLock = false; G.tiltT = 0;
  G.atkLv = 0; G.lauLv = 0; G.flagLv = 0; G.medalLv = 0; G.boostLv = 0; G.multLv = 0;
  G.hyperLv = 0; G.chuteLv = 0; G.extraLit = false; G.wdest = 0; G.comboT = 0;
  G.hazL = [false, false, false]; G.hazR = [false, false, false]; G.wormLit = [false, false, false];
  bankReset('mult'); bankReset('medal'); bankReset('boost');
  for (var i = 0; i < BUMPERS.length; i++) { BUMPERS[i].lit = false; BUMPERS[i].flash = 0; }
  for (i = 0; i < FLAGS.length; i++) { FLAGS[i].rolls = 0; FLAGS[i].spin = 0; FLAGS[i].v = 0; }
  balls.length = 0; ACC = 0;

  show(overSheet);
}
function doPause() { if (G.state !== 'play') return; G.state = 'pause'; musicStop(); show(pauseSheet); }
function doResume() { if (G.state !== 'pause') return; G.state = 'play'; show(null); warm(); musicStart(); }
function toMenu() { G.state = 'menu'; musicStop(); writeBest(); balls.length = 0; show(startSheet); }

  try { localStorage.setItem(SKEY, soundOn ? 'on' : 'off'); } catch (e) {}
  syncMute();
  if (soundOn) { warm(); sfx('click'); if (G.state === 'play') musicStart(); }
  else { musicStop(); if (master) master.gain.value = 0; }
  if (soundOn && master) master.gain.value = 0.9;
});
syncMute();

/* ---------- اللمس: نصف الشاشة لكل مضرب، ومعاً في آنٍ واحد ----------
   pointer events مع setPointerCapture: كل إصبع يُتابَع باسمه حتى لو غادر
   نصفه، فلا يعلق مضرب مرفوعاً حين ينزلق الإبهام. ولا زرّ مضرب مرسوم يسرق
   من الطاولة شيئاً — الشاشة كلها مضربان. */
var pointers = {};
function ballWaiting() {
  for (var i = 0; i < balls.length; i++) if (balls[i].wait) return balls[i];
  return null;
}
function setFlips() {
  var L = false, R = false;
  for (var k in pointers) if (pointers[k].mode === 'flip') { if (pointers[k].side) R = true; else L = true; }
  if (keyL) L = true; if (keyR) R = true;
  if (G.tiltLock || G.state !== 'play') { L = R = false; }
  if (L && !flipL.held) sfx('flip');
  if (R && !flipR.held) sfx('flip');
  flipL.held = L; flipR.held = R;
}
cv.addEventListener('pointerdown', function (e) {
  warm();
  if (G.state !== 'play') return;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  var side = e.clientX > VW / 2 ? 1 : 0;
  var mode = (side === 1 && ballWaiting()) ? 'plunge' : 'flip';
  pointers[e.pointerId] = { side: side, mode: mode, y0: e.clientY };
  if (mode === 'plunge') PLUNGE.pull = 0;
  setFlips();
  e.preventDefault();
}, { passive: false });
cv.addEventListener('pointermove', function (e) {
  var p = pointers[e.pointerId]; if (!p || p.mode !== 'plunge') return;
  PLUNGE.pull = Math.max(0, Math.min(1, (e.clientY - p.y0) / (VH * 0.26)));
  e.preventDefault();
}, { passive: false });
function endPointer(e) {
  var p = pointers[e.pointerId]; if (!p) return;
  delete pointers[e.pointerId];
  if (p.mode === 'plunge') launch();
  setFlips();
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);

function launch() {
  var b = ballWaiting();
  if (!b) { PLUNGE.pull = 0; return; }
  var pw = PLUNGE.pull;
  if (pw < 0.03) pw = 0.03;
  b.wait = false; b.spd = 620 + 1150 * pw; b.dx = 0; b.dy = -1;
  PLUNGE.pull = 0;
  sfx('plunge');
}

// ---------- لوحة المفاتيح ----------
var keyL = false, keyR = false;
addEventListener('keydown', function (e) {
  if (e.repeat) return;
  var k = e.key;
  warm();
  if (k === 'ArrowLeft' || k === 'z' || k === 'Z') { keyL = true; setFlips(); e.preventDefault(); }
  else if (k === 'ArrowRight' || k === '/' || k === '.') { keyR = true; setFlips(); e.preventDefault(); }
  else if (k === ' ') {
    if (G.state === 'menu') startGame();
    else if (ballWaiting()) { PLUNGE.pull = 1; launch(); }
    e.preventDefault();
  }
  else if (k === 'ArrowUp') { nudge((Math.random() - 0.5) * 2); e.preventDefault(); }
  else if (k === 'p' || k === 'P') { G.state === 'play' ? doPause() : doResume(); }
  else if (k === 'Escape') { if (G.state === 'play' || G.state === 'pause') toMenu(); }
});
addEventListener('keyup', function (e) {
  var k = e.key;
  if (k === 'ArrowLeft' || k === 'z' || k === 'Z') { keyL = false; setFlips(); }
  else if (k === 'ArrowRight' || k === '/' || k === '.') { keyR = false; setFlips(); }
});

// ---------- هزّ الجهاز: نَخّة حقيقية، وكثرتها إمالة ----------
function nudge(dir) {
  if (G.state !== 'play' || G.tiltLock) return;
  G.nudgeX = dir * 170; G.nudging = 0.12; shakeX += dir * 9;
  for (var i = 0; i < balls.length; i++) if (!balls[i].hole && !balls[i].wait) kick(balls[i], dir > 0 ? 1 : -1, -0.35, 90);
  sfx('wall', 0.6);
}
var lastShake = 0, motionOn = false;
function onMotion(e) {
  var a = e.accelerationIncludingGravity || e.acceleration; if (!a) return;
  var mag = Math.abs(a.x || 0) + Math.abs(a.y || 0);
  var now = performance.now();
  if (mag > 22 && now - lastShake > 260) { lastShake = now; nudge((a.x || 0) > 0 ? 1 : -1); }
}
function askMotion() {
  if (motionOn || !window.DeviceMotionEvent) return;
  motionOn = true;
  if (typeof DeviceMotionEvent.requestPermission === 'function') {
    DeviceMotionEvent.requestPermission().then(function (r) {
      if (r === 'granted') addEventListener('devicemotion', onMotion);
    }).catch(function () {});
  } else addEventListener('devicemotion', onMotion);
}
$('playBtn').addEventListener('click', askMotion);
$('againBtn').addEventListener('click', askMotion);

// ---------- حلقة اللعب ----------
var raf = 0, last = 0;
function tick(dt) {
  var i, o, b;
  if (G.msgT > 0) { G.msgT -= dt; if (G.msgT <= 0) G.msg = ''; }
  if (G.infoT > 0) G.infoT -= dt;
  if (G.comboT > 0) G.comboT -= dt;
  for (i = 0; i < ROLLS.length; i++) if (ROLLS[i].t > 0) ROLLS[i].t -= dt;
  for (i = 0; i < TARGETS.length; i++) if (TARGETS[i].flash > 0) TARGETS[i].flash -= dt;
  for (i = 0; i < BUMPERS.length; i++) if (BUMPERS[i].flash > 0) BUMPERS[i].flash -= dt;
  for (i = 0; i < SLINGS.length; i++) if (SLINGS[i].lit > 0) SLINGS[i].lit -= dt;
  for (i = 0; i < FLAGS.length; i++) { o = FLAGS[i]; if (o.v > 0.01) { o.spin += o.v * dt; o.v *= 0.94; } }
  shakeX *= 0.82; shakeY *= 0.82;
  if (Math.abs(shakeX) < 0.05) shakeX = 0;
  if (Math.abs(shakeY) < 0.05) shakeY = 0;
  var fast = 0, onTable = false;
  for (i = 0; i < balls.length; i++) {
    b = balls[i];
    if (b.hole || b.wait) continue;
    onTable = true; if (b.spd > fast) fast = b.spd;
    if (!b.trail) b.trail = [];
    b.trail.push([b.x, b.y]); if (b.trail.length > 5) b.trail.shift();
  }
  rollSound(fast, onTable);
  if (G.state !== 'play') return;

  if (G.nudging > 0) { G.nudging -= dt; G.tilt += dt * 4; } else if (G.tilt > 0) G.tilt = Math.max(0, G.tilt - dt);
  if (!G.tiltLock) {
    if (G.tilt > 0.5 && G.infoT <= 0) info('احذر — الطاولة تهتزّ', 1.2);
    if (G.tilt > 1) doTilt();
  } else {
    G.tiltT -= dt;
    if (G.tiltT <= 0) { while (balls.length > 1) balls.pop(); if (balls.length) drainBall(balls[0]); }
  }
  // الوقود يتناقص مع الوقت؛ نفاده يمنع قبول مهمّة جديدة حتى يُعاد ملؤه
  G.fuelT += dt;
  if (G.fuelT > 18) { G.fuelT = 0; if (G.fuel > 0) { G.fuel--; if (G.fuel === 1) info('تحذير — الوقود منخفض', 3); } }
  BLOCKER.on = balls.length > 1;

  ACC += dt; if (ACC > 0.25) ACC = 0.25;
  while (ACC >= STEP) { physics(STEP); ACC -= STEP; }
  musicTick();
}
function frame(now) {
  raf = requestAnimationFrame(frame);
  var dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 1 / 60;
  if (dt > 0.25) dt = 0.25;
  tick(dt);
  draw(now);
}
function startLoop() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } }
function stopLoop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }

addEventListener('resize', layout);
addEventListener('orientationchange', function () { setTimeout(layout, 120); });
layout();
show(startSheet);
startLoop();
</script>
</body>
</html>
