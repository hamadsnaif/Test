<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14171c">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-title" content="Hamad's Games">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="./icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="./icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="./icon-120.png">
<link rel="icon" sizes="192x192" href="./icon-192.png" type="image/png">
<link rel="icon" sizes="512x512" href="./icon-512.png" type="image/png">
<title>Hamad's Games</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded as a print sheet and switched on once it arrives, so it never blocks
     rendering. On a connection that is present but dead this is the difference
     between the shelf appearing at once from the cache and a fullscreen app —
     no URL bar, no stop button — sitting on a blank screen until the request
     finally gives up. The CSS names real fallbacks for both faces. -->
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap"></noscript>
<style>
  :root {
    --case: #14171c;
    --surface: #1c2128;
    --surface-hi: #232a33;
    --edge: #2b323c;
    --ink: #e9eef6;
    --dim: #8d97a6;
    --accent: #e59a4d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--case);
    color: var(--ink);
    font-family: "IBM Plex Sans Arabic", Tahoma, -apple-system, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
    direction: rtl;
  }

  /* ---------- launcher ---------- */
  #shelf {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    padding-inline: 16px;
    padding-block: max(28px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-bottom));
  }
  header { width: 100%; max-width: 520px; text-align: center; }
  #wordmark {
    font-family: Silkscreen, "Courier New", monospace;
    font-weight: 700;
    font-size: clamp(22px, 7vw, 34px);
    letter-spacing: 2px;
    color: var(--ink);
    margin: 0;
    direction: ltr;
  }
  /* لافتة الصالة: الاسم يتلوّن حرفاً حرفاً كأضواء مطاردة على واجهة آلة
     السبعينات — لونٌ واحد يسري على الكلمة لا وميض عشوائي. كل حرف يشغّل
     الحركة نفسها بتأخير سالب متدرّج، فتُقرأ الموجة وهي تعبر الاسم. */
  @keyframes marquee {
    0%,  100% { color: #e59a4d; }   /* كهرماني */
    20%       { color: #e8504a; }   /* أحمر */
    40%       { color: #dd6fc8; }   /* أرجواني */
    60%       { color: #56c6e2; }   /* سماوي */
    80%       { color: #6fd47a; }   /* أخضر */
  }
  #wordmark .ch {
    display: inline-block;
    white-space: pre;               /* المسافة بين الكلمتين حرفٌ مثل غيره */
    color: var(--accent);
    text-shadow: 0 0 14px currentColor;
    animation: marquee 6s linear infinite;
    animation-delay: calc(var(--i) * -0.16s);
  }
  #rule {
    width: 64px; height: 3px;
    /* الخطّ يحمل الألوان نفسها ويزحف تحتها */
    background: linear-gradient(90deg, #e59a4d, #e8504a, #dd6fc8, #56c6e2, #6fd47a, #e59a4d);
    background-size: 300% 100%;
    animation: rule-slide 6s linear infinite;
    margin: 12px auto 10px;
    border-radius: 2px;
  }
  @keyframes rule-slide {
    from { background-position: 100% 0; }
    to   { background-position: -200% 0; }
  }
  /* لا شيء يتحرّك خلف لعبة مفتوحة: المشغّل يغطّي الرفّ، فالحركة تحته إنفاق
     بطارية بلا مشاهد */
  body.playing #wordmark .ch, body.playing #rule { animation-play-state: paused; }
  #tagline { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.6; }

  #list {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .tile {
    position: relative;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 14px 16px 14px 20px;
    background: var(--surface);
    border: 1px solid var(--edge);
    border-radius: 14px;
    color: inherit;
    font: inherit;
    text-align: start;
    cursor: pointer;
    overflow: hidden;
  }
  .tile::before {
    content: "";
    position: absolute;
    inset-inline-start: 0;
    top: 0; bottom: 0;
    width: 5px;
    background: var(--stripe, #6c7a8c);
  }
  .tile:hover, .tile:focus-visible { background: var(--surface-hi); }
  .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tile:active { transform: translateY(1px); }
  .tile .thumb {
    width: 72px; height: 72px;
    border-radius: 8px;
    image-rendering: pixelated;
    display: block;
    border: 1px solid var(--edge);
  }
  .tile .thumb.smooth { image-rendering: auto; }
  .name { margin: 0 0 2px; font-size: 17px; font-weight: 600; }
  .latin {
    font-family: Silkscreen, "Courier New", monospace;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--stripe, #6c7a8c);
    direction: ltr;
    text-align: end;
    display: block;
    margin-bottom: 5px;
  }
  .desc { margin: 0; font-size: 13px; line-height: 1.5; color: var(--dim); }
  .chev { color: var(--dim); font-size: 22px; line-height: 1; }

  footer {
    width: 100%; max-width: 520px;
    color: var(--dim);
    font-size: 12.5px;
    line-height: 1.7;
    text-align: center;
    margin-top: auto;
    padding-top: 8px;
  }

  /* ---------- player ----------
     A slim bar carries the way back. The three games all put controls in
     their own top corners, so a floating button would sit on top of one of
     them; a bar of its own never collides with anything. */
  #player {
    position: fixed;
    inset: 0;
    background: var(--case);
    z-index: 50;
    display: flex;
    flex-direction: column;
  }
  #player[hidden] { display: none !important; }
  #bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    height: 36px;
    box-sizing: content-box;
    padding-top: env(safe-area-inset-top);
    /* Physical sides on purpose. This document is dir="rtl", so padding-inline
       start/end map to the physical RIGHT/LEFT — which sends the right-edge
       inset to the left, where there is no cutout, and pins the back button
       6px from the physical right edge where the display's rounded corner
       clips it in landscape. */
    padding-left: max(10px, env(safe-area-inset-left));
    padding-right: max(10px, env(safe-area-inset-right));
    background: var(--surface);
    border-bottom: 1px solid var(--edge);
  }
  #back {
    min-width: 58px; height: 30px;
    border-radius: 9px;
    border: 1px solid var(--edge);
    background: var(--case);
    color: var(--ink);
    font-size: 13px;
    font-family: inherit;
    line-height: 1;
    padding: 0 10px;
    cursor: pointer;
    flex: 0 0 auto;
  }
  #back:active { background: var(--surface-hi); }
  #back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #playing-name { font-size: 13.5px; font-weight: 500; color: var(--dim); }
  #frame { flex: 1 1 auto; width: 100%; border: 0; display: block; min-height: 0; }
  body.playing { overflow: hidden; }

  @media (max-width: 400px) {
    .tile { gap: 11px; padding: 12px 12px 12px 16px; }
    .tile .thumb { width: 60px; height: 60px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile:active { transform: none; }
    #wordmark .ch { animation: none; color: var(--ink); text-shadow: none; }
    #rule { animation: none; background: var(--accent); }
  }

  /* ---------- install helper ----------
     Most people who are sent a link never find "Add to Home Screen" on their
     own, and on iOS the browser is not allowed to offer it. So the shelf asks
     once, in one line, and hands over the steps for the phone in the hand.
     It exists only for a visitor who has not installed it: the moment the page
     runs as an app the row is never rendered. */
  #install { width: 100%; max-width: 520px; display: flex; gap: 8px; }
  #install[hidden] { display: none; }
  #installBtn {
    flex: 1 1 auto;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    min-height: 46px; padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid rgba(229,154,77,.45);
    background: linear-gradient(180deg, rgba(229,154,77,.16), rgba(229,154,77,.08));
    color: var(--ink); font: inherit; font-size: 14.5px; font-weight: 600;
    cursor: pointer;
  }
  #installBtn:active { background: rgba(229,154,77,.22); }
  #installBtn:focus-visible, #installX:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #installBtn svg { flex: none; width: 18px; height: 18px; fill: var(--accent); }
  #installX {
    flex: none; width: 46px; min-height: 46px;
    border-radius: 12px; border: 1px solid var(--edge);
    background: var(--surface); color: var(--dim);
    font: inherit; font-size: 15px; line-height: 1; cursor: pointer;
  }
  #installX:active { background: var(--surface-hi); }
  #howLink {
    background: none; border: 0; padding: 0; margin: 0;
    color: var(--dim); font: inherit; font-size: inherit;
    text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
  }
  #howLink:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- the steps sheet ---------- */
  #guide {
    position: fixed; inset: 0; z-index: 60;
    display: flex; align-items: flex-end; justify-content: center;
    background: rgba(6,8,11,.62);
    padding: 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  #guide[hidden] { display: none !important; }
  #sheet {
    width: 100%; max-width: 520px;
    max-height: calc(100% - 24px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--surface);
    border: 1px solid var(--edge);
    border-radius: 16px;
    padding: 16px 16px 18px;
  }
  @media (min-height: 620px) { #guide { align-items: center; } }
  #guideHead { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  #guideTitle { margin: 0; font-size: 17px; font-weight: 600; flex: 1 1 auto; }
  #guideX {
    flex: none; width: 34px; height: 34px;
    border-radius: 9px; border: 1px solid var(--edge);
    background: var(--case); color: var(--dim);
    font: inherit; font-size: 15px; line-height: 1; cursor: pointer;
  }
  #guideX:active { background: var(--surface-hi); }
  #guideX:focus-visible, .tab:focus-visible, #shareBtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab {
    flex: 1 1 0; min-height: 40px;
    border-radius: 10px; border: 1px solid var(--edge);
    background: var(--case); color: var(--dim);
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    direction: ltr;
  }
  .tab[aria-selected="true"] { background: var(--surface-hi); color: var(--ink); border-color: rgba(229,154,77,.5); }
  #inapp {
    margin: 0 0 12px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid rgba(229,154,77,.4);
    background: rgba(229,154,77,.1);
    font-size: 13px; line-height: 1.7; color: var(--ink);
  }
  #inapp[hidden] { display: none; }
  #steps { margin: 0; padding: 0; list-style: none; counter-reset: step; }
  #steps li {
    counter-increment: step;
    display: grid;
    grid-template-columns: 26px 1fr;
    gap: 10px;
    align-items: start;
    padding: 9px 0;
    font-size: 14px; line-height: 1.75;
    border-bottom: 1px solid var(--edge);
  }
  /* نصّ الخطوة في خلية واحدة: لولاه لصار كل <b> و<span> خليّةً مستقلّة في
     الشبكة فتتراصّ الكلمات سطراً تحت سطر */
  #steps .t { grid-column: 2; min-width: 0; }
  #steps li:last-child { border-bottom: 0; }
  #steps li::before {
    content: counter(step);
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--case); border: 1px solid var(--edge);
    color: var(--accent);
    font-size: 12.5px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    direction: ltr;
  }
  /* الرموز داخل الخطوة تُرسم هنا لا تُكتب: أيقونة المشاركة في iOS وزرّ القائمة
     في أندرويد، كي يبحث القارئ عن الشكل نفسه في شريط متصفّحه */
  #steps .ico {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; vertical-align: -6px; margin: 0 2px;
    border-radius: 5px; background: var(--case); border: 1px solid var(--edge);
  }
  #steps .ico svg { width: 13px; height: 13px; fill: var(--ink); }
  #steps b { font-weight: 600; color: var(--ink); }
  /* اسم الخيار بالإنجليزية كما يظهر في المتصفّح: يبقى قطعة واحدة لا ينكسر
     نصفها إلى السطر التالي */
  #steps .en { direction: ltr; unicode-bidi: isolate; white-space: nowrap; color: var(--dim); font-size: 12.5px; }
  #guideNote { margin: 12px 0 0; font-size: 12.5px; line-height: 1.7; color: var(--dim); }
  #shareBtn {
    width: 100%; min-height: 44px; margin-top: 12px;
    border-radius: 11px; border: 1px solid var(--edge);
    background: var(--case); color: var(--ink);
    font: inherit; font-size: 14px; cursor: pointer;
  }
  #shareBtn:active { background: var(--surface-hi); }
</style>
</head>
<body>
<div id="shelf">
  <header>
    <h1 id="wordmark">HAMAD'S GAMES</h1>
    <div id="rule"></div>
    <p id="tagline">ألعاب من زمن هواتف نوكيا، أُعيد بناؤها للمتصفح. اختر لعبة لتبدأ.</p>
  </header>

  <div id="install" hidden>
    <button id="installBtn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a1 1 0 0 1 1 1v8.59l2.3-2.3a1 1 0 1 1 1.4 1.42l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.42l2.3 2.3V4a1 1 0 0 1 1-1Zm-7 12a1 1 0 0 1 1 1v2h12v-2a1 1 0 1 1 2 0v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1Z"/></svg>
      <span id="installLabel">ثبّتها على شاشتك الرئيسية</span>
    </button>
    <button id="installX" type="button" aria-label="إخفاء هذا الاقتراح">✕</button>
  </div>

  <div id="list"></div>

  <footer>
    كل لعبة تعمل مستقلة بأصواتها وحفظ نتائجها، وبلا إنترنت بعد أول فتح.
    <button id="howLink" type="button">كيف أضيفها إلى الشاشة الرئيسية؟</button>
  </footer>
</div>

<div id="guide" hidden role="dialog" aria-modal="true" aria-labelledby="guideTitle">
  <div id="sheet">
    <div id="guideHead">
      <h2 id="guideTitle">أضِفها إلى الشاشة الرئيسية</h2>
      <button id="guideX" type="button" aria-label="إغلاق">✕</button>
    </div>
    <div id="tabs" role="tablist" aria-label="نوع الجهاز">
      <button class="tab" type="button" role="tab" data-os="ios" aria-selected="false">iPhone</button>
      <button class="tab" type="button" role="tab" data-os="android" aria-selected="false">Android</button>
    </div>
    <p id="inapp" hidden></p>
    <ol id="steps"></ol>
    <p id="guideNote">بعدها تفتح كتطبيق بملء الشاشة، وتعمل بلا إنترنت، وتصلها التحديثات وحدها.</p>
    <button id="shareBtn" type="button" hidden></button>
  </div>
</div>

<div id="player" hidden>
  <div id="bar">
    <button id="back" type="button" aria-label="رجوع إلى قائمة الألعاب">رجوع</button>
    <span id="playing-name"></span>
  </div>
</div>

<script>
(function () {
  'use strict';

  // The shelf is data driven. REGISTRY is the copy of games.json baked in at
  // build time so the first paint never waits on the network; when the page is
  // served from a real origin it then re-reads games.json and redraws if the
  // file has changed. Adding a game therefore means dropping its page next to
  // this one and adding an entry to games.json — no code change, no rebuild.
  const REGISTRY = {"version": 1, "games": [{"id": "bounce", "file": "bounce.html", "ar": "الكرة الحمراء", "en": "BOUNCE", "stripe": "#e8231f", "desc": "المراحل الإحدى عشرة الأصلية برسومها وفيزيائها، مع حفظ التقدم واختيار نظام التحكم.", "thumb": {"builtin": "bounce"}}, {"id": "snake", "file": "snake.html", "ar": "الدودة", "en": "SNAKE II", "stripe": "#9bbc0f", "desc": "أسطورة نوكيا على شاشة خضراء، بسرعات متدرجة وأعلى نتيجة محفوظة.", "thumb": {"builtin": "snake"}}, {"id": "tetris", "file": "tetris.html", "ar": "تتريس", "en": "TETRIS", "stripe": "#e0a45e", "desc": "القطع الكلاسيكية على جهاز عاجي بأزرار كبيرة، بموسيقى ومؤثرات.", "thumb": {"builtin": "tetris"}}, {"id": "pinball", "file": "pinball.html", "ar": "بينبول الفضاء", "en": "PINBALL", "stripe": "#c46bff", "desc": "طاولة الملاح الفضائي: تسع رتب وسبع عشرة مهمّة، بفيزياء حقيقية ومضربين على نصفَي الشاشة.", "thumb": {"builtin": "pinball"}}]};
  const SOURCES = {};   // artifact build only: the games carried inline
  // Whether this page can read its neighbours. The build says what it intends,
  // but a page opened over file:// has no origin to fetch from whatever the
  // build thought, so the protocol gets the final say.
  const LIVE = true && /^https?:$/.test(location.protocol);

  // ------------------------------------------------------------------
  // Thumbnails: each one is a 32x32 pixel scene drawn from the game it
  // opens, so the tile shows the world you are about to enter.
  // ------------------------------------------------------------------
  function px(c, x, y, w, h, color) { c.fillStyle = color; c.fillRect(x, y, w, h); }

  /* Each scene is a loop rather than a still: a few seconds of the game
     actually being played, drawn at 32x32 from the same palette as the game
     it opens. The frame number comes from one clock shared by all the tiles
     (see the ticker below), so a scene is a pure function of f and nothing
     here holds state of its own. */

  // Bounce: the ball hops along the bricks and takes the ring on its way.
  const BOUNCE_T = 36;
  function drawBounce(c, f) {
    const t = (f | 0) % BOUNCE_T;
    px(c, 0, 0, 32, 32, '#b0e0f0');
    for (let x = 0; x < 32; x += 8) {
      px(c, x, 24, 8, 8, '#c8722a');
      px(c, x, 24, 7, 3, '#e59a4d');
      px(c, x, 28, 7, 3, '#e59a4d');
    }
    px(c, 0, 24, 32, 1, '#8b4a16');
    // There and back rather than a lap: a loop that ends where it began has
    // nothing to jump over when it restarts.
    const u = t / BOUNCE_T, out = u < 0.5;
    const bx = Math.round(6 + 21 * (out ? u * 2 : 2 - u * 2));
    const hop = (t % 9) / 9;                         // four hops, the turn on a landing
    const by = Math.round(17 - 9 * Math.sin(Math.PI * hop));
    // the ring is taken on the way out and is back for the next pass
    if (out && bx < 22) { px(c, 25, 9, 3, 10, '#e8b53a'); px(c, 26, 10, 1, 8, '#fff2b0'); }
    c.fillStyle = '#8f0d0a';
    c.beginPath(); c.arc(bx, by, 7, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#e8231f';
    c.beginPath(); c.arc(bx, by, 6, 0, Math.PI * 2); c.fill();
    px(c, bx - 4, by - 5, 3, 2, '#ff8c8c');
  }

  // Snake: a lap of the screen, one bite per lap, a segment longer each time.
  const SNAKE_PATH = (function () {
    const p = [];
    for (let x = 1; x <= 6; x++) p.push([x, 1]);
    for (let y = 2; y <= 6; y++) p.push([6, y]);
    for (let x = 5; x >= 1; x--) p.push([x, 6]);
    for (let y = 5; y >= 2; y--) p.push([1, y]);
    return p;                                        // 20 cells of 4px
  })();
  function drawSnake(c, f) {
    const P = SNAKE_PATH, N = P.length;
    const t = (f | 0) % (N * 3);
    const lap = Math.floor(t / N), head = t % N;
    const len = 5 + lap, food = (7 + lap * 6) % N;
    px(c, 0, 0, 32, 32, '#9bbc0f');
    if (head < food) px(c, P[food][0] * 4 + 1, P[food][1] * 4 + 1, 2, 2, '#0f380f');
    for (let i = len - 1; i >= 0; i--) {
      const cell = P[(head - i + N * 4) % N];
      px(c, cell[0] * 4, cell[1] * 4, 4, 4, '#0f380f');
      if (i) px(c, cell[0] * 4, cell[1] * 4, 3, 3, '#306230');
    }
    px(c, P[head][0] * 4 + 1, P[head][1] * 4 + 1, 1, 1, '#9bbc0f');   // the eye
  }

  // Tetris: a piece drops into the gap, the row lights up and goes.
  const TETRIS_T = 24;
  function drawTetris(c, f) {
    const t = (f | 0) % TETRIS_T;
    const CY = '#5ab7c4', AM = '#e0a45e', YE = '#e3c65f', GR = '#7fbe74', VI = '#b48bd6', RE = '#df8179';
    function cell(i, j, col) {
      const x = 4 + i * 6, y = 2 + j * 6;
      px(c, x, y, 6, 6, col);
      px(c, x, y, 6, 1, '#fffaf0');
      px(c, x, y + 5, 6, 1, 'rgba(0,0,0,.35)');
    }
    px(c, 0, 0, 32, 32, '#1a1813');
    if (t < 12) {                                    // falling
      cell(0, 3, VI); cell(3, 3, GR);
      cell(0, 4, AM); cell(1, 4, YE); cell(3, 4, CY);
      const drop = Math.min(3, (t / 3) | 0);
      cell(2, drop, RE); cell(2, drop + 1, RE);
    } else if (t < 16) {                             // the full row flashes
      cell(0, 3, VI); cell(2, 3, RE); cell(3, 3, GR);
      const lit = t % 2 === 0, row = [AM, YE, RE, CY];
      for (let i = 0; i < 4; i++) cell(i, 4, lit ? '#fffaf0' : row[i]);
    } else {                                         // cleared, what was above has fallen (8 frames)
      cell(0, 4, VI); cell(2, 4, RE); cell(3, 4, GR);
    }
  }

  // Pinball: the ball is plunged up the lane, loops the dome, is thrown by the
  // bumper, and comes back off the flipper. One lap of the table per loop.
  const PIN_PATH = [
    [28, 26], [28, 22], [28, 18], [28, 14], [28, 10], [27, 7], [25, 5], [22, 4],
    [19, 4], [16, 5], [14, 7], [13, 10], [14, 13], [16, 16], [18, 19], [20, 22],
    [21, 25], [22, 27], [22, 27], [23, 25], [25, 21], [26, 17], [27, 13],
    [27, 10], [26, 8], [27, 11], [28, 15], [28, 19], [28, 22], [28, 25],
  ];
  function drawPinball(c, f) {
    const t = (f | 0) % PIN_PATH.length;
    px(c, 0, 0, 32, 32, '#140a24');
    px(c, 2, 3, 28, 29, '#2a1550');                  // الملعب
    for (const s of [[4, 6], [25, 3], [8, 24], [20, 29]]) px(c, s[0], s[1], 1, 1, '#f4ecff');
    px(c, 2, 3, 28, 1, '#5de1ff'); px(c, 2, 3, 1, 29, '#5de1ff'); px(c, 29, 3, 1, 29, '#5de1ff');
    px(c, 26, 8, 1, 24, '#5de1ff');                  // فاصل ممر القاذف
    // حلقة الرتبة، ثم المنفاخ وقد يُضيء لحظة الإصابة
    for (const d of [[14, 17], [17, 20], [14, 23], [11, 20]]) px(c, d[0], d[1], 1, 1, '#ffd34d');
    const hit = t === 11;
    px(c, 11, 8, 5, 5, hit ? '#fff2b0' : '#a35ce0');
    px(c, 12, 9, 3, 3, hit ? '#ffd34d' : '#e9d0ff');
    // المضربان: يرتفعان في إطارات الضربة
    const up = t >= 17 && t <= 19;
    px(c, 8, up ? 27 : 28, 3, 2, '#ff6fa8');
    px(c, 11, up ? 26 : 29, 3, 2, '#ff6fa8');
    px(c, 21, up ? 27 : 28, 3, 2, '#ff6fa8');
    px(c, 18, up ? 26 : 29, 3, 2, '#ff6fa8');
    const b = PIN_PATH[t];
    px(c, b[0] - 1, b[1] - 1, 3, 3, '#8d87a8');
    px(c, b[0] - 1, b[1] - 1, 2, 2, '#ffffff');
  }

  const BUILTIN = { bounce: drawBounce, snake: drawSnake, tetris: drawTetris, pinball: drawPinball };

  /* A future game does not have to ship a draw function. Its "thumb" may be:
       {"builtin": "bounce"}                       one of the four above
       {"bg": "#123", "rects": [[x,y,w,h,"#c"]]}   pixels straight from JSON
       "thumbs/mygame.png"                         any image next to the page
     and with no "thumb" at all the tile falls back to the game's initial on
     its own stripe colour, which always looks deliberate. */
  const HEX = /^#(?:[0-9a-fA-F]{3,4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/;   // what CSS actually accepts
  function colour(v, fallback) { return typeof v === 'string' && HEX.test(v) ? v : fallback; }

  function drawFromRects(c, thumb, g) {
    px(c, 0, 0, 32, 32, colour(thumb.bg, '#14171c'));
    const rects = Array.isArray(thumb.rects) ? thumb.rects : [];
    for (const r of rects) {
      if (!Array.isArray(r) || r.length < 5) continue;
      const [x, y, w, h] = r;
      if (![x, y, w, h].every(n => typeof n === 'number' && isFinite(n))) continue;
      px(c, x, y, w, h, colour(r[4], g.stripe));
    }
  }

  // Drawn at 4x and shown at 32 CSS px worth of tile, because this is the
  // default for a game that ships no artwork and a nearest neighbour blow up of
  // an antialiased letter looks like a mistake rather than a choice.
  const INIT_SCALE = 4;
  function drawInitial(c, g) {
    const s = INIT_SCALE;
    c.canvas.width = c.canvas.height = 32 * s;
    c.imageSmoothingEnabled = true;
    px(c, 0, 0, 32 * s, 32 * s, '#1b1f26');
    px(c, 0, 0, 32 * s, 3 * s, g.stripe);
    c.fillStyle = g.stripe;
    c.font = 'bold ' + (18 * s) + 'px system-ui, sans-serif';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText(((g.en || g.ar || '?').trim()[0] || '?').toUpperCase(), 16 * s, 19 * s);
    c.canvas.classList.add('smooth');
  }

  function thumbFor(g) {
    if (typeof g.thumb === 'string' && isSafePath(g.thumb)) {
      const img = document.createElement('img');
      img.className = 'thumb';
      img.alt = '';
      img.decoding = 'async';
      img.src = g.thumb;
      // a missing image file must not leave a broken tile
      img.addEventListener('error', () => { img.replaceWith(canvasThumb(g, true)); }, { once: true });
      return img;
    }
    return canvasThumb(g, false);
  }

  /* One clock for every moving tile. Three canvases each running their own
     timer would be three wake ups per frame for 32x32 pixels; this is one,
     at ten frames a second, and it stops dead whenever nobody can see it —
     a game is open over the shelf, or the tab is in the background. Anyone
     who asked their system for less motion gets the first frame, still. */
  const moving = [];
  let thumbFrame = 0, ticking = false, lastAt = 0;
  const FRAME_MS = 100;
  const stillOnly = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  function paintThumbs() { for (const m of moving) m.draw(m.ctx, thumbFrame); }
  function tickThumbs(now) {
    if (!ticking) return;
    requestAnimationFrame(tickThumbs);
    if (now - lastAt < FRAME_MS) return;
    lastAt = now;
    thumbFrame++;
    paintThumbs();
  }
  function startThumbs() {
    if (stillOnly || ticking || !moving.length) return;
    if (document.hidden || !player.hidden) return;
    ticking = true; lastAt = 0;
    requestAnimationFrame(tickThumbs);
  }
  function stopThumbs() { ticking = false; }

  function canvasThumb(g, forceInitial) {
    const cv = document.createElement('canvas');
    cv.className = 'thumb';
    cv.width = cv.height = 32;
    const c = cv.getContext('2d');
    const t = g.thumb;
    if (!forceInitial && t && typeof t === 'object' && BUILTIN[t.builtin]) {
      const draw = BUILTIN[t.builtin];
      draw(c, thumbFrame);
      if (!stillOnly) moving.push({ ctx: c, draw: draw });
    }
    else if (!forceInitial && t && typeof t === 'object' && Array.isArray(t.rects)) drawFromRects(c, t, g);
    else drawInitial(c, g);
    return cv;
  }

  // ------------------------------------------------------------------
  // Registry: read games.json defensively. It is a file a human edits, so a
  // typo in one entry must cost that entry only, never the whole shelf.
  // ------------------------------------------------------------------
  const ID = /^[a-z0-9][a-z0-9_-]{0,31}$/i;

  function isSafePath(p) {
    return typeof p === 'string' && p.length > 0 && p.length < 256 &&
      !/^[a-z][a-z0-9+.-]*:/i.test(p) &&   // no http:, data:, javascript:
      !p.startsWith('/') && !p.startsWith('\\') &&
      !p.split(/[\\/]/).includes('..');
  }

  const MAX_GAMES = 48;
  function text(v, cap) {
    return typeof v === 'string' ? v.trim().slice(0, cap) : '';
  }

  function clean(raw) {
    if (!raw || typeof raw !== 'object') return null;
    const id = String(raw.id || '');
    if (!ID.test(id)) return null;
    const file = raw.file || (id + '.html');
    if (!isSafePath(file)) return null;
    return {
      id: id.toLowerCase(),       // so Snake and snake cannot both get a tile
      file: file,
      ar: text(raw.ar, 60) || id,
      en: text(raw.en, 24),
      desc: text(raw.desc, 200),  // a pasted essay must not wreck the layout
      stripe: colour(raw.stripe, '#6c7a8c'),
      thumb: raw.thumb
    };
  }

  function parse(data) {
    const arr = Array.isArray(data) ? data : (data && Array.isArray(data.games) ? data.games : null);
    if (!arr) return null;
    const out = [];
    const seen = new Set();
    let dropped = 0;
    for (const raw of arr) {
      if (out.length >= MAX_GAMES) break;
      const g = clean(raw);
      if (!g || seen.has(g.id)) { dropped++; continue; }
      seen.add(g.id);
      out.push(g);
    }
    // editing games.json from a phone, a silently missing tile is impossible to
    // debug; say so where anyone who looks will find it
    if (dropped) console.warn('games.json: ' + dropped + ' entry/entries ignored (bad id, unsafe file path, or duplicate)');
    return out.length ? out : null;
  }

  let GAMES = parse(REGISTRY) || [];

  // ------------------------------------------------------------------
  // Launcher
  // ------------------------------------------------------------------
  const list = document.getElementById('list');
  const shelf = document.getElementById('shelf');
  const player = document.getElementById('player');
  const bar = document.getElementById('bar');
  const back = document.getElementById('back');
  const playingName = document.getElementById('playing-name');

  function render() {
    moving.length = 0;                 // the tiles are about to be replaced
    const tiles = GAMES.map(g => {
      const tile = document.createElement('button');
      tile.type = 'button';
      tile.className = 'tile';
      tile.style.setProperty('--stripe', g.stripe);
      tile.setAttribute('aria-label', 'تشغيل لعبة ' + g.ar);
      // aria-label replaces the tile's contents for a screen reader, so the
      // description has to be pointed at explicitly or it is never announced
      tile.setAttribute('aria-describedby', 'desc-' + g.id);

      const mid = document.createElement('div');
      const h = document.createElement('p');
      h.className = 'name';
      h.textContent = g.ar;
      const en = document.createElement('span');
      en.className = 'latin';
      en.textContent = g.en;
      const d = document.createElement('p');
      d.className = 'desc';
      d.id = 'desc-' + g.id;
      d.textContent = g.desc;
      mid.append(h, en, d);

      const chev = document.createElement('span');
      chev.className = 'chev';
      chev.setAttribute('aria-hidden', 'true');
      chev.textContent = '\u203a';   // mirrored under dir=rtl, so this draws as ‹

      tile.append(thumbFor(g), mid, chev);
      tile.addEventListener('click', () => open(g.id));
      return tile;
    });
    list.replaceChildren(...tiles);
    startThumbs();
  }
  render();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopThumbs(); else startThumbs();
  });

  let decoder = null;
  function decode(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    decoder = decoder || new TextDecoder('utf-8');
    return decoder.decode(bytes);
  }

  // A fresh iframe per launch: the first load of a new frame does not add a
  // history entry, and removing it on exit stops the game's loop and audio
  // outright, so every game starts clean and nothing keeps running behind the
  // launcher.
  function open(id) {
    // inert already keeps the tiles out of reach while a game is up, but the
    // invariant is worth stating outright: opening a second game over the first
    // would push a history entry that close() never pops, and the back gesture
    // would be dead for the rest of the session.
    if (!player.hidden) return;
    const game = GAMES.find(g => g.id === id);
    if (!game) return;
    const inline = SOURCES[id];
    playingName.textContent = game.ar;
    const frame = document.createElement('iframe');
    frame.id = 'frame';
    frame.title = 'اللعبة';
    frame.setAttribute('allow', 'autoplay');
    if (inline && inline.b64) frame.srcdoc = decode(inline.b64);
    else frame.src = game.file;
    player.replaceChildren(bar, frame);
    document.body.classList.add('playing');
    player.hidden = false;
    // The overlay blocks pointers but not a screen reader or programmatic
    // focus, so without this the tiles under the game stay announceable and
    // launchable — and launching one from there pushes a second history entry
    // that close() never pops.
    shelf.inert = true;
    stopThumbs();                      // the shelf is covered; stop repainting it
    history.pushState({ hg: id }, '');
    setTimeout(() => { try { frame.contentWindow.focus(); } catch (e) { /* cross document */ } }, 60);
  }

  function close(fromPop) {
    if (player.hidden) return;
    player.replaceChildren(bar);
    player.hidden = true;
    shelf.inert = false;
    document.body.classList.remove('playing');
    startThumbs();                     // the shelf is visible again
    if (!fromPop && history.state && history.state.hg) history.back();
    // anything that had to wait for the game to end happens now
    if (pendingRender) { pendingRender = false; render(); }
    if (pendingReload) applyUpdate();
  }

  // Touching the bar's empty space used to move focus out of the game, and a
  // game that watches for blur — Tetris does — would pause itself. Only the
  // dead space is neutralised, so the back button still focuses and clicks.
  bar.addEventListener('mousedown', e => {
    if (!e.target.closest('button')) e.preventDefault();
  });

  back.addEventListener('click', () => close(false));
  window.addEventListener('popstate', () => close(true));

  // ------------------------------------------------------------------
  // Staying current. Someone who added the shelf to their home screen should
  // see new games and fixes without doing anything, so the page re-reads
  // games.json on every launch and asks the service worker to re-check
  // itself. A reload is only ever applied on the shelf, never mid game.
  // ------------------------------------------------------------------
  let signature = JSON.stringify(GAMES);

  function refreshRegistry(retry) {
    if (!LIVE) return Promise.resolve();
    return fetch('games.json', { cache: 'no-store' })
      .then(r => (r.ok ? r.json() : Promise.reject(new Error('http ' + r.status))))
      .then(data => {
        const next = data && parse(data);
        if (!next) {
          console.warn('games.json: nothing usable in it, keeping the list already on screen');
          return;
        }
        const sig = JSON.stringify(next);
        if (sig === signature) return;
        signature = sig;
        GAMES = next;
        // never reshuffle the shelf under someone who is mid game; close() draws it
        if (player.hidden) render(); else pendingRender = true;
        precache(next);
      })
      .catch(() => {
        // One slow moment should not cost a whole session: the shelf already
        // drew from the baked in list, so try once more a few seconds later
        // rather than waiting for the next time the app is reopened.
        if (retry !== false) setTimeout(() => refreshRegistry(false), 5000);
      });
  }

  // A game added to games.json after this build is not in the worker's list of
  // files to keep offline, so hand it over once it is known.
  function precache(games) {
    const sw = navigator.serviceWorker;
    if (!sw) return;
    const urls = [];
    for (const g of games) {
      urls.push(g.file);
      if (typeof g.thumb === 'string') urls.push(g.thumb);   // keep artwork offline too
    }
    // .ready rather than .controller: on a first ever visit there is no
    // controller yet, and that is precisely the visit where nothing is cached.
    sw.ready.then(reg => {
      const worker = reg.active || sw.controller;
      if (worker) worker.postMessage({ type: 'cache', urls: urls });
    }).catch(() => { /* no worker on this origin */ });
  }

  let pendingRender = false;
  let pendingReload = false;
  let reloading = false;

  // A flag on this page is not enough to stop a reload loop, because a reload
  // hands the next page a fresh flag. GitHub Pages sits behind a CDN, so for a
  // few minutes after a deploy two edges can disagree about sw.js and each
  // load can look like an update to the one before. A stamp that survives the
  // reload turns that into at most one reload a minute.
  const STAMP = 'hg:autoreload';
  function recentlyReloaded() {
    try {
      const t = Number(sessionStorage.getItem(STAMP) || 0);
      return isFinite(t) && Date.now() - t < 60000;
    } catch (e) { return false; }   // private mode, storage blocked
  }

  function applyUpdate() {
    pendingReload = false;
    if (reloading || recentlyReloaded()) return;
    reloading = true;
    try { sessionStorage.setItem(STAMP, String(Date.now())); } catch (e) { /* not fatal */ }
    location.reload();
  }

  if (LIVE && 'serviceWorker' in navigator) {
    // Is this tab under a worker yet? The first one arriving is an install:
    // nothing on screen is stale, so it must not cause a reload. Every later
    // handover is a genuinely new version replacing the one that drew this
    // page. Tracking it as it changes distinguishes the two, where reading it
    // once at startup would call both of them "first" in a tab that was opened
    // before any worker existed.
    let controlled = !!navigator.serviceWorker.controller;
    const UPDATE_THROTTLE = 15000;   // guards against flicking between apps, no more
    let reg = null;
    let lastCheck = 0;

    const check = () => {
      if (!reg || !player.hidden) return;   // not while someone is playing
      const now = Date.now();
      if (now - lastCheck < UPDATE_THROTTLE) return;
      lastCheck = now;
      reg.update().catch(() => {});
    };

    // updateViaCache:'none' keeps the browser's HTTP cache away from sw.js, so
    // a new worker is noticed on the first launch after a deploy rather than
    // whenever the cache entry happens to expire.
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then(r => { reg = r; lastCheck = Date.now(); precache(GAMES); })
      .catch(() => {});

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      const wasControlled = controlled;
      controlled = true;
      if (!wasControlled) return;                             // the install, not an update
      if (!player.hidden) { pendingReload = true; return; }   // someone is playing
      applyUpdate();
    });

    // An app resumed from the iOS app switcher performs no navigation, so the
    // browser never runs its own update check. These three are the only moments
    // a returning user gives us to notice that something was published.
    const resumed = () => {
      if (document.hidden) return;
      check();
      refreshRegistry();
    };
    document.addEventListener('visibilitychange', resumed);
    window.addEventListener('pageshow', resumed);          // includes bfcache restores
    window.addEventListener('online', resumed);
  }


  // ------------------------------------------------------------------
  // The marquee: one span per character so the colour can travel along the
  // name instead of flashing the whole of it at once. The heading keeps its
  // text in an aria-label because a screen reader would otherwise spell the
  // letters out one at a time.
  // ------------------------------------------------------------------
  (function marquee() {
    const mark = document.getElementById('wordmark');
    if (!mark) return;
    const text = mark.textContent;
    mark.setAttribute('aria-label', text);
    const frag = document.createDocumentFragment();
    Array.prototype.forEach.call(text, (chr, i) => {
      const span = document.createElement('span');
      span.className = 'ch';
      span.setAttribute('aria-hidden', 'true');
      span.style.setProperty('--i', String(i));
      span.textContent = chr;
      frag.appendChild(span);
    });
    mark.replaceChildren(frag);
  })();

  // ------------------------------------------------------------------
  // Adding it to the home screen
  //
  // The people this link gets sent to are the ones who benefit most from the
  // app being installed - fullscreen, offline, an icon among their own apps -
  // and the ones least likely to find the option. Android can offer a real
  // install prompt, which we forward; iOS forbids it entirely, so all we can
  // do there is show the exact taps. Whoever already installed it never sees
  // any of this: a page running as an app renders the row not at all.
  // ------------------------------------------------------------------
  const installRow = document.getElementById('install');
  const installBtn = document.getElementById('installBtn');
  const installLabel = document.getElementById('installLabel');
  const installX = document.getElementById('installX');
  const howLink = document.getElementById('howLink');
  const guide = document.getElementById('guide');
  const guideX = document.getElementById('guideX');
  const stepsEl = document.getElementById('steps');
  const inappEl = document.getElementById('inapp');
  const shareBtn = document.getElementById('shareBtn');
  const tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  const DISMISS = 'hamads-games-install-hidden';

  const UA = navigator.userAgent || '';
  // iPadOS reports itself as a Mac; the touch points give it away.
  const isIOS = /iPad|iPhone|iPod/.test(UA) ||
                (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/.test(UA);
  // Facebook's and Instagram's in-app browsers have no "add to home screen" at
  // all, so the first step there is to leave them. WebViews that are not one of
  // these are left alone rather than guessed at.
  const inApp = /FBAN|FBAV|FB_IAB|Instagram|Line\/|MicroMessenger|Snapchat/.test(UA);

  function installed() {
    try {
      if (window.matchMedia && matchMedia('(display-mode: standalone)').matches) return true;
      if (window.matchMedia && matchMedia('(display-mode: fullscreen)').matches) return true;
    } catch (e) { /* no matchMedia */ }
    return navigator.standalone === true;
  }

  let promptEvent = null;               // Android's real install prompt, if offered

  const icon = {
    // iOS share: a box with an arrow leaving the top
    share: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5a1 1 0 0 1 .7.3l3 3a1 1 0 1 1-1.4 1.4L13 5.9V15a1 1 0 1 1-2 0V5.9L9.7 7.2a1 1 0 0 1-1.4-1.4l3-3a1 1 0 0 1 .7-.3ZM6 10a1 1 0 0 1 1 1v8h10v-8a1 1 0 1 1 2 0v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1Z"/></svg>',
    // Android overflow: three dots
    dots: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>',
    plus: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/></svg>'
  };
  function ico(name) { return '<span class="ico">' + icon[name] + '</span>'; }

  const STEPS = {
    ios: [
      'افتح الرابط في <b>Safari</b>.',
      'اضغط زرّ المشاركة ' + ico('share') + ' في شريط Safari (أسفل الشاشة عادةً).',
      'مرّر لأسفل واختر <b>إضافة إلى الشاشة الرئيسية</b> <span class="en">Add to Home Screen</span>.',
      'اضغط <b>إضافة</b> — تظهر الأيقونة مع بقية تطبيقاتك.'
    ],
    android: [
      'افتح الرابط في <b>Chrome</b>.',
      'اضغط زرّ القائمة ' + ico('dots') + ' أعلى الشاشة.',
      'اختر <b>تثبيت التطبيق</b> <span class="en">Install app</span> أو <b>إضافة إلى الشاشة الرئيسية</b>.',
      'أكّد بالضغط على <b>تثبيت</b>.'
    ]
  };

  function showSteps(os) {
    tabs.forEach(t => t.setAttribute('aria-selected', String(t.dataset.os === os)));
    stepsEl.innerHTML = '';
    STEPS[os].forEach(html => {
      const li = document.createElement('li');
      li.innerHTML = '<span class="t">' + html + '</span>';
      stepsEl.appendChild(li);
    });
    const warn = inApp && os === 'ios';
    inappEl.hidden = !warn;
    if (warn) {
      inappEl.innerHTML = 'يبدو أنك تفتح الرابط داخل تطبيق آخر، ولا يمكن التثبيت من هنا: ' +
        'اضغط زرّ الخيارات ' + ico('dots') + ' ثم <b>فتح في Safari</b>، وتابع الخطوات.';
    }
  }

  let lastFocus = null;
  function openGuide() {
    showSteps(isAndroid && !isIOS ? 'android' : 'ios');
    lastFocus = document.activeElement;
    guide.hidden = false;
    shelf.inert = true;
    player.inert = true;
    guideX.focus();
  }
  function closeGuide() {
    guide.hidden = true;
    // never hand the shelf back mid game: the player owns inert then
    if (player.hidden) shelf.inert = false;
    player.inert = false;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  tabs.forEach(t => t.addEventListener('click', () => showSteps(t.dataset.os)));
  guideX.addEventListener('click', closeGuide);
  guide.addEventListener('click', e => { if (e.target === guide) closeGuide(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !guide.hidden) { e.preventDefault(); closeGuide(); }
  });
  howLink.addEventListener('click', openGuide);

  installBtn.addEventListener('click', () => {
    if (!promptEvent) { openGuide(); return; }
    // One tap on Android: the browser's own dialog, then the row is done for good.
    const p = promptEvent;
    promptEvent = null;
    p.prompt();
    p.userChoice.then(r => {
      if (r && r.outcome === 'accepted') installRow.hidden = true;
      else { promptEvent = p; }        // changed their mind; let them try again
    }).catch(() => { promptEvent = p; });
  });

  installX.addEventListener('click', () => {
    installRow.hidden = true;
    try { localStorage.setItem(DISMISS, '1'); } catch (e) { /* storage off */ }
  });

  // Sharing the link is the other half of the same job: this is the page the
  // owner sends, so it may as well hand him the link.
  if (navigator.share || (navigator.clipboard && navigator.clipboard.writeText)) {
    shareBtn.hidden = false;
    shareBtn.textContent = navigator.share ? 'مشاركة الرابط' : 'نسخ الرابط';
    shareBtn.addEventListener('click', () => {
      const url = location.href.split('#')[0];
      if (navigator.share) {
        navigator.share({ title: "Hamad's Games", url: url }).catch(() => {});
        return;
      }
      navigator.clipboard.writeText(url).then(() => {
        shareBtn.textContent = 'نُسخ الرابط ✓';
        setTimeout(() => { shareBtn.textContent = 'نسخ الرابط'; }, 1800);
      }).catch(() => {});
    });
  }

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();                       // keep it for our own button
    promptEvent = e;
    installLabel.textContent = 'ثبّتها على شاشتك الرئيسية';
    maybeOfferInstall();
  });
  window.addEventListener('appinstalled', () => {
    promptEvent = null;
    installRow.hidden = true;
  });

  function maybeOfferInstall() {
    if (installed()) { installRow.hidden = true; return; }
    let hidden = false;
    try { hidden = localStorage.getItem(DISMISS) === '1'; } catch (e) { /* storage off */ }
    if (hidden) return;
    installLabel.textContent = promptEvent || isAndroid || isIOS
      ? 'ثبّتها على شاشتك الرئيسية'
      : 'كيف أضيفها إلى الشاشة الرئيسية؟';
    installRow.hidden = false;
  }
  maybeOfferInstall();

  refreshRegistry();
})();
</script>
</body>
</html>
