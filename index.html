<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bounce</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --ground: #14161c;
    --key: #2b3040;
    --key-down: #3d4460;
    --key-ink: #dfe6f5;
    --amber: #e59a4d;
    --muted: #8a93a8;
    --border: #3a4152;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    position: fixed;
    inset: 0;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    background: var(--ground);
    color: var(--key-ink);
    font-family: Tahoma, "Segoe UI", -apple-system, Arial, sans-serif;
  }
  #shell {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding-inline: 16px;
    padding-block: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-bottom));
  }
  #top {
    display: flex;
    align-items: baseline;
    gap: 12px;
    width: 100%;
    max-width: 720px;
    justify-content: space-between;
    flex: 0 0 auto;
  }
  #brand { font-family: "Courier New", monospace; font-weight: 700; font-size: 16px; letter-spacing: 3px; color: var(--amber); margin: 0; }
  #sub { font-size: 12px; color: var(--muted); direction: rtl; }
  #stage {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game {
    display: block;
    background: #000;
    border: 3px solid var(--border);
    border-radius: 4px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
  }
  #pad {
    flex: 0 0 auto;
    width: 100%;
    max-width: 720px;
    display: none;
    grid-template-columns: 1fr 1fr 1.4fr;
    gap: 10px;
    direction: ltr;
  }
  #pad button {
    height: 72px;
    font-size: 26px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--key);
    color: var(--key-ink);
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.35);
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    padding: 0;
  }
  #pad button.down, #pad button:active {
    background: var(--key-down);
    box-shadow: inset 0 3px 0 rgba(0,0,0,.35);
    transform: translateY(2px);
  }
  #pad button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  #hint { font-size: 12px; color: var(--muted); direction: rtl; text-align: center; flex: 0 0 auto; }
  body.touch #pad { display: grid; }
  body.touch #hint-keys { display: none; }
  body:not(.touch) #hint-touch { display: none; }
  @media (max-height: 460px) {
    #shell { gap: 6px; }
    #top, #hint { display: none; }
    #pad button { height: 56px; font-size: 22px; }
  }
  @media (max-width: 400px) { #sub { display: none; } }
</style>
</head>
<body>
<div id="shell">
  <div id="top">
    <h1 id="brand">BOUNCE</h1>
    <div id="sub">نوكيا، المرحلة الأولى الأصلية</div>
  </div>
  <div id="stage"><canvas id="game" width="384" height="384"></canvas></div>
  <div id="pad">
    <button id="btnL" aria-label="يسار">◀ 4</button>
    <button id="btnR" aria-label="يمين">6 ▶</button>
    <button id="btnJ" aria-label="قفز">2 ▲ قفز</button>
  </div>
  <div id="hint">
    <span id="hint-keys">← → أو 4 / 6 للحركة، ↑ أو 2 أو المسافة للقفز. مرّ عبر كل الحلقات ليُفتح الباب.</span>
    <span id="hint-touch">مرّ عبر كل الحلقات ليُفتح الباب. احذر الأشواك.</span>
  </div>
</div>

  // ------------------------------------------------------------------
  let gX = 0, gY = 0; // ball bounding box top-left during a test
  function rectCollide(ax0, ay0, ax1, ay1, bx0, by0, bx1, by1) {
    return !(ax0 > bx1 || ay0 > by1 || bx0 > ax1 || by0 > ay1);
  }
  function thinCollide(r, c, id) {
    let x0 = c * T, y0 = r * T, x1 = x0 + T, y1 = y0 + T;
    if (THIN_V.has(id)) { x0 += 4; x1 -= 4; } else if (THIN_H.has(id)) { y0 += 4; y1 -= 4; }
    return rectCollide(gX, gY, gX + T, gY + T, x0, y0, x1, y1);
  }
  function edgeCollide(r, c, id) {
    let x0 = c * T, y0 = r * T, x1 = x0 + T, y1 = y0 + T;
    switch (id) {
      case 15: case 19: case 23: case 27: y0 += 6; y1 -= 6; x1 -= 11; break;
      case 16: case 20: case 24: case 28: y0 += 6; y1 -= 6; x0 += 11; break;
      case 13: case 17: x0 += 6; x1 -= 6; y1 -= 11; break;
      case 21: case 25: y1 = y0; y0 -= 1; x0 += 6; x1 -= 6; break;
      case 14: case 18: case 22: case 26: x0 += 6; x1 -= 6; y0 += 11; break;
      default: return false;
    }
    return rectCollide(gX, gY, gX + T, gY + T, x0, y0, x1, y1);
  }
  function squareCollide(r, c) {
    const dx = gX - c * T, dy = gY - r * T;
    let sx0, sx1, sy0, sy1;
    if (dx >= 0) { sx0 = dx; sx1 = T; } else { sx0 = 0; sx1 = T + dx; }
    if (dy >= 0) { sy0 = dy; sy1 = T; } else { sy0 = 0; sy1 = T + dy; }
    if (sx1 > T) sx1 = T;
    if (sy1 > T) sy1 = T;
    for (let sx = sx0; sx < sx1; sx++)
      for (let sy = sy0; sy < sy1; sy++)
        if (BALL_MASK[sy - dy][sx - dx]) return true;
    return false;
  }
  function popBall() {
    ball.pop = 5; ball.state = POPPED; lives--;
    play(SND_POP);
  }
  function addRing() { score += 500; rings++; }

  function testTile(r, c, ok) {
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
    if (ball.state === POPPED) return false;
    const id = map[r][c];
    switch (id) {
      case 1:
        if (squareCollide(r, c)) ok = false;
        break;
      case 3: case 4: case 5: case 6:
        if (thinCollide(r, c, id)) { ok = false; popBall(); }
        break;
      case 7:
        score += 200;
        if (map[ball.respawnR][ball.respawnC] === 8) map[ball.respawnR][ball.respawnC] = 0;
        ball.respawnC = c; ball.respawnR = r;
        map[r][c] = 8;
        play(SND_PICKUP);
        break;
      case 9:
        if (thinCollide(r, c, id)) {
          if (exit.open) { leaveLevel = true; play(SND_PICKUP); }
          else ok = false;
        }
        break;
      case 13:
        if (thinCollide(r, c, id)) {
          if (edgeCollide(r, c, id)) { ok = false; }
          else { addRing(); map[r][c] = 17; map[r + 1][c] = 18; play(SND_HOOP); }
        }
        break;
      case 14:
        if (thinCollide(r, c, id)) { addRing(); map[r][c] = 18; map[r - 1][c] = 17; play(SND_HOOP); }
        break;
      case 15:
        if (thinCollide(r, c, id)) {
          if (edgeCollide(r, c, id)) ok = false;
          addRing(); map[r][c] = 19; map[r][c + 1] = 20; play(SND_HOOP);
        }
        break;
      case 16:
        if (thinCollide(r, c, id)) {
          if (edgeCollide(r, c, id)) ok = false;
          addRing(); map[r][c] = 20; map[r][c - 1] = 19; play(SND_HOOP);
        }
        break;
      case 17: case 19: case 20:
        if (thinCollide(r, c, id) && edgeCollide(r, c, id)) ok = false;
        break;
      case 29:
        score += 1000;
        if (lives < 5) lives++;
        map[r][c] = 0;
        play(SND_PICKUP);
        break;
    }
    return ok;
  }
  function collisionDetection(x, y) {
    gX = x - 6; gY = y - 6;
    const c0 = Math.trunc((x - 6) / T), c1 = Math.trunc((x - 1 + 6) / T) + 1;
    const r0 = Math.trunc((y - 6) / T), r1 = Math.trunc((y - 1 + 6) / T) + 1;
    let ok = true;
    for (let c = c0; c < c1; c++) for (let r = r0; r < r1; r++) ok = testTile(r, c, ok);
    return ok;
  }

  // ------------------------------------------------------------------
  // Ball physics (translated from the original Ball.update, small ball)
  // Speeds are in tenths of a pixel per tick.
  // ------------------------------------------------------------------
  function updateBall() {
    const b = ball;
    if (b.state === POPPED) { b.pop--; if (b.pop === 0) b.state = DEAD; return; }
    const maxGrav = 80, grav = 4;
    if (b.vy < -150) b.vy = -150; else if (b.vy > 150) b.vy = 150;
    if (b.vx < -150) b.vx = -150; else if (b.vx > 150) b.vx = 150;

    for (let i = 0; i < Math.trunc(Math.abs(b.vy) / 10); i++) {
      const s = b.vy === 0 ? 0 : (b.vy < 0 ? -1 : 1);
      if (collisionDetection(b.x, b.y + s)) { b.y += s; b.grounded = false; }
      else if (s > 0) {
        b.vy = Math.trunc(-b.vy / 2);
        b.grounded = true;
        b.jumpOffset = 0;
        if (b.vy < 10 && b.vy > -10) b.vy = 10;
        break;
      } else if (s < 0) {
        b.vy = (-b.vy) >> 1;
      }
    }
    if (!b.grounded && b.vy < maxGrav) { b.vy += grav; if (b.vy > maxGrav) b.vy = maxGrav; }

    const maxH = 50;
    if (b.dir & RIGHT) { if (b.vx < maxH) b.vx += 6; }
    else if (b.dir & LEFT) { if (b.vx > -maxH) b.vx -= 6; }
    else if (b.vx > 0) b.vx -= 4;
    else if (b.vx < 0) b.vx += 4;

    if (b.grounded && (b.dir & UP)) { b.vy = -67 + b.jumpOffset; b.grounded = false; }

    const steps = Math.trunc(Math.abs(b.vx) / 10);
    for (let i = 0; i < steps; i++) {
      const s = b.vx === 0 ? 0 : (b.vx < 0 ? -1 : 1);
      if (collisionDetection(b.x + s, b.y)) b.x += s;
      else b.vx = -(b.vx >> 1);
    }
  }

  function tick() {
    if (mode !== 'play') return;
    if (levelCntr > 0) levelCntr--;
    updateBall();
    if (ball.state === DEAD) {
      if (lives < 0) { setMode('over'); return; }
      respawn();
    }
    if (rings === totalRings) exit.opening = true;
    if (exit.opening && !exit.open) {
      exit.offset += 4;
      if (exit.offset >= 24) { exit.offset = 24; exit.open = true; }
    }
    if (leaveLevel) { score += 5000; setMode('complete'); }
    camX = Math.max(0, Math.min(LEVEL_W - SW, ball.x - SW / 2));
  }

  // ------------------------------------------------------------------
  // Rendering
  // ------------------------------------------------------------------
  function drawGame() {
    g.fillStyle = BG; g.fillRect(0, 0, SW, GA_H);
    const cx = Math.trunc(camX);
    const c0 = Math.trunc(cx / T), c1 = Math.min(COLS - 1, Math.trunc((cx + SW - 1) / T));
    const front = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = c0; c <= c1; c++) {
        const id = map[r][c], sx = c * T - cx, sy = r * T;
        if (SIMPLE[id] !== undefined) g.drawImage(IMG[SIMPLE[id]], sx, sy);
        else if (HOOP_BACK[id] !== undefined) { g.drawImage(IMG[HOOP_BACK[id]], sx, sy); front.push([IMG[HOOP_FRONT[id]], sx, sy]); }
      }
    }
    const ex = exit.col * T - cx;
    if (ex > -24 && ex < SW) g.drawImage(EXIT_IMG, 0, exit.offset, 24, 24, ex, exit.row * T, 24, 24);
    if (ball.state === POPPED) g.drawImage(IMG[48], ball.x - 6 - cx, ball.y - 6);
    else if (ball.state === NORMAL) g.drawImage(IMG[47], ball.x - 6 - cx, ball.y - 6);
    for (const [im, x, y] of front) g.drawImage(im, x, y);
    if (levelCntr > 0) drawText('Level 1', 44, 85, WHITE);
    // HUD
    g.fillStyle = '#ffffff'; g.fillRect(0, GA_H, SW, 1);
    g.fillStyle = HUD_BG; g.fillRect(0, 97, SW, 31);
    for (let i = 0; i < lives; i++) g.drawImage(UI_LIFE, 5 + i * 11, 99);
    for (let i = 0; i < totalRings - rings; i++) g.drawImage(UI_RING, 5 + i * 8, 112);
    drawText(String(score).padStart(8, '0'), 64, 101, WHITE);
  }
  function drawSplash() {
    g.drawImage(SPLASH, 0, 0);
    g.fillStyle = SPLASH_BG; g.fillRect(0, 0, SW, 18);
    if (Math.floor(performance.now() / 500) % 2 === 0) centerText('New game', 112, '#000000');
  }
  function drawDialog(lines, prompt) {
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, SW, SW);
    let y = 22;
    for (const ln of lines) { centerText(ln, y, '#000000'); y += 12; }
    g.fillStyle = HUD_BG; g.fillRect(0, 108, SW, 20);
    centerText(prompt, 114, WHITE);
  }
  function draw() {
    if (mode === 'splash') drawSplash();
    else if (mode === 'play') drawGame();
    else if (mode === 'complete') drawDialog(['Level 1', 'completed!', '', 'Score', String(score).padStart(8, '0')], 'Continue');
    else if (mode === 'over') drawDialog(['Game over', '', 'Score', String(score).padStart(8, '0')], 'New game');
    vctx.imageSmoothingEnabled = false;
    vctx.drawImage(screen, 0, 0, view.width, view.height);
  }

  // ------------------------------------------------------------------
  // Sizing: integer scale in device pixels for crisp pixels
  // ------------------------------------------------------------------
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const stage = document.getElementById('stage');
    const aw = stage.clientWidth, ah = stage.clientHeight;
    let k = Math.floor((Math.min(aw, ah) - 8) * dpr / SW);
    if (k < 1) k = 1;
    view.width = view.height = SW * k;
    view.style.width = view.style.height = (SW * k / dpr) + 'px';
    if (IMG[0]) draw();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));

  // ------------------------------------------------------------------
  // Input
  // ------------------------------------------------------------------
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || window.matchMedia('(hover: none)').matches;
  if (isTouch) document.body.classList.add('touch');
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  function press() { if (mode !== 'play' && performance.now() - modeSince > 400) newGame(); }
  function setKey(k, on) {
    held[k] = on;
    ball.dir = heldDir();
  }
  const KEYMAP = {
    ArrowLeft: 'left', KeyA: 'left', Digit4: 'left', Numpad4: 'left',
    ArrowRight: 'right', KeyD: 'right', Digit6: 'right', Numpad6: 'right',
    ArrowUp: 'up', KeyW: 'up', Space: 'up', Digit2: 'up', Numpad2: 'up', Digit5: 'up', Numpad5: 'up'
  };
  window.addEventListener('keydown', e => {
    unlockAudio();
    const k = KEYMAP[e.code];
    if (k) { e.preventDefault(); if (!e.repeat) setKey(k, true); }
    if (mode !== 'play' && !e.repeat && (k || e.code === 'Enter')) press();
  });
  window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) setKey(k, false); });
  window.addEventListener('blur', () => { setKey('left', false); setKey('right', false); setKey('up', false); });

  function bindTouch(id, k) {
    const el = document.getElementById(id);
    const on = e => { e.preventDefault(); unlockAudio(); setKey(k, true); el.classList.add('down'); if (mode !== 'play') press(); };
    const off = e => { e.preventDefault(); setKey(k, false); el.classList.remove('down'); };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('pointerleave', off);
    el.addEventListener('touchend', off, { passive: false });
  }
  bindTouch('btnL', 'left'); bindTouch('btnR', 'right'); bindTouch('btnJ', 'up');
  view.addEventListener('pointerdown', e => { e.preventDefault(); unlockAudio(); press(); });

  // ------------------------------------------------------------------
  // Loop: fixed 40 ms ticks
  // ------------------------------------------------------------------
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(200, now - last); last = now;
    while (acc >= TICK_MS) { tick(); acc -= TICK_MS; }
    draw();
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { last = performance.now(); acc = 0; });

  window.__bounce = () => ({ mode, x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy, rings, lives, score, exitOpen: exit.open, state: ball.state });
  window.__bounceDbg = { teleport(x, y) { ball.x = x; ball.y = y; ball.vx = 0; ball.vy = 0; ball.grounded = false; }, collectAll() { for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { if (map[r][c] === 13) { map[r][c] = 17; rings++; } else if (map[r][c] === 14) map[r][c] = 18; else if (map[r][c] === 15) { map[r][c] = 19; rings++; } else if (map[r][c] === 16) map[r][c] = 20; } } };

  loadGraphics().then(() => { buildLevel(); resize(); requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
