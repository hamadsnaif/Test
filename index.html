<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14171c">
<meta name="apple-mobile-web-app-title" content="Hamad's Games">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="./icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="./icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="./icon-120.png">
<link rel="icon" sizes="192x192" href="./icon-192.png" type="image/png">
<link rel="icon" sizes="512x512" href="./icon-512.png" type="image/png">
<title>Hamad's Games</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
  :root {
    --case: #14171c;
    --surface: #1c2128;
    --surface-hi: #232a33;
    --edge: #2b323c;
    --ink: #e9eef6;
    --dim: #8d97a6;
    --accent: #e59a4d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--case);
    color: var(--ink);
    font-family: "IBM Plex Sans Arabic", Tahoma, -apple-system, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
    direction: rtl;
  }

  /* ---------- launcher ---------- */
  #shelf {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    padding-inline: 16px;
    padding-block: max(28px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-bottom));
  }
  header { width: 100%; max-width: 520px; text-align: center; }
  #wordmark {
    font-family: Silkscreen, "Courier New", monospace;
    font-weight: 700;
    font-size: clamp(22px, 7vw, 34px);
    letter-spacing: 2px;
    color: var(--ink);
    margin: 0;
    direction: ltr;
  }
  #rule {
    width: 64px; height: 3px;
    background: var(--accent);
    margin: 12px auto 10px;
    border-radius: 2px;
  }
  #tagline { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.6; }

  #list {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .tile {
    position: relative;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 14px 16px 14px 20px;
    background: var(--surface);
    border: 1px solid var(--edge);
    border-radius: 14px;
    color: inherit;
    font: inherit;
    text-align: start;
    cursor: pointer;
    overflow: hidden;
  }
  .tile::before {
    content: "";
    position: absolute;
    inset-inline-start: 0;
    top: 0; bottom: 0;
    width: 5px;
    background: var(--stripe);
  }
  .tile:hover, .tile:focus-visible { background: var(--surface-hi); }
  .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tile:active { transform: translateY(1px); }
  .tile canvas {
    width: 72px; height: 72px;
    border-radius: 8px;
    image-rendering: pixelated;
    display: block;
    border: 1px solid var(--edge);
  }
  .name { margin: 0 0 2px; font-size: 17px; font-weight: 600; }
  .latin {
    font-family: Silkscreen, "Courier New", monospace;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--stripe);
    direction: ltr;
    display: block;
    margin-bottom: 5px;
  }
  .desc { margin: 0; font-size: 13px; line-height: 1.5; color: var(--dim); }
  .chev { color: var(--dim); font-size: 22px; line-height: 1; }

  footer {
    width: 100%; max-width: 520px;
    color: var(--dim);
    font-size: 12.5px;
    line-height: 1.7;
    text-align: center;
    margin-top: auto;
    padding-top: 8px;
  }

  /* ---------- player ----------
     A slim bar carries the way back. The three games all put controls in
     their own top corners, so a floating button would sit on top of one of
     them; a bar of its own never collides with anything. */
  #player {
    position: fixed;
    inset: 0;
    background: var(--case);
    z-index: 50;
    display: flex;
    flex-direction: column;
  }
  #player[hidden] { display: none !important; }
  #bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    height: 36px;
    box-sizing: content-box;
    padding-top: env(safe-area-inset-top);
    padding-inline: 6px max(10px, env(safe-area-inset-right));
    background: var(--surface);
    border-bottom: 1px solid var(--edge);
  }
  #back {
    min-width: 58px; height: 30px;
    border-radius: 9px;
    border: 1px solid var(--edge);
    background: var(--case);
    color: var(--ink);
    font-size: 13px;
    font-family: inherit;
    line-height: 1;
    padding: 0 10px;
    cursor: pointer;
    flex: 0 0 auto;
  }
  #back:active { background: var(--surface-hi); }
  #back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #playing-name { font-size: 13.5px; font-weight: 500; color: var(--dim); }
  #frame { flex: 1 1 auto; width: 100%; border: 0; display: block; min-height: 0; }
  body.playing { overflow: hidden; }

  @media (max-width: 400px) {
    .tile { gap: 11px; padding: 12px 12px 12px 16px; }
    .tile canvas { width: 60px; height: 60px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile:active { transform: none; }
  }
</style>
</head>
<body>
<div id="shelf">
  <header>
    <h1 id="wordmark">HAMAD'S GAMES</h1>
    <div id="rule"></div>
    <p id="tagline">ثلاث ألعاب من زمن هواتف نوكيا، أُعيد بناؤها للمتصفح. اختر لعبة لتبدأ.</p>
  </header>

  <div id="list"></div>

  <footer>
    كل لعبة تعمل مستقلة بأصواتها وحفظ نتائجها. أضف الصفحة إلى الشاشة الرئيسية من Safari لتعمل بملء الشاشة وبدون إنترنت.
  </footer>
</div>

<div id="player" hidden>
  <div id="bar">
    <button id="back" type="button" aria-label="رجوع إلى قائمة الألعاب">رجوع</button>
    <span id="playing-name"></span>
  </div>
</div>

<script>
(function () {
  'use strict';

  const SOURCES = {"bounce": {"src": "bounce.html"}, "snake": {"src": "snake.html"}, "tetris": {"src": "tetris.html"}};

  // ------------------------------------------------------------------
  // Thumbnails: each one is a 32x32 pixel scene drawn from the game it
  // opens, so the tile shows the world you are about to enter.
  // ------------------------------------------------------------------
  function px(c, x, y, w, h, color) { c.fillStyle = color; c.fillRect(x, y, w, h); }

  function drawBounce(c) {
    px(c, 0, 0, 32, 32, '#b0e0f0');
    for (let x = 0; x < 32; x += 8) {
      px(c, x, 24, 8, 8, '#c8722a');
      px(c, x, 24, 7, 3, '#e59a4d');
      px(c, x, 28, 7, 3, '#e59a4d');
    }
    px(c, 0, 24, 32, 1, '#8b4a16');
    c.fillStyle = '#8f0d0a';
    c.beginPath(); c.arc(16, 15, 8, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#e8231f';
    c.beginPath(); c.arc(16, 15, 7, 0, Math.PI * 2); c.fill();
    px(c, 12, 10, 3, 2, '#ff8c8c');
  }

  function drawSnake(c) {
    px(c, 0, 0, 32, 32, '#9bbc0f');
    px(c, 0, 0, 32, 32, '#9bbc0f');
    const body = [[6, 20], [10, 20], [14, 20], [18, 20], [18, 16], [18, 12], [22, 12]];
    for (const [x, y] of body) { px(c, x, y, 4, 4, '#0f380f'); px(c, x, y, 3, 3, '#306230'); }
    px(c, 22, 12, 4, 4, '#0f380f');
    px(c, 8, 8, 4, 4, '#0f380f');
    px(c, 9, 9, 2, 2, '#9bbc0f');
  }

  function drawTetris(c) {
    px(c, 0, 0, 32, 32, '#1a1813');
    const blocks = [
      [4, 20, '#5ab7c4'], [10, 20, '#5ab7c4'], [16, 20, '#5ab7c4'], [22, 20, '#5ab7c4'],
      [4, 26, '#e0a45e'], [10, 26, '#e3c65f'], [16, 26, '#7fbe74'], [22, 26, '#b48bd6'],
      [10, 8, '#df8179'], [16, 8, '#df8179'], [16, 14, '#df8179'], [22, 14, '#df8179']
    ];
    for (const [x, y, col] of blocks) {
      px(c, x, y, 6, 6, col);
      px(c, x, y, 6, 1, '#fffaf0');
      px(c, x, y + 5, 6, 1, 'rgba(0,0,0,.35)');
    }
  }

  const GAMES = [
    {
      id: 'bounce', ar: 'الكرة الحمراء', en: 'BOUNCE', stripe: '#e8231f', draw: drawBounce,
      desc: 'المراحل الإحدى عشرة الأصلية برسومها وفيزيائها، مع حفظ التقدم واختيار نظام التحكم.'
    },
    {
      id: 'snake', ar: 'الدودة', en: 'SNAKE II', stripe: '#9bbc0f', draw: drawSnake,
      desc: 'أسطورة نوكيا على شاشة خضراء، بسرعات متدرجة وأعلى نتيجة محفوظة.'
    },
    {
      id: 'tetris', ar: 'تتريس', en: 'TETRIS', stripe: '#e0a45e', draw: drawTetris,
      desc: 'القطع الكلاسيكية بطابع نوكيا، بموسيقى ومؤثرات وأزرار مهيأة للمس.'
    }
  ];

  // ------------------------------------------------------------------
  // Launcher
  // ------------------------------------------------------------------
  const list = document.getElementById('list');
  const player = document.getElementById('player');
  const bar = document.getElementById('bar');
  const back = document.getElementById('back');
  const playingName = document.getElementById('playing-name');

  for (const g of GAMES) {
    const tile = document.createElement('button');
    tile.type = 'button';
    tile.className = 'tile';
    tile.style.setProperty('--stripe', g.stripe);
    tile.setAttribute('aria-label', 'تشغيل لعبة ' + g.ar);

    const cv = document.createElement('canvas');
    cv.width = cv.height = 32;
    g.draw(cv.getContext('2d'));

    const mid = document.createElement('div');
    const h = document.createElement('p');
    h.className = 'name';
    h.textContent = g.ar;
    const en = document.createElement('span');
    en.className = 'latin';
    en.textContent = g.en;
    const d = document.createElement('p');
    d.className = 'desc';
    d.textContent = g.desc;
    mid.append(h, en, d);

    const chev = document.createElement('span');
    chev.className = 'chev';
    chev.setAttribute('aria-hidden', 'true');
    chev.textContent = '‹';

    tile.append(cv, mid, chev);
    tile.addEventListener('click', () => open(g.id));
    list.appendChild(tile);
  }

  let decoder = null;
  function decode(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    decoder = decoder || new TextDecoder('utf-8');
    return decoder.decode(bytes);
  }

  // A fresh iframe per launch: the first load of a new frame does not add a
  // history entry, and removing it on exit stops the game's loop and audio
  // outright, so every game starts clean and nothing keeps running behind the
  // launcher.
  function open(id) {
    const s = SOURCES[id];
    if (!s) return;
    const game = GAMES.find(g => g.id === id);
    playingName.textContent = game ? game.ar : '';
    const frame = document.createElement('iframe');
    frame.id = 'frame';
    frame.title = 'اللعبة';
    frame.setAttribute('allow', 'autoplay');
    if (s.src) frame.src = s.src;
    else frame.srcdoc = decode(s.b64);
    player.replaceChildren(bar, frame);
    document.body.classList.add('playing');
    player.hidden = false;
    history.pushState({ hg: id }, '');
    setTimeout(() => { try { frame.contentWindow.focus(); } catch (e) { /* cross document */ } }, 60);
  }

  function close(fromPop) {
    if (player.hidden) return;
    player.replaceChildren(bar);
    player.hidden = true;
    document.body.classList.remove('playing');
    if (!fromPop && history.state && history.state.hg) history.back();
  }

  back.addEventListener('click', () => close(false));
  window.addEventListener('popstate', () => close(true));
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(err => console.error('service worker registration failed', err)); });
}
</script>
</body>
</html>
